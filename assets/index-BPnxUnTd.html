<!DOCTYPE html>
<html>
<head>
    <title>Mindfulness Pinball</title>

    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iZ3JleSIvPjwvc3ZnPg==" />
    <!-- Prevent pinch / double‑tap zoom while keeping responsiveness -->
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <!-- Nice free Google font – optional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">

    <style>
/* =========  BASIC COLOUR THEME  ========= */
:root {
  --bg-1: #2d2d2d;        /* page background */
  --accent-1: #ff452a;    /* flipper + button gradient start */
  --accent-2: #ffb347;    /* flipper + button gradient end   */
  --text-main: #fafafa;
  --text-dim:  #c0c0c0;
  --radius: 4px;
}

/* =========  PAGE LAYOUT  ========= */
html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;                 /* use dynamic vh so iOS toolbars don't break it */
  overflow: hidden;               /* **kills the vertical / horizontal scroll**   */
  background: var(--bg-1);
  color: var(--text-main);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent; /* removes grey flash on iOS */
  touch-action: none;     /* **stops double‑tap zoom in most browsers**   */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

/* =========  CONTAINER  ========= */
#gameContainer {
  width: min(90vw, 460px);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* =========  CONTROL BAR  ========= */
#controls {
  width: 100%;
  text-align: center;
  margin-block: 12px 8px;
  font-size: 0.9rem;
  color: var(--text-dim);
}

#controls button {
  all: unset;                      /* wipe default button styles */
  cursor: pointer;
  display: inline-block;
  margin: 6px auto;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.95rem;
  color: #fff;
  background: var(--accent-1);
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
  transition: transform .12s ease, box-shadow .12s ease;
}
#controls button:hover,
#controls button:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(0,0,0,.55);
}
#controls button:active {
  transform: scale(.97);
}

/* =========  CANVAS  ========= */
canvas {
  width: 100%;
  aspect-ratio: 1 / 1.7;          /* keeps exact sim ratio */
  border-radius: var(--radius);
  touch-action: manipulation;    /* ← turn off browser panning/zoom so pointermove/up always fire */
}

/* =========  SMALL‑SCREEN TWEAKS  ========= */
#controls button {
  padding: 10px 16px;
  font-size: 0.85rem;
}

#buttonRow {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  container-type: inline-size;
}

#buttonRow > button {
  margin: 0;
}

@container (max-width: 330px) {
  #stepBtn,
  #dumpBtn {
    display: none;
  }
}

@supports not (container-type: inline-size) {
  @media (max-width: 370px) {
    #stepBtn,
    #dumpBtn {
      display: none;
    }
  }
}
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="controls">
          <div id="buttonRow">
            <button id="pauseBtn" tabindex="-1">Pause</button>
            <button id="resetBtn" tabindex="-1">Reset</button>
            <button id="stepBtn">Step</button>
            <button id="dumpBtn" tabindex="-1">Dump State</button>
          </div>
          <div id="cableFeatureFlags"></div>
          <div id="scoreRow">Score: <span id="score">0</span></div>
          <div id="stats" style="margin-top: 4px; font-size: 0.8rem;">
            dt: <span id="dt">N/A</span> |
            Speed: <span id="speed">N/A</span>
          </div>
        </div>
        <canvas id="myCanvas"></canvas>
    </div>
<script type="module">
    import Vector2 from '../../../src/js/cable_joints/vector2.js';
    import { dumpWorldState } from '../../../src/js/cable_joints/debugUtils.js';
    import {
      Open as UsdOpen,
    } from "../../../src/js/usd/stage.js";
    import {
      World,
      PositionComponent,
    } from '../../../src/js/cable_joints/ecs.js';

    import {
      tangentFromPointToCircle,
      tangentFromCircleToPoint,
      tangentFromCircleToCircle
    } from '../../../src/js/cable_joints/geometry.js';

    import {
      BallTagComponent,
      ScoredTagComponent,
      ScoreComponent
    } from './flipper_common.js';


    import { runGame } from './runner.js';

    import { setupScene } from './setupScene.js';
    import {
      bindCableFeatureFlagCheckboxes,
      ensureCableFeatureFlags,
      getCableFeatureFlags,
      setCableFeatureFlags
    } from './cable_feature_flags.js';

    // --- Global Setup ---
    const canvas = document.getElementById("myCanvas");
    const gameContainer = document.getElementById("gameContainer");
    const controlsElement = document.getElementById("controls");
    const cableFeatureFlags = document.getElementById("cableFeatureFlags");
    const scoreElement = document.getElementById("score");
    const scoreRow = document.getElementById("scoreRow");
    const statsElement = document.getElementById("stats");
    const stepBtn = document.getElementById("stepBtn");
    const dumpBtn = document.getElementById("dumpBtn");

    // --- Global World ---
    let world = new World();
    window.world = world; // Make available to jest test

    let getGameStateForTest = () => {
        if (!world || !world.query) { // Check if world and its methods are available
            console.error("World object not available for getGameStateForTest");
            return null;
        }

        const ballEntities = world.query([BallTagComponent, PositionComponent]);
        const balls = ballEntities.map(id => {
            const posComp = world.getComponent(id, PositionComponent);
            return { id, y: posComp ? posComp.pos.y : -Infinity }; // Handle missing component
        });

        const scoreEntity = world.query([ScoreComponent])[0];
        const scoreComp = scoreEntity !== undefined ? world.getComponent(scoreEntity, ScoreComponent) : null;
        const score = scoreComp ? scoreComp.value : -1; // Default to -1 if score component not found

        return {
            balls,
            score
        };
    };
    window.getGameStateForTest = getGameStateForTest;

    const cableFlagUi = bindCableFeatureFlagCheckboxes(world, cableFeatureFlags);
    const SCORE_BOUNCE_FLAG_ID = 'cableFlag_scoreBounceSoundEnabled';
    if (canvas && !canvas.hasAttribute('tabindex')) {
      canvas.setAttribute('tabindex', '0');
    }
    const _focusCanvas = () => {
      if (!canvas || typeof canvas.focus !== 'function') {
        return;
      }
      try {
        canvas.focus({ preventScroll: true });
      } catch (_err) {
        canvas.focus();
      }
    };
    const _queueCanvasFocus = () => {
      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(() => _focusCanvas());
        return;
      }
      setTimeout(() => _focusCanvas(), 0);
    };

    const _setHidden = (element, hidden) => {
      if (element) {
        element.hidden = !!hidden;
      }
    };

    const _readPx = (value) => {
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) ? parsed : 0;
    };

    const _setCableCheckboxVisibility = ({ hideNonAudio, hideAudio }) => {
      if (!cableFeatureFlags) {
        return;
      }
      const labels = cableFeatureFlags.querySelectorAll('label');
      let anyVisible = false;
      for (const label of labels) {
        const input = label.querySelector('input[type="checkbox"]');
        const isAudioCheckbox = input && input.id === SCORE_BOUNCE_FLAG_ID;
        const shouldHide = isAudioCheckbox ? hideAudio : hideNonAudio;
        label.hidden = !!shouldHide;
        if (!label.hidden) {
          anyVisible = true;
        }
      }
      cableFeatureFlags.hidden = !anyVisible;
    };

    const _restoreAllMobileControls = () => {
      _setHidden(statsElement, false);
      _setHidden(dumpBtn, false);
      _setHidden(stepBtn, false);
      _setHidden(scoreRow, false);
      _setCableCheckboxVisibility({ hideNonAudio: false, hideAudio: false });
    };

    const _viewportHeight = () => {
      if (window.visualViewport && Number.isFinite(window.visualViewport.height)) {
        return window.visualViewport.height;
      }
      return window.innerHeight || document.documentElement.clientHeight || 0;
    };

    const _viewportWidth = () => {
      if (window.visualViewport && Number.isFinite(window.visualViewport.width)) {
        return window.visualViewport.width;
      }
      return window.innerWidth || document.documentElement.clientWidth || 0;
    };

    const _baseGameWidth = () => {
      return Math.min(_viewportWidth() * 0.9, 460);
    };

    const _resetGameContainerWidth = () => {
      if (!gameContainer) {
        return;
      }
      const baseWidth = _baseGameWidth();
      gameContainer.style.width = baseWidth > 0 ? `${baseWidth}px` : '';
    };

    const _controlsOuterHeight = () => {
      if (!controlsElement || controlsElement.hidden) {
        return 0;
      }
      const rect = controlsElement.getBoundingClientRect();
      const style = window.getComputedStyle ? window.getComputedStyle(controlsElement) : null;
      const marginTop = style ? _readPx(style.marginTop) : 0;
      const marginBottom = style ? _readPx(style.marginBottom) : 0;
      return rect.height + marginTop + marginBottom;
    };

    const _targetCanvasHeight = () => {
      if (!canvas || canvas.hidden) {
        return 0;
      }
      const canvasRect = canvas.getBoundingClientRect();
      const fallbackWidth = _baseGameWidth();
      const canvasWidth =
        canvasRect.width ||
        (gameContainer ? gameContainer.getBoundingClientRect().width : 0) ||
        fallbackWidth;
      if (canvasWidth > 0) {
        return canvasWidth * 1.7;
      }
      return canvasRect.height;
    };

    const _gameFitsViewportHeight = () => {
      const viewportHeight = _viewportHeight();
      const topOffset = gameContainer ? Math.max(0, gameContainer.getBoundingClientRect().top) : 0;
      const requiredHeight = topOffset + _controlsOuterHeight() + _targetCanvasHeight();
      return requiredHeight <= viewportHeight + 0.5;
    };

    const _scaleGameToViewportHeight = () => {
      if (!gameContainer) {
        return;
      }
      const baseWidth = _baseGameWidth();
      if (!(baseWidth > 0)) {
        return;
      }

      let targetWidth = baseWidth;
      for (let i = 0; i < 4; i++) {
        gameContainer.style.width = `${Math.max(1, targetWidth)}px`;
        const topOffset = Math.max(0, gameContainer.getBoundingClientRect().top);
        const availableForCanvas = _viewportHeight() - topOffset - _controlsOuterHeight();
        const nextWidth = Math.min(baseWidth, availableForCanvas / 1.7);
        if (!(nextWidth > 0)) {
          break;
        }
        if (Math.abs(nextWidth - targetWidth) < 0.5) {
          targetWidth = nextWidth;
          break;
        }
        targetWidth = nextWidth;
      }

      const finalWidth = Math.max(64, Math.min(baseWidth, targetWidth));
      gameContainer.style.width = `${finalWidth}px`;
    };

    const _pruneControlsToFitViewportHeight = () => {
      _resetGameContainerWidth();
      _restoreAllMobileControls();
      if (_gameFitsViewportHeight()) {
        return;
      }

      const pruneSteps = [
        () => _setCableCheckboxVisibility({ hideNonAudio: true, hideAudio: false }),
        () => _setHidden(statsElement, true),
        () => _setHidden(dumpBtn, true),
        () => _setHidden(stepBtn, true),
        () => _setCableCheckboxVisibility({ hideNonAudio: true, hideAudio: true }),
        () => _setHidden(scoreRow, true)
      ];

      for (const prune of pruneSteps) {
        prune();
        if (_gameFitsViewportHeight()) {
          break;
        }
      }

      if (!_gameFitsViewportHeight()) {
        _scaleGameToViewportHeight();
      }
    };

    let _queuedViewportPrune = false;
    const _queueViewportPrune = () => {
      if (_queuedViewportPrune) {
        return;
      }
      _queuedViewportPrune = true;
      const run = () => {
        _queuedViewportPrune = false;
        _pruneControlsToFitViewportHeight();
      };
      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(run);
      } else {
        setTimeout(run, 0);
      }
    };

    _queueViewportPrune();
    window.addEventListener('resize', _queueViewportPrune);
    window.addEventListener('orientationchange', _queueViewportPrune);
    window.addEventListener('load', _queueViewportPrune);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', _queueViewportPrune);
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => _queueViewportPrune()).catch(() => {});
    }
    setTimeout(_queueViewportPrune, 120);
    setTimeout(_queueViewportPrune, 450);

    let scoreAudioContext = null;
    let scoreAudioMasterGain = null;
    let lastScoreForSound = null;
    let scoreAudioUnlockBound = false;
    let scoreExplosionNoiseBuffer = null;

    const _ensureScoreAudioContext = () => {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        return null;
      }
      if (!scoreAudioContext) {
        scoreAudioContext = new AudioCtx();
        scoreAudioMasterGain = scoreAudioContext.createGain();
        scoreAudioMasterGain.gain.value = 0.28;
        scoreAudioMasterGain.connect(scoreAudioContext.destination);
      }
      if (scoreAudioContext.state === 'suspended') {
        scoreAudioContext.resume().catch(() => {});
      }
      return scoreAudioContext;
    };

    const _ensureScoreExplosionNoiseBuffer = (ctx) => {
      if (!ctx) {
        return null;
      }
      if (
        scoreExplosionNoiseBuffer &&
        scoreExplosionNoiseBuffer.sampleRate === ctx.sampleRate
      ) {
        return scoreExplosionNoiseBuffer;
      }
      const durationSec = 0.42;
      const length = Math.max(1, Math.floor(ctx.sampleRate * durationSec));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) {
        const t = i / length;
        const decay = Math.pow(1.0 - t, 2.8);
        const white = (Math.random() * 2.0 - 1.0);
        const crackle = (Math.random() < 0.02) ? (Math.random() * 2.0 - 1.0) * 2.0 : 0.0;
        channel[i] = (0.9 * white + crackle) * decay;
      }
      scoreExplosionNoiseBuffer = buffer;
      return scoreExplosionNoiseBuffer;
    };

    const _playScoreBounceSound = (count = 1) => {
      if (world.getResource('scoreBounceSoundEnabled') !== true) {
        return;
      }
      const ctx = _ensureScoreAudioContext();
      if (!ctx || !scoreAudioMasterGain) {
        return;
      }
      const noiseBuffer = _ensureScoreExplosionNoiseBuffer(ctx);
      if (!noiseBuffer) {
        return;
      }
      const hitCount = Math.max(1, Math.min(2, Number.isFinite(count) ? Math.floor(count) : 1));
      const tStart = ctx.currentTime + 0.004;
      for (let i = 0; i < hitCount; i++) {
        const t0 = tStart + i * 0.028;
        const hitBus = ctx.createGain();
        hitBus.gain.setValueAtTime(1.0, t0);
        hitBus.connect(scoreAudioMasterGain);

        // Low thump body.
        const thumpOsc = ctx.createOscillator();
        thumpOsc.type = 'triangle';
        thumpOsc.frequency.setValueAtTime(180, t0);
        thumpOsc.frequency.exponentialRampToValueAtTime(52, t0 + 0.17);
        const thumpFilter = ctx.createBiquadFilter();
        thumpFilter.type = 'lowpass';
        thumpFilter.frequency.setValueAtTime(620, t0);
        thumpFilter.frequency.exponentialRampToValueAtTime(180, t0 + 0.18);
        const thumpGain = ctx.createGain();
        thumpGain.gain.setValueAtTime(0.0001, t0);
        thumpGain.gain.exponentialRampToValueAtTime(0.24, t0 + 0.01);
        thumpGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        thumpOsc.connect(thumpFilter);
        thumpFilter.connect(thumpGain);
        thumpGain.connect(hitBus);
        thumpOsc.start(t0);
        thumpOsc.stop(t0 + 0.22);

        // Filtered noise burst.
        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        noiseSource.playbackRate.setValueAtTime(0.72 + Math.random() * 0.16, t0);
        const noiseBand = ctx.createBiquadFilter();
        noiseBand.type = 'bandpass';
        noiseBand.frequency.setValueAtTime(880 + Math.random() * 240, t0);
        noiseBand.Q.setValueAtTime(0.85, t0);
        const noiseLow = ctx.createBiquadFilter();
        noiseLow.type = 'lowpass';
        noiseLow.frequency.setValueAtTime(3200, t0);
        noiseLow.frequency.exponentialRampToValueAtTime(1200, t0 + 0.2);
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.0001, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.26, t0 + 0.012);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
        noiseSource.connect(noiseBand);
        noiseBand.connect(noiseLow);
        noiseLow.connect(noiseGain);
        noiseGain.connect(hitBus);
        noiseSource.start(t0);
        noiseSource.stop(t0 + 0.25);

        // Tiny bright crack at onset.
        const crackOsc = ctx.createOscillator();
        crackOsc.type = 'square';
        crackOsc.frequency.setValueAtTime(1750, t0);
        crackOsc.frequency.exponentialRampToValueAtTime(780, t0 + 0.045);
        const crackHigh = ctx.createBiquadFilter();
        crackHigh.type = 'highpass';
        crackHigh.frequency.setValueAtTime(1000, t0);
        const crackGain = ctx.createGain();
        crackGain.gain.setValueAtTime(0.0001, t0);
        crackGain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.0035);
        crackGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
        crackOsc.connect(crackHigh);
        crackHigh.connect(crackGain);
        crackGain.connect(hitBus);
        crackOsc.start(t0);
        crackOsc.stop(t0 + 0.055);
      }
    };

    const _readScoreValue = () => {
      const scoreEntity = world.query([ScoreComponent])[0];
      if (scoreEntity !== undefined) {
        const scoreComp = world.getComponent(scoreEntity, ScoreComponent);
        if (scoreComp && Number.isFinite(scoreComp.value)) {
          return scoreComp.value;
        }
      }
      if (scoreElement) {
        const parsed = Number.parseInt(scoreElement.textContent ?? '', 10);
        if (Number.isFinite(parsed)) {
          return parsed;
        }
      }
      return null;
    };

    const _monitorScoreForSound = () => {
      const scoreValue = _readScoreValue();
      if (Number.isFinite(scoreValue)) {
        if (!Number.isFinite(lastScoreForSound)) {
          lastScoreForSound = scoreValue;
        } else {
          const delta = scoreValue - lastScoreForSound;
          if (delta > 0) {
            _playScoreBounceSound(delta);
          }
          lastScoreForSound = scoreValue;
        }
      }

      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(_monitorScoreForSound);
      } else {
        setTimeout(_monitorScoreForSound, 16);
      }
    };

    if (cableFeatureFlags) {
      cableFeatureFlags.addEventListener('change', (event) => {
        const target = event.target;
        if (target && target.tagName === 'INPUT' && target.type === 'checkbox') {
          if (target.id === SCORE_BOUNCE_FLAG_ID && target.checked) {
            _ensureScoreAudioContext();
            _playScoreBounceSound(1);
          }
          if (typeof target.blur === 'function') {
            target.blur();
          }
          _queueCanvasFocus();
        }
      });
    }
    const _unlockScoreAudio = () => {
      if (world.getResource('scoreBounceSoundEnabled') === true) {
        _ensureScoreAudioContext();
      }
    };
    if (!scoreAudioUnlockBound) {
      scoreAudioUnlockBound = true;
      if (canvas) {
        canvas.addEventListener('pointerdown', _unlockScoreAudio, { passive: true });
      }
      document.addEventListener('pointerdown', _unlockScoreAudio, { passive: true });
      document.addEventListener('mousedown', _unlockScoreAudio, { passive: true });
      document.addEventListener('touchstart', _unlockScoreAudio, { passive: true });
      document.addEventListener('keydown', _unlockScoreAudio, { passive: true });
    }
    _monitorScoreForSound();

    window.getCableFeatureFlags = () => {
      return getCableFeatureFlags(world);
    };
    window.setCableFeatureFlags = (partial = {}) => {
        const next = setCableFeatureFlags(world, partial);
        cableFlagUi.syncFromWorld();
        console.log('Cable feature flags:', next);
        return next;
    };


    const base = import.meta.env.BASE_URL || '/';
    const usdaPath = `${base}usd_scenes/flipper_scene.usda`;

    UsdOpen(usdaPath).then(stage => {
      runGame(world, () => {
        ensureCableFeatureFlags(world);
        cableFlagUi.syncFromWorld();
        setupScene(world, stage, canvas);
      });
    });
</script>

</body>
</html>
