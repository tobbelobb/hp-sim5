<!DOCTYPE html>
<!--
  Start with:  npx vite
  Open http://localhost:5173/hp-sim5/slideprinter.html
  Upload a G-code file to run the JS MoveCommander locally.
  To drive it from Python instead run
    python -m examples.python.slideprinter.move_commander <file>
  which connects via WebSocket.
-->
<html>
<head>
    <title>Slideprinter</title>
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iZ3JleSIvPjwvc3ZnPg==" />

    <!-- Prevent pinch / double‑tap zoom while keeping responsiveness -->
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <!-- Content Security Policy: lock down scripts while allowing required features
         - Forbids eval/new Function (no 'unsafe-eval')
         - Allows module workers and blob URLs for Worker()
         - Allows WebSocket to localhost
         - Allows Google Fonts stylesheet and font files
         - Allows data: URIs for the inline SVG favicon -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      worker-src 'self' blob:;
      connect-src 'self' ws: wss:;
      img-src 'self' data:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src https://fonts.gstatic.com data:;
    ">

    <meta http-equiv="Cross-Origin-Opener-Policy:" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy:" content="require-corp">

    <!-- Nice free Google font – optional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">

    <style>
:root {
  --bg-1: #2d2d2d;
  --accent-1: #ff452a;
  --accent-2: #ffb347;
  --text-main: #fafafa;
  --text-dim:  #c0c0c0;
  --radius: 4px;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;                 /* use dynamic vh so iOS toolbars don't break it */
  width: 100dvw;
  overflow-y: auto;               /* **kills the vertical / horizontal scroll**   */
  background: var(--bg-1);
  color: var(--text-main);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent; /* removes grey flash on iOS */
  touch-action: none;    /* stops double‑tap zoom in most browsers   */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

#gameContainer {
  width: 100%;            /* fill full page width */
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;                /* expand to fill remaining vertical space */
}

#controls {
  position: sticky;
  top: 0;
  width: 100%;
  text-align: center;
  margin-block: 0 8px;    /* remove top margin, keep bottom spacing */
  padding-block: 12px 0;  /* add vertical padding */
  background: var(--bg-1); /* ensure background covers underlying content */
  z-index: 1;             /* stay above canvas */
  font-size: 0.9rem;
  color: var(--text-dim);
}

#controls button {
  all: unset;                      /* wipe default button styles */
  cursor: pointer;
  display: inline-block;
  margin: 6px auto;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.95rem;
  color: #fff;
  background: var(--accent-1);
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
  transition: transform .12s ease, box-shadow .12s ease;
}
#controls button:hover,
#controls button:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(0,0,0,.55);
}
#controls button:active {
  transform: scale(.97);
}

canvas {
  width: 100%;
  flex: 1;                         /* grow to fill vertical space */
  display: block;
  border-radius: var(--radius);
  touch-action: manipulation;      /* turn off browser panning/zoom so pointermove/up always fire */
}

#controls button {
  padding: 10px 16px;
  font-size: 0.85rem;
}

#canvasWrapper {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
}

#canvasWrapper canvas {
  flex: 1;
}

.speed-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius);
  box-shadow: 0 3px 8px rgba(0,0,0,.35);
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
}

.speed-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: 0 2px 6px rgba(0,0,0,.25) !important;
}

.speed-icon {
  font-size: 1rem;
  line-height: 1;
}

.speed-text {
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.speed-status {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 16px;
  background: rgba(0, 0, 0, 0.72);
  border-radius: 999px;
  color: rgba(220, 220, 220, 0.92);
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: lowercase;
  pointer-events: none;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
}

.speed-status.hidden {
  display: none;
}
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="controls">
            <button id="pauseBtn" tabindex="-1">Pause</button>
            <button id="resetBtn" tabindex="-1">Reset</button>
            <button id="stepBtn">Step</button>
            <button id="dumpBtn" tabindex="-1">Dump State</button>
            <input type="file" id="gcodeFile" accept=".gcode,.txt,.serial" style="display: none;" />
            <button id="loadGcodeBtn" tabindex="-1">Upload File</button>
            <select id="presetGcode" style="margin-left: 6px;">
                <option value="">Built-in G-code</option>
                <option value="draw_squares.gcode">draw_squares.gcode</option>
                <option value="home.gcode">home.gcode</option>
                <option value="movements.gcode">movements.gcode</option>
                <option value="tighten.gcode">tighten.gcode</option>
                <option value="Hangprinter_logo2.gcode">Hangprinter_logo2.gcode</option>
                <option value="Hangprinter_logo6.gcode">Hangprinter_logo6.gcode</option>
            </select>
            <select id="presetMcuCommands" style="margin-left: 6px;">
                <option value="">MCU command log</option>
                <option value="Hangprinter_logo2_no_extrusions.txt">Hangprinter_logo2_no_extrusions.txt</option>
                <option value="Hangprinter_logo2.txt">Hangprinter_logo2.txt</option>
                <option value="Hangprinter_logo6.txt">Hangprinter_logo6.txt</option>
                <option value="draw_squares.txt">draw_squares.txt</option>
            </select>
            <select id="presetSerialMcuCommands" style="margin-left: 6px;">
                <option value="">Serial MCU commands</option>
                <option value="Hangprinter_logo6.serial">Hangprinter_logo6.serial</option>
                <option value="draw_squares.serial">draw_squares.serial</option>
            </select>
            <span style="margin-left: 1em;">
                <label for="websocketIn">websocket in</label>
                <input type="checkbox" id="websocketIn">
            </span>
            <span style="margin-left: 1em;">
                <label for="websocketOut">websocket out</label>
                <input type="checkbox" id="websocketOut">
            </span>
            <span style="margin-left: 1em;">
                <label for="websocketPort">port</label>
                <input type="text" id="websocketPort" value="8766" style="width: 4em;">
            </span>
            <span style="margin-left: 1em;">
                <label for="klipperRawIn">Klipper raw in</label>
                <input type="checkbox" id="klipperRawIn">
            </span>
            <span style="margin-left: 1em;">
                <label for="klipperRawPort">port</label>
                <input type="text" id="klipperRawPort" value="8770" style="width: 4em;">
            </span>
            <br />
            <div id="httpControls" style="margin-top: 6px; font-size: 0.85rem; display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                <span>HTTP:</span>
                <input id="httpBaseUrl" type="text" value="http://localhost:8080" style="width: 14em;" aria-label="HTTP base URL">
                <button id="httpConnectBtn" type="button">Use</button>
                <input id="httpGcodeInput" type="text" placeholder="G-code (e.g. M569.4 P40.0 T0.001)" style="width: 18em;" aria-label="G-code to send over HTTP">
                <button id="httpSendBtn" type="button">Send</button>
                <span id="httpStatus" style="min-width: 10em; display: inline-block;"></span>
            </div>
            <div id="stats" style="margin-top: 4px; font-size: 0.8rem;">
                dt: <span id="dt">N/A</span> |
                Speed: <span id="speed">N/A</span>
            </div>
            <div id="speedControls" role="group" aria-label="Playback speed" style="margin-top: 6px; display: inline-flex; gap: 12px; align-items: center;">
                <span>Playback:</span>
                <button id="speedSlowerBtn" type="button" class="speed-btn" aria-label="Set playback to half speed">
                    <span aria-hidden="true" class="speed-icon">&#x23E9;</span>
                    <span class="speed-text">0.5x</span>
                </button>
                <button id="speedFasterBtn" type="button" class="speed-btn" aria-label="Double the playback speed">
                    <span aria-hidden="true" class="speed-icon">&#x23E9;</span>
                    <span class="speed-text">2x</span>
                </button>
            </div>
        </div>
        <div id="canvasWrapper">
            <canvas id="myCanvas"></canvas>
            <div id="speedStatus" class="speed-status hidden" role="status" aria-live="polite"></div>
        </div>
    </div>
<script type="module">
    import {
        Open as UsdOpen,
    } from "../../../src/js/usd/stage.js";
    import { World } from '../../../src/js/cable_joints/ecs.js';
    import { runGame } from './runner.js';
    import { setupScene } from './setupScene.js';
    import { RemoteSpoolSystem } from './slideprinter_common.js';
    import { connectKlipperRaw } from './klipperHandler.js';
    import { detectFileFormat, FileFormat, isMcuFormat } from './fileFormatUtils.js';
    import { RrfHttpBridge } from './rrfHttpBridge.js';

    const searchParams = new URLSearchParams(window.location.search);
    const logMoveParamKeys = ['--log-move', 'log-move', 'logMove'];
    let logMoveEnabled = false;
    let logMoveFilename = null;
    for (const key of logMoveParamKeys) {
        if (!searchParams.has(key)) continue;
        const raw = searchParams.get(key);
        const normalized = typeof raw === 'string' ? raw.toLowerCase() : '';
        if (raw === null || raw === '' || normalized === 'true' || raw === '1') {
            logMoveEnabled = true;
        } else if (normalized === 'false' || normalized === '0') {
            logMoveEnabled = false;
        } else {
            logMoveEnabled = true;
            logMoveFilename = raw;
        }
    }
    const traceRawParamKeys = ['--trace-raw', 'trace-raw', 'traceRaw'];
    let traceRawEnabled = false;
    for (const key of traceRawParamKeys) {
        if (!searchParams.has(key)) continue;
        const raw = searchParams.get(key);
        const normalized = typeof raw === 'string' ? raw.toLowerCase() : '';
        if (raw === null || raw === '' || normalized === 'true' || raw === '1') {
            traceRawEnabled = true;
        } else if (normalized === 'false' || normalized === '0') {
            traceRawEnabled = false;
        } else {
            traceRawEnabled = true;
        }
    }

    // --- Screen Wake Lock ---
    let wakeLock = null;
    const requestWakeLock = async () => {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { /* The request can fail, e.g., if the page is not visible. */ }
        }
    };
    const handleVisibilityChange = async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    };
    document.addEventListener('visibilitychange', handleVisibilityChange);
    // A wake lock can only be requested after a user interaction.
    document.getElementById('controls').addEventListener('click', requestWakeLock, { once: true });


    // --- Global Setup ---
    const canvas = document.getElementById("myCanvas");
    let world = new World();
    let moveCommanderWorker;
    let klipperCommanderWorker;
    let commander;
    let httpBridge = null;
    let rrfCommanderWorker = null;
    let pendingCommanderCommands = [];
    let gameControls = null;
    let stageReady = false;
    let ws = null;
    let klipperRaw = null;
    let simDtSec = null; // Filled from USD timeCodesPerSecond
    let currentTimeScale = 1.0;
    let speedStatusArmed = false;
    const speedSlowerBtn = document.getElementById('speedSlowerBtn');
    const speedFasterBtn = document.getElementById('speedFasterBtn');
    const speedStatusEl = document.getElementById('speedStatus');
    const websocketInToggle = document.getElementById('websocketIn');
    const websocketOutToggle = document.getElementById('websocketOut');
    const websocketPortInput = document.getElementById('websocketPort');
    const klipperRawInToggle = document.getElementById('klipperRawIn');
    const klipperRawPortInput = document.getElementById('klipperRawPort');
    const httpBaseInput = document.getElementById('httpBaseUrl');
    const httpConnectBtn = document.getElementById('httpConnectBtn');
    const httpSendBtn = document.getElementById('httpSendBtn');
    const httpGcodeInput = document.getElementById('httpGcodeInput');
    const httpStatusLabel = document.getElementById('httpStatus');

    const websocket_in = websocketInToggle.checked;
    const websocket_out = websocketOutToggle.checked;
    const port = websocketPortInput.value;
    const klipperRawIn = klipperRawInToggle.checked;
    const klipperRawPort = klipperRawPortInput.value;

    const getRemoteSystem = () => world.systems.find((s) => s instanceof RemoteSpoolSystem);

    const setSpeedButtonsEnabled = (enabled) => {
        [speedSlowerBtn, speedFasterBtn].forEach((button) => {
            if (!button) {
                return;
            }
            button.disabled = !enabled;
            if (!enabled) {
                button.setAttribute('aria-disabled', 'true');
            } else {
                button.removeAttribute('aria-disabled');
            }
        });
    };

    const formatTimeScale = (scale) => {
        if (!Number.isFinite(scale) || scale <= 0) {
            return '1';
        }
        if (scale >= 100) {
            return scale.toFixed(0);
        }
        if (scale >= 10) {
            return parseFloat(scale.toFixed(1)).toString();
        }
        const rounded = parseFloat(scale.toFixed(2));
        return Number.isInteger(rounded) ? String(rounded) : rounded.toString();
    };

    const showSpeedStatus = (scale) => {
        if (!speedStatusEl) {
            return;
        }
        speedStatusEl.textContent = `current speed: ${formatTimeScale(scale)}x realtime`;
        speedStatusEl.classList.remove('hidden');
    };

    const ensureRrfCommanderWorker = () => {
        if (rrfCommanderWorker) {
            return rrfCommanderWorker;
        }
        const worker = new Worker(new URL('./rrfCommander.js', import.meta.url), { type: 'module' });
        worker.onmessage = (e) => {
            const data = e.data || {};
            if (data.action === 'gcode' && data.command) {
                const remote = getRemoteSystem();
                if (remote) {
                    if (remote.worker !== worker) {
                        remote.worker = worker;
                    }
                    remote.addCommand(data.command);
                } else {
                    pendingCommanderCommands.push(data.command);
                }
            } else if (data.type === 'error' && data.message) {
                console.error('RrfCommander error:', data.message);
            }
        };
        rrfCommanderWorker = worker;
        if (simDtSec) {
            worker.postMessage({ type: 'set_dt', dt: simDtSec });
        }
        worker.postMessage({ type: 'reset_state' });
        return worker;
    };

    const feedMotionToCommander = (lines) => {
        if (!lines || lines.length === 0) {
            return;
        }
        const worker = ensureRrfCommanderWorker();
        try {
            worker.postMessage({ type: 'append_csv', lines });
        } catch (err) {
            console.error('Failed to feed motion to RrfCommander:', err);
        }
    };

    const updateHttpStatus = (text) => {
        if (httpStatusLabel) {
            httpStatusLabel.textContent = text || '';
        }
    };

    const connectHttpBridge = () => {
        const base = (httpBaseInput?.value || '').trim() || 'http://localhost:8080';
        httpBridge = new RrfHttpBridge({
            baseUrl: base,
        });
        ensureRrfCommanderWorker();
        updateHttpStatus(`Using ${base}`);
    };

    const sendHttpGcode = async () => {
        const gcode = (httpGcodeInput?.value || '').trim();
        if (!gcode) {
            return;
        }
        if (!httpBridge) {
            connectHttpBridge();
        }
        try {
            const result = await httpBridge.sendGCode(gcode);
            if (result?.rawMotionLines?.length) {
                feedMotionToCommander(result.rawMotionLines);
            }
            updateHttpStatus(result?.reply || 'ok');
        } catch (err) {
            updateHttpStatus(`Err: ${err.message}`);
            console.error('HTTP bridge send failed:', err);
        }
    };

    const applyTimeScaleToWorkers = (scale) => {
        const safeScale = Number.isFinite(scale) && scale > 0 ? scale : 1.0;
        if (moveCommanderWorker) {
            moveCommanderWorker.postMessage({ type: 'set_speed_scale', value: safeScale });
        }
        if (klipperCommanderWorker) {
            klipperCommanderWorker.postMessage({ type: 'set_speed_scale', value: safeScale });
        }
        if (rrfCommanderWorker) {
            rrfCommanderWorker.postMessage({ type: 'set_speed_scale', value: safeScale });
        }
    };

    const handleTimeScaleChange = (scale) => {
        currentTimeScale = scale;
        applyTimeScaleToWorkers(scale);
        if (speedStatusArmed) {
            showSpeedStatus(scale);
        }
    };

    setSpeedButtonsEnabled(false);

    if (speedSlowerBtn) {
        speedSlowerBtn.addEventListener('click', (event) => {
            event.preventDefault();
            if (!stageReady || !gameControls || typeof gameControls.setTimeScale !== 'function') {
                return;
            }
            const currentScale = typeof gameControls.getTimeScale === 'function' ? gameControls.getTimeScale() : currentTimeScale;
            const nextScale = currentScale / 2;
            speedStatusArmed = true;
            gameControls.setTimeScale(nextScale);
            const appliedScale = typeof gameControls.getTimeScale === 'function' ? gameControls.getTimeScale() : nextScale;
            showSpeedStatus(appliedScale);
        });
    }

    if (speedFasterBtn) {
        speedFasterBtn.addEventListener('click', (event) => {
            event.preventDefault();
            if (!stageReady || !gameControls || typeof gameControls.setTimeScale !== 'function') {
                return;
            }
            const currentScale = typeof gameControls.getTimeScale === 'function' ? gameControls.getTimeScale() : currentTimeScale;
            const nextScale = currentScale * 2;
            speedStatusArmed = true;
            gameControls.setTimeScale(nextScale);
            const appliedScale = typeof gameControls.getTimeScale === 'function' ? gameControls.getTimeScale() : nextScale;
            showSpeedStatus(appliedScale);
        });
    }

    if (httpConnectBtn) {
        httpConnectBtn.addEventListener('click', (event) => {
            event.preventDefault();
            connectHttpBridge();
        });
    }

    if (httpSendBtn) {
        httpSendBtn.addEventListener('click', (event) => {
            event.preventDefault();
            sendHttpGcode();
        });
    }

    if (httpGcodeInput) {
        httpGcodeInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendHttpGcode();
            }
        });
    }

    if (websocket_in || websocket_out) {
        ws = new WebSocket(`wss://localhost:${port}`);
    }

    const connectKlipperRawNow = () => {
        const scheme = (location.protocol === 'https:') ? 'wss' : 'ws';
        const url = `${scheme}://localhost:${klipperRawPortInput.value}`;
        const onCommand = (cmd) => {
            const remoteSpoolSystem = world.systems.find(s => s instanceof RemoteSpoolSystem);
            if (remoteSpoolSystem) remoteSpoolSystem.addCommand(cmd);
        };
        try {
            // Pass dt if already known; otherwise default to pass-through, and update later.
            klipperRaw = connectKlipperRaw(url, onCommand, {
                baseUrl: import.meta.url,
                dt: simDtSec,
                logMove: logMoveEnabled,
                logMoveFilename: logMoveFilename || undefined,
                traceRaw: traceRawEnabled,
                onWorkerError: (msg) => {
                    console.error('Klipper raw worker error:', msg);
                },
            });
            if (logMoveEnabled && typeof window !== 'undefined') {
                window.downloadKlipperMoveLog = () => {
                    if (klipperRaw && typeof klipperRaw.downloadMoveLog === 'function') {
                        return klipperRaw.downloadMoveLog();
                    }
                    return null;
                };
            }
        } catch (e) {
            console.error('Failed to connect Klipper raw WS:', e);
        }
    };

    // Connect immediately if pre-checked at load
    if (klipperRawIn) {
        connectKlipperRawNow();
    }

    // React to user toggling the checkbox
    klipperRawInToggle.addEventListener('change', () => {
        if (klipperRawInToggle.checked) {
            if (!klipperRaw) connectKlipperRawNow();
        } else {
            if (klipperRaw) {
                klipperRaw.close();
                klipperRaw = null;
            }
            if (logMoveEnabled && typeof window !== 'undefined' && 'downloadKlipperMoveLog' in window) {
                try { delete window.downloadKlipperMoveLog; } catch (_) { window.downloadKlipperMoveLog = undefined; }
            }
        }
    });

    // Reconnect on port changes when enabled
    klipperRawPortInput.addEventListener('change', () => {
        if (klipperRaw) {
            klipperRaw.close();
            klipperRaw = null;
        }
        if (logMoveEnabled && typeof window !== 'undefined' && 'downloadKlipperMoveLog' in window) {
            try { delete window.downloadKlipperMoveLog; } catch (_) { window.downloadKlipperMoveLog = undefined; }
        }
        if (klipperRawInToggle.checked) connectKlipperRawNow();
    });

    const loadGcodeBtn = document.getElementById('loadGcodeBtn');
    const gcodeFileInput = document.getElementById('gcodeFile');
    const presetGcodeSelect = document.getElementById('presetGcode');
    const presetMcuSelect = document.getElementById('presetMcuCommands');
    const presetSerialMcuSelect = document.getElementById('presetSerialMcuCommands');

    loadGcodeBtn.addEventListener('click', () => gcodeFileInput.click());

    const moveCommanderURI = websocket_out ? `wss://localhost:${port}` : null;
    const base = import.meta.env.BASE_URL || '/';
    const moveCommanderModuleUrl = new URL('./moveCommander.js', import.meta.url);
    const klipperCommanderModuleUrl = new URL('./klipperCommander.js', import.meta.url);

    if ((websocket_in && websocket_out) || (!websocket_in && !websocket_out)) {
        // Create no websocket in this case. The websocket_in && websocket_out case is
        // simulated by sending the same data to web worker with postMessage.
        // Create MoveCommander in web worker. Don't give it a websocket uri.
        // In this case MoveCommander gets its gcode file from the main page and sends
        // back segmented MoveCommander commands via postMessage.
        if (window.Worker) {
            moveCommanderWorker = new Worker(moveCommanderModuleUrl, { type: 'module' });
            console.log("main: moveCommanderWorker is up");
            if (simDtSec != null) {
                moveCommanderWorker.postMessage({ type: 'set_dt', dt: simDtSec });
            }
            moveCommanderWorker.postMessage({ type: 'set_speed_scale', value: currentTimeScale });

            moveCommanderWorker.onmessage = (e) => {
                if (e.data.type === 'done') {
                    console.log('main: G-code processing finished.');
                } else if (e.data.type === 'error') {
                    console.error('main: G-code processing failed:', e.data.message);
                } else if (e.data.action === 'gcode') {
                    const remoteSpoolSystem = world.systems.find(s => s instanceof RemoteSpoolSystem);
                    if (remoteSpoolSystem != null) {
                        if (remoteSpoolSystem.worker !== moveCommanderWorker) {
                            remoteSpoolSystem.worker = moveCommanderWorker;
                        }
                        remoteSpoolSystem.addCommand(e.data.command);
                    }
                }
            };
            gcodeFileInput.addEventListener('change', (event) => {
                const filename = event.target.files[0];
                if (filename == null) {
                  return;
                }
                console.log("main: sending filename_upload:", filename);
                handleUploadedFile(filename);
            });
            presetGcodeSelect.addEventListener('change', async () => {
                const filename = `${base}examples/gcode/${presetGcodeSelect.value}`
                if (filename == null) {
                  return;
                }
                console.log("main: sending filename_fetch:", filename);
                handlePresetFilename(filename);
            });
        }
    } else if (websocket_in) {
        // Don't create a local js MoveCommander.
        // The move commands will come from some other source.
        // Listen for commands in the websocket.
        if (ws) {
            ws.addEventListener('message', (event) => {
                const data = JSON.parse(event.data);
                if (data != null && data.action === 'gcode') {
                    const remoteSpoolSystem = world.systems.find(s => s instanceof RemoteSpoolSystem);
                    if (remoteSpoolSystem != null) {
                        remoteSpoolSystem.addCommand(data.command);
                    }
                }
            });
        }
    } else if (websocket_out) {
        // Create MoveCommander in web worker. Give it the websocket uri as an argument.
        // The MoveCommander gets its gcode file from the main page via postMessage,
        // and creates segmented MoveCommander commands that it sends out via the websocket.
        if (window.Worker) {
            moveCommanderWorker = new Worker(moveCommanderModuleUrl, { type: 'module' });
            if (moveCommanderURI) {
                moveCommanderWorker.postMessage({ type: 'set_uri', uri: moveCommanderURI });
            }
            if (simDtSec != null) {
                moveCommanderWorker.postMessage({ type: 'set_dt', dt: simDtSec });
            }
            moveCommanderWorker.postMessage({ type: 'set_speed_scale', value: currentTimeScale });
            moveCommanderWorker.onmessage = (e) => {
                if (e.data.type === 'done') {
                    console.log('main: G-code processing finished.');
                } else if (e.data.type === 'error') {
                    console.error('main: G-code processing failed:', e.data.message);
                }
            };
            gcodeFileInput.addEventListener('change', (event) => {
                const filename = event.target.files[0];
                if (filename == null) {
                  return;
                }
                handleUploadedFile(filename);
            });
            presetGcodeSelect.addEventListener('change', async () => {
                const filename = `${base}examples/gcode/${presetGcodeSelect.value}`
                if (filename == null) {
                  return;
                }
                handlePresetFilename(filename);
            });
        }
    }

    const ensureKlipperCommanderWorker = () => {
        if (klipperCommanderWorker) {
            return klipperCommanderWorker;
        }
        if (!window.Worker) {
            console.warn('Web Workers are not supported in this browser.');
            return null;
        }
        klipperCommanderWorker = new Worker(klipperCommanderModuleUrl, { type: 'module' });
        console.log('main: klipperCommanderWorker is up');
        klipperCommanderWorker.onmessage = (e) => {
            if (e.data.type === 'done') {
                console.log('main: MCU command playback finished.');
            } else if (e.data.type === 'error') {
                console.error('main: MCU command playback failed:', e.data.message);
            } else if (e.data.action === 'gcode') {
                const remoteSpoolSystem = world.systems.find(s => s instanceof RemoteSpoolSystem);
                if (remoteSpoolSystem != null) {
                    if (remoteSpoolSystem.worker !== klipperCommanderWorker) {
                        remoteSpoolSystem.worker = klipperCommanderWorker;
                    }
                    remoteSpoolSystem.addCommand(e.data.command);
                }
            }
        };
        if (simDtSec != null) {
            klipperCommanderWorker.postMessage({ type: 'set_dt', dt: simDtSec });
        }
        klipperCommanderWorker.postMessage({ type: 'set_speed_scale', value: currentTimeScale });
        return klipperCommanderWorker;
    };

    const sendWorkToFormat = (format, message) => {
        if (format === FileFormat.GCODE) {
            if (!moveCommanderWorker) {
                console.warn('G-code worker unavailable for upload.');
                return;
            }
            if (simDtSec != null) {
                moveCommanderWorker.postMessage({ type: 'set_dt', dt: simDtSec });
            }
            moveCommanderWorker.postMessage({ type: 'set_speed_scale', value: currentTimeScale });
            moveCommanderWorker.postMessage(message);
            return;
        }
        if (isMcuFormat(format)) {
            const worker = ensureKlipperCommanderWorker();
            if (!worker) {
                console.warn('Unable to start KlipperCommander worker.');
                return;
            }
            if (simDtSec != null) {
                worker.postMessage({ type: 'set_dt', dt: simDtSec });
            }
            worker.postMessage({ type: 'set_speed_scale', value: currentTimeScale });
            worker.postMessage(message);
            return;
        }
        console.warn('Unsupported file type. Expected .gcode, .txt, or .serial.');
    };

    const handleUploadedFile = (file) => {
        if (!file) {
            return;
        }
        const format = detectFileFormat(file.name);
        sendWorkToFormat(format, { type: 'filename_upload', filename: file });
    };

    const handlePresetFilename = (filename) => {
        if (!filename) {
            return;
        }
        const format = detectFileFormat(filename) || FileFormat.MCU_TEXT;
        sendWorkToFormat(format, { type: 'filename_fetch', filename });
    };

    if (presetMcuSelect) {
        presetMcuSelect.addEventListener('change', () => {
            const value = presetMcuSelect.value;
            if (!value) {
                return;
            }
            const filename = `${base}examples/mcu_commands/${value}`;
            console.log('main: starting MCU command playback', filename);
            handlePresetFilename(filename);
        });
    }
    if (presetSerialMcuSelect) {
        presetSerialMcuSelect.addEventListener('change', () => {
            const value = presetSerialMcuSelect.value;
            if (!value) {
                return;
            }
            const filename = `${base}examples/mcu_commands/${value}`;
            console.log('main: starting serial MCU command playback', filename);
            handlePresetFilename(filename);
        });
    }
    const usdaPath = new URL('../../usd_scenes/slideprinter.usda', import.meta.url).href;

    UsdOpen(usdaPath).then(stage => {
      if (!stage) {
          console.error("Failed to load or parse USD file:", usdaPath);
          return;
      }
      const timeCodesPerSecond = stage.ast.descriptor.assignments.find(s => s.type === 'assignment' && s.identifier === 'timeCodesPerSecond').value;
      if (timeCodesPerSecond) {
          simDtSec = 1.0 / timeCodesPerSecond;
          if (moveCommanderWorker) {
              moveCommanderWorker.postMessage({ type: 'set_dt', dt: simDtSec });
              moveCommanderWorker.postMessage({ type: 'set_speed_scale', value: currentTimeScale });
          }
          if (klipperCommanderWorker) {
              klipperCommanderWorker.postMessage({ type: 'set_dt', dt: simDtSec });
              klipperCommanderWorker.postMessage({ type: 'set_speed_scale', value: currentTimeScale });
          }
          if (rrfCommanderWorker) {
              rrfCommanderWorker.postMessage({ type: 'set_dt', dt: simDtSec });
              rrfCommanderWorker.postMessage({ type: 'set_speed_scale', value: currentTimeScale });
          }
          if (klipperRaw) {
              klipperRaw.setDt(simDtSec);
          }
      }
      gameControls = runGame(world, () => setupScene(world, stage, canvas, {remote : false, ws : ws}), {
          initialTimeScale: currentTimeScale,
          onTimeScaleChange: handleTimeScaleChange,
      });
      const remoteSystem = getRemoteSystem();
      if (remoteSystem && rrfCommanderWorker) {
          remoteSystem.worker = rrfCommanderWorker;
          if (pendingCommanderCommands.length > 0) {
              for (const cmd of pendingCommanderCommands) {
                  remoteSystem.addCommand(cmd);
              }
              pendingCommanderCommands = [];
          }
      }
      stageReady = true;
      setSpeedButtonsEnabled(true);
    }).catch(error => {
        console.error("Error during USD loading or game setup:", error);
    });
</script>

</body>
</html>
