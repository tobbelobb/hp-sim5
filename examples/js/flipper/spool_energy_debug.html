<!DOCTYPE html>
<html>
<head>
    <title>Spool Energy Debug</title>
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iZ3JleSIvPjwvc3ZnPg==" />
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <style>
:root {
  --bg: #212228;
  --fg: #f1f3f6;
  --muted: #b8bfca;
  --accent: #ff4a2a;
  --card: #2c2f38;
  --radius: 6px;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

#wrap {
  width: min(96vw, 960px);
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  padding: 10px;
  box-sizing: border-box;
}

#controls {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px;
  text-align: center;
  font-size: 0.9rem;
  color: var(--muted);
}

#controls button {
  all: unset;
  cursor: pointer;
  display: inline-block;
  margin: 4px;
  border-radius: var(--radius);
  background: var(--accent);
  color: #fff;
  padding: 8px 14px;
  font-size: 0.84rem;
  font-weight: 600;
}

#stats {
  margin-top: 6px;
  font-size: 0.82rem;
}

#energy {
  margin-top: 8px;
  font-size: 0.8rem;
  line-height: 1.4;
}

#note {
  margin-top: 8px;
  font-size: 0.76rem;
  color: var(--muted);
}

canvas {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius);
  touch-action: manipulation;
}
    </style>
</head>
<body>
  <div id="wrap">
    <div id="controls">
      <button id="pauseBtn" tabindex="-1">Pause</button>
      <button id="resetBtn" tabindex="-1">Reset</button>
      <button id="stepBtn">Step</button>
      <button id="dumpBtn" tabindex="-1">Dump State</button>
      <div id="stats">
        dt: <span id="dt">N/A</span> |
        Speed: <span id="speed">N/A</span>
      </div>
      <div id="energy">
        Step: <span id="eStep">0</span> |
        E: <span id="eTotal">0</span> |
        dE: <span id="eDelta">0</span><br />
        Kt: <span id="eKTrans">0</span> |
        Kr: <span id="eKRot">0</span> |
        Ug: <span id="eUGravity">0</span> |
        Uc: <span id="eUCable">0</span><br />
        stored: <span id="eStored">0</span> |
        r_eff(bottom): <span id="eEffRadius">0</span> |
        border dl_max: <span id="eBorderDelta">0</span>
      </div>
      <div id="note">
        Console helpers: <code>dumpSpoolEnergyTrace()</code>,
        <code>getSpoolEnergyTrace()</code>,
        <code>clearSpoolEnergyTrace()</code>,
        <code>setSpoolEnergyConfig({...})</code>.
      </div>
    </div>
    <canvas id="myCanvas"></canvas>
  </div>

<script type="module">
  import Vector2 from '../../../src/js/cable_joints/vector2.js';
  import {
    World,
    PositionComponent,
    PrevFinalPosComponent,
    VelocityComponent,
    RadiusComponent,
    MassComponent,
    RestitutionComponent,
    GravityAffectedComponent,
    OrientationComponent,
    AngularVelocityComponent,
    CoefficientOfFrictionComponent,
    MomentOfInertiaComponent,
    PrevFinalOrientationComponent,
    RenderableComponent,
    SimulationErrorStateComponent
  } from '../../../src/js/cable_joints/ecs.js';
  import {
    tangentFromCircleToPoint
  } from '../../../src/js/cable_joints/geometry.js';
  import {
    CableLinkComponent,
    CableJointComponent,
    CablePathComponent,
    linecolor1,
    CableAttachmentUpdateSystem,
    CableTopologySystem,
    PinchDetectionSystem,
    PinchConfigureSystem,
    PinchConstraintBuildSystem,
    PBDCableConstraintSolver,
    getHybridEndpointRollingRadius
  } from '../../../src/js/cable_joints/cable_joints_core.js';
  import { PBDResolveCableOverCorrections } from '../../../src/js/cable_joints/pbdResolveCableOverCorrections.js';
  import {
    PrevFinalPosSystem,
    PrevFinalOrientationSystem,
    GravitySystem,
    MovementSystem,
    AngularMovementSystem,
    PBDVelocityUpdateSystem,
    PBDAngularVelocityUpdateSystem,
  } from '../../../src/js/cable_joints/commonSystems.js';
  import { CableAttachmentCacheSystem } from '../../../src/js/cable_joints/cable_attachment_cache_system.js';
  import { CableSlackSystem } from '../../../src/js/cable_joints/cable_slack_system.js';
  import { CableFrictionSystem } from '../../../src/js/cable_joints/cable_friction_system.js';
  import {
    BallTagComponent,
    PauseStateComponent,
    BorderComponent,
    PBDBallBorderCollisions,
    getEffectiveCollisionRadius
  } from './flipper_common.js';
  import { BallBorderOrFlipperVelocityContactSystem } from './ball_border_or_flipper_velocity_contact_system.js';
  import { RenderSystem } from './renderSystem.js';
  import { runGame } from './runner.js';

  const canvas = document.getElementById('myCanvas');
  const world = new World();
  window.world = world;

  const ENERGY_TRACE_MAX_SAMPLES = 12000;
  const gFallback = new Vector2(0.0, -9.81);

  let spoolEnergyConfig = {
    initialStoredTurns: 1.0,
    cableHalfWidth: 0.0025,
    cableStiffness: 1200.0,
    initialLinearSpeed: 0.24,
    restLengthScale: 1.0,
    ballRadius: 0.04,
    ballMass: 0.008,
    borderFriction: 0.6,
    cw: true
  };

  function _readFinite(value, fallback) {
    return Number.isFinite(value) ? value : fallback;
  }

  function _fmt(value) {
    return Number.isFinite(value) ? value.toFixed(6) : 'NaN';
  }

  function _setText(id, text) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
    }
  }

  function _updateEnergyPanel(sample) {
    if (!sample) {
      return;
    }
    _setText('eStep', `${sample.step}`);
    _setText('eTotal', _fmt(sample.e_total));
    _setText('eDelta', _fmt(sample.delta_e));
    _setText('eKTrans', _fmt(sample.k_trans));
    _setText('eKRot', _fmt(sample.k_rot));
    _setText('eUGravity', _fmt(sample.u_gravity));
    _setText('eUCable', _fmt(sample.u_cable));
    _setText('eStored', _fmt(sample.stored_0));
    _setText('eEffRadius', _fmt(sample.effective_radius_bottom));
    _setText('eBorderDelta', _fmt(sample.max_border_delta_lambda));
  }

  class EnergyTraceSystem {
    runInPause = false;

    _estimateCablePotential(world, pathComp) {
      if (!pathComp || !Array.isArray(pathComp.jointEntities)) {
        return 0.0;
      }
      const k = pathComp.spring_constant;
      if (!(Number.isFinite(k) && k > 0.0)) {
        return 0.0;
      }
      let uCable = 0.0;
      for (const jointId of pathComp.jointEntities) {
        const joint = world.getComponent(jointId, CableJointComponent);
        if (!joint) {
          continue;
        }
        const currentLen = joint.attachmentPointA_world.distanceTo(joint.attachmentPointB_world);
        const stretch = Math.max(0.0, currentLen - joint.restLength);
        uCable += 0.5 * k * stretch * stretch;
      }
      return uCable;
    }

    update(world, dt) {
      const refs = world.getResource('spoolEnergyRefs');
      if (!refs) {
        return;
      }
      const ballId = refs.ballId;
      const pathId = refs.pathId;

      const posComp = world.getComponent(ballId, PositionComponent);
      const velComp = world.getComponent(ballId, VelocityComponent);
      const massComp = world.getComponent(ballId, MassComponent);
      const radiusComp = world.getComponent(ballId, RadiusComponent);
      const moiComp = world.getComponent(ballId, MomentOfInertiaComponent);
      const angComp = world.getComponent(ballId, AngularVelocityComponent);
      const pathComp = world.getComponent(pathId, CablePathComponent);
      if (!posComp || !velComp || !massComp || !radiusComp || !moiComp || !angComp || !pathComp) {
        return;
      }

      const gravity = world.getResource('gravity') || gFallback;
      const mass = massComp.mass;
      const vSq = velComp.vel.lengthSq();
      const omega = angComp.angularVelocity;

      const kTrans = 0.5 * mass * vSq;
      const kRot = 0.5 * moiComp.inertia * omega * omega;
      const uGravity = -mass * gravity.dot(posComp.pos);
      const uCable = this._estimateCablePotential(world, pathComp);
      const eTotal = kTrans + kRot + uGravity + uCable;

      const rawRadius = radiusComp.radius;
      const floorDirection = new Vector2(0.0, -1.0);
      const effectiveRadiusBottom = getEffectiveCollisionRadius(world, ballId, rawRadius, floorDirection);
      const rollingRadius = getHybridEndpointRollingRadius(world, ballId);
      const stored0 = _readFinite(pathComp.stored?.[0], 0.0);

      const borderContacts = world.getResource('ball_border_contacts') || [];
      let maxBorderDeltaLambda = 0.0;
      let borderContactCount = 0;
      for (const contact of borderContacts) {
        if (contact.ball_id !== ballId) {
          continue;
        }
        borderContactCount += 1;
        const dl = Math.abs(_readFinite(contact.delta_lambda, 0.0));
        if (dl > maxBorderDeltaLambda) {
          maxBorderDeltaLambda = dl;
        }
      }

      let trace = world.getResource('energyTrace');
      if (!Array.isArray(trace)) {
        trace = [];
        world.setResource('energyTrace', trace);
      }
      const nextStep = (_readFinite(world.getResource('energyTraceStep'), 0) | 0) + 1;
      const prevSample = trace.length > 0 ? trace[trace.length - 1] : null;
      const deltaE = prevSample ? (eTotal - prevSample.e_total) : 0.0;

      const sample = {
        step: nextStep,
        dt,
        x: posComp.pos.x,
        y: posComp.pos.y,
        vx: velComp.vel.x,
        vy: velComp.vel.y,
        omega,
        k_trans: kTrans,
        k_rot: kRot,
        u_gravity: uGravity,
        u_cable: uCable,
        e_total: eTotal,
        delta_e: deltaE,
        stored_0: stored0,
        rolling_radius: _readFinite(rollingRadius, rawRadius),
        effective_radius_bottom: _readFinite(effectiveRadiusBottom, rawRadius),
        raw_radius: rawRadius,
        border_contact_count: borderContactCount,
        max_border_delta_lambda: maxBorderDeltaLambda
      };

      trace.push(sample);
      if (trace.length > ENERGY_TRACE_MAX_SAMPLES) {
        trace.splice(0, trace.length - ENERGY_TRACE_MAX_SAMPLES);
      }

      world.setResource('energyTraceStep', nextStep);
      world.setResource('energyLastSample', sample);
      _updateEnergyPanel(sample);
    }
  }

  function setupScene() {
    world.clear();

    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    const simHeight = 0.5;
    const cScale = canvas.height / simHeight;
    const simWidth = canvas.width / cScale;

    world.setResource('gravity', new Vector2(0.0, -9.81));
    world.setResource('dt', 1.0 / 500.0);
    world.setResource('simWidth', simWidth);
    world.setResource('simHeight', simHeight);
    world.setResource('cScale', cScale);
    world.setResource('pauseState', new PauseStateComponent(true));
    world.setResource('errorState', new SimulationErrorStateComponent(false));
    world.setResource('debugRenderPoints', {});
    world.setResource('ball_border_contacts', []);
    world.setResource('ball_flipper_contacts', []);
    world.setResource('energyTrace', []);
    world.setResource('energyTraceStep', 0);
    world.setResource('energyLastSample', null);
    world.setResource('spoolEnergyConfig', { ...spoolEnergyConfig });

    const left = 0.03;
    const right = simWidth - 0.03;
    const bottom = 0.04;
    const top = simHeight - 0.03;
    const borderPoints = [
      new Vector2(right, bottom),
      new Vector2(right, top),
      new Vector2(left, top),
      new Vector2(left, bottom)
    ];
    const borderId = world.createEntity();
    world.addComponent(borderId, new BorderComponent(borderPoints));
    world.addComponent(borderId, new RenderableComponent('border', '#0b0b0b'));
    world.addComponent(borderId, new RestitutionComponent(0.0));
    world.addComponent(borderId, new CoefficientOfFrictionComponent(_readFinite(spoolEnergyConfig.borderFriction, 0.6)));

    const rawRadius = _readFinite(spoolEnergyConfig.ballRadius, 0.04);
    const ballMass = _readFinite(spoolEnergyConfig.ballMass, 0.008);
    const ballX = left + 0.16;
    const ballY = bottom + rawRadius;
    const v0 = _readFinite(spoolEnergyConfig.initialLinearSpeed, 0.24);
    const w0 = -v0 / Math.max(rawRadius, 1e-9);
    const ballI = 0.5 * ballMass * rawRadius * rawRadius;

    const ballId = world.createEntity();
    world.addComponent(ballId, new BallTagComponent());
    world.addComponent(ballId, new PositionComponent(ballX, ballY));
    world.addComponent(ballId, new PrevFinalPosComponent(ballX, ballY));
    world.addComponent(ballId, new VelocityComponent(v0, 0.0));
    world.addComponent(ballId, new RadiusComponent(rawRadius));
    world.addComponent(ballId, new MassComponent(ballMass));
    world.addComponent(ballId, new RestitutionComponent(0.0));
    world.addComponent(ballId, new GravityAffectedComponent());
    world.addComponent(ballId, new OrientationComponent(0.0));
    world.addComponent(ballId, new PrevFinalOrientationComponent(0.0));
    world.addComponent(ballId, new AngularVelocityComponent(w0));
    world.addComponent(ballId, new MomentOfInertiaComponent(ballI));
    world.addComponent(ballId, new CoefficientOfFrictionComponent(0.6));
    world.addComponent(ballId, new RenderableComponent('circle', '#a9adb6'));
    world.addComponent(ballId, new CableLinkComponent(ballX, ballY, 0.0));

    const anchorX = right - 0.10;
    const anchorY = top - 0.06;
    const anchorId = world.createEntity();
    world.addComponent(anchorId, new PositionComponent(anchorX, anchorY));
    world.addComponent(anchorId, new MassComponent(-1.0));
    world.addComponent(anchorId, new RadiusComponent(0.010));
    world.addComponent(anchorId, new RenderableComponent('circle', '#ff3c2e'));
    world.addComponent(anchorId, new CableLinkComponent(anchorX, anchorY, 0.0));

    const ballPos = world.getComponent(ballId, PositionComponent).pos;
    const anchorPos = world.getComponent(anchorId, PositionComponent).pos;
    const cwBall = spoolEnergyConfig.cw === true;
    const tangent = tangentFromCircleToPoint(anchorPos, ballPos, rawRadius, cwBall);
    const attachBall = tangent.a_circle;
    const attachAnchor = tangent.a_attach;
    const initialLen = attachBall.distanceTo(attachAnchor);
    const restLengthScale = _readFinite(spoolEnergyConfig.restLengthScale, 1.0);
    const restLength = Math.max(1e-9, initialLen * restLengthScale);

    const jointId = world.createEntity();
    world.addComponent(
      jointId,
      CableJointComponent.fromWorld(ballId, anchorId, restLength, attachBall, attachAnchor)
    );
    world.addComponent(jointId, new RenderableComponent('line', linecolor1));

    const cableHalfWidth = Math.max(0.0, _readFinite(spoolEnergyConfig.cableHalfWidth, 0.0025));
    const storedTurns = Math.max(0.0, _readFinite(spoolEnergyConfig.initialStoredTurns, 1.0));
    const storedLength = storedTurns * 2.0 * Math.PI * (rawRadius + cableHalfWidth);
    const cableStiffness = Math.max(1.0, _readFinite(spoolEnergyConfig.cableStiffness, 1200.0));
    const pathId = world.createEntity();
    const pathComp = new CablePathComponent(
      world,
      [jointId],
      ['hybrid', 'attachment'],
      [cwBall, true],
      cableStiffness,
      [storedLength, 0.0],
      cableHalfWidth
    );
    world.addComponent(pathId, pathComp);

    world.setResource('spoolEnergyRefs', { ballId, anchorId, pathId, jointId });

    if (world.systems.length === 0) {
      world.registerSystem(new PrevFinalPosSystem());
      world.registerSystem(new PrevFinalOrientationSystem());
      world.registerSystem(new GravitySystem());
      world.registerSystem(new MovementSystem());
      world.registerSystem(new AngularMovementSystem());
      world.registerSystem(new CableAttachmentUpdateSystem({ includeTopology: false }));
      world.registerSystem(new CableTopologySystem());
      world.registerSystem(new PinchDetectionSystem());
      world.registerSystem(new PinchConfigureSystem());
      world.registerSystem(new PinchConstraintBuildSystem());
      world.registerSystem(new CableAttachmentCacheSystem());
      world.registerSystem(new CableSlackSystem());
      world.registerSystem(new PBDCableConstraintSolver());
      world.registerSystem(new PBDResolveCableOverCorrections());
      world.registerSystem(new PBDBallBorderCollisions());
      world.registerSystem(new CableFrictionSystem());
      world.registerSystem(new PBDVelocityUpdateSystem());
      world.registerSystem(new PBDAngularVelocityUpdateSystem());
      world.registerSystem(new BallBorderOrFlipperVelocityContactSystem());
      world.registerSystem(new EnergyTraceSystem());
      world.registerSystem(new RenderSystem(canvas, cScale, simHeight, 1.0, simWidth / 2.0, simHeight / 2.0, 0.0));
    }

    _updateEnergyPanel({
      step: 0,
      e_total: 0,
      delta_e: 0,
      k_trans: 0,
      k_rot: 0,
      u_gravity: 0,
      u_cable: 0,
      stored_0: storedLength,
      effective_radius_bottom: rawRadius,
      max_border_delta_lambda: 0
    });
  }

  window.getSpoolEnergyConfig = () => ({ ...spoolEnergyConfig });
  window.setSpoolEnergyConfig = (partial = {}) => {
    spoolEnergyConfig = { ...spoolEnergyConfig, ...partial };
    world.setResource('spoolEnergyConfig', { ...spoolEnergyConfig });
    console.log('Spool energy config updated. Press Reset to apply scene values.', spoolEnergyConfig);
    return { ...spoolEnergyConfig };
  };
  window.getSpoolEnergyTrace = () => {
    return world.getResource('energyTrace') || [];
  };
  window.clearSpoolEnergyTrace = () => {
    world.setResource('energyTrace', []);
    world.setResource('energyTraceStep', 0);
    console.log('Spool energy trace cleared.');
  };
  window.dumpSpoolEnergyTrace = () => {
    const trace = world.getResource('energyTrace') || [];
    console.log('SPOOL_ENERGY_TRACE_JSON_START');
    console.log(JSON.stringify(trace));
    console.log('SPOOL_ENERGY_TRACE_JSON_END');
    return trace;
  };

  runGame(world, setupScene, null);
</script>
</body>
</html>
