<!DOCTYPE html>
<html>
<head>
    <title>Slideprinter (Python Backend)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iZ3JleSIvPjwvc3ZnPg==" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
    <style>
:root {
  --bg-1: #2d2d2d;
  --accent-1: #ff452a;
  --accent-2: #ffb347;
  --text-main: #fafafa;
  --text-dim:  #c0c0c0;
  --radius: 4px;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;
  width: 100dvw;
  overflow: hidden;
  background: var(--bg-1);
  color: var(--text-main);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
#gameContainer {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
#controls {
  position: sticky;
  top: 0;
  width: 100%;
  text-align: center;
  margin-block: 0 8px;
  padding-block: 12px 0;
  background: var(--bg-1);
  z-index: 1;
  font-size: 0.9rem;
  color: var(--text-dim);
}
#controls button {
  all: unset;
  cursor: pointer;
  display: inline-block;
  margin: 6px auto;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.95rem;
  color: #fff;
  background: var(--accent-1);
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
  transition: transform .12s ease, box-shadow .12s ease;
}
#controls button:hover,
#controls button:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(0,0,0,.55);
}
#controls button:active {
  transform: scale(.97);
}
canvas {
  width: 100%;
  flex: 1;
  display: block;
  border-radius: var(--radius);
  touch-action: manipulation;
}
#controls button {
  padding: 10px 16px;
  font-size: 0.85rem;
}
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="controls">
            <button id="pauseBtn" tabindex="-1">Start</button>
            <button id="resetBtn" tabindex="-1">Reset</button>
            <button id="stepBtn">Step</button>
            <button id="dumpBtn" tabindex="-1">Dump State</button><br />
        </div>
        <canvas id="simCanvas"></canvas>
    </div>
<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const stepBtn = document.getElementById('stepBtn');
const dumpBtn = document.getElementById('dumpBtn');
let ws;
let isPaused = true;
let simState = {};

let cScale = 150;
let dt = 1.0 / 200.0;
let baseScale = 150;
const viewScale = 0.5;
const viewOffsetX = 0.0;
const viewOffsetY = -0.5;

function setupCanvas(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  baseScale = canvas.height / 1.7;
}
function toCanvas(x,y){
  const scale = baseScale * viewScale;
  return {
    x: canvas.width/2 + (x - viewOffsetX)*scale,
    y: canvas.height/2 - (y - viewOffsetY)*scale
  };
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(simState.balls){
    simState.balls.forEach(b=>{
      const p = toCanvas(b.x,b.y);
      ctx.fillStyle = b.mass < 0 ? '#777' : (b.color || '#ccc');
      const scale = baseScale * viewScale;
      ctx.beginPath();
      ctx.arc(p.x,p.y,b.radius*scale,0,2*Math.PI);
      ctx.fill();
    });
  }
  if(simState.cables){
    ctx.strokeStyle = '#00FFFF';
    simState.cables.forEach(c=>{
      c.joints.forEach(j=>{
        const pA = toCanvas(j.pA[0],j.pA[1]);
        const pB = toCanvas(j.pB[0],j.pB[1]);
        ctx.beginPath();
        ctx.moveTo(pA.x,pA.y);
        ctx.lineTo(pB.x,pB.y);
        ctx.stroke();
      });
    });
  }
}
function connect(){
  ws = new WebSocket('ws://localhost:8766');
  ws.onopen = () => {
    pauseBtn.disabled = false;
    resetBtn.disabled = false;
    setupCanvas();
  };
  ws.onmessage = e => {
    simState = JSON.parse(e.data);
    if(simState.isPaused !== undefined){
      isPaused = simState.isPaused;
      pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
    }
    render();
  };
  ws.onclose = () => {
    pauseBtn.disabled = true;
    resetBtn.disabled = true;
    setTimeout(connect,1000);
  };
}
function step(){
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({action:'step', steps:1}));
  }
}
function loop(){
  if(!isPaused) step();
  requestAnimationFrame(loop);
}
stepBtn.onclick = () => {
  if(isPaused) step();
};
dumpBtn.onclick = () => {
  console.log(simState);
};
pauseBtn.onclick = () => {
  if(!ws) return;
  isPaused = !isPaused;
  pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
  ws.send(JSON.stringify({action:'pause', paused:isPaused}));
};
resetBtn.onclick = () => {
  if(ws && ws.readyState === WebSocket.OPEN){
    isPaused = true;
    pauseBtn.textContent = 'Start';
    ws.send(JSON.stringify({action:'reset'}));
  }
};

async function start(){
  const usdaPath = '../../usd_scenes/slideprinter_copy_for_vite.usda.txt';
  try{
    const res = await fetch(usdaPath);
    if(res.ok){
      const text = await res.text();
      const m = text.match(/timeCodesPerSecond\s*=\s*(\d+(\.\d+)?)/);
      if(m && m[1]){
        dt = 1.0 / parseFloat(m[1]);
      }
    }
  }catch(err){
    console.error('Failed to load dt from USDA', err);
  }
  connect();
  setupCanvas();
  render();
  requestAnimationFrame(loop);
}

start();
</script>
</body>
</html>
