<!DOCTYPE html>
<html>
<head>
    <title>Slideprinter (Python Backend)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iZ3JleSIvPjwvc3ZnPg==" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
    <style>
:root {
  --bg-1: #2d2d2d;
  --accent-1: #ff452a;
  --accent-2: #ffb347;
  --text-main: #fafafa;
  --text-dim:  #c0c0c0;
  --radius: 4px;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;
  width: 100dvw;
  overflow: hidden;
  background: var(--bg-1);
  color: var(--text-main);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
#gameContainer {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
#controls {
  position: sticky;
  top: 0;
  width: 100%;
  text-align: center;
  margin-block: 0 8px;
  padding-block: 12px 0;
  background: var(--bg-1);
  z-index: 1;
  font-size: 0.9rem;
  color: var(--text-dim);
}
#controls button {
  all: unset;
  cursor: pointer;
  display: inline-block;
  margin: 6px auto;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.95rem;
  color: #fff;
  background: var(--accent-1);
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
  transition: transform .12s ease, box-shadow .12s ease;
  padding: 10px 16px;
  font-size: 0.85rem;
}
#controls button:hover,
#controls button:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(0,0,0,.55);
}
#controls button:active {
  transform: scale(.97);
}
canvas {
  width: 100%;
  flex: 1;
  display: block;
  border-radius: var(--radius);
  touch-action: manipulation;
}
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="controls">
            <button id="pauseBtn" tabindex="-1">Start</button>
            <button id="resetBtn" tabindex="-1">Reset</button>
            <button id="stepBtn">Step</button>
            <button id="dumpBtn" tabindex="-1">Dump State</button><br />
            <div id="stats" style="margin-top: 4px; font-size: 0.8rem;">
              dt: <span id="dt">N/A</span> |
              Speed: <span id="speed">N/A</span>
            </div>
        </div>
        <canvas id="myCanvas"></canvas>
    </div>
<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const stepBtn = document.getElementById("stepBtn");
    const dumpBtn = document.getElementById('dumpBtn');
    const dtEl = document.getElementById('dt');
    const speedEl = document.getElementById('speed');

    let simState = {};
    let isPaused = true;
    let cScale, simHeight = 1.7, simWidth = 1.0;
    const viewScale = 0.5;
    const viewOffsetX = 0.0;
    const viewOffsetY = -0.5;

    let ws;
    let accumulator = 0.0; // in seconds
    let dt; // Will be loaded from USDA
    let maxAccumulator; // Derived from dt
    let speedSamples = [];
    const numSpeedSamples = 60;
    let frameCounter = 0;
    const sag_multiplier = 0.3; // For catenary drawing

    function setupCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        cScale = canvas.height / simHeight;
        simWidth = canvas.width / cScale;
    }

    function toCanvas(simX, simY) {
        const scale = cScale * viewScale;
        return {
            x: canvas.width / 2 + (simX - viewOffsetX) * scale,
            y: canvas.height / 2 - (simY - viewOffsetY) * scale
        };
    }

    function _drawCatenary(ctx, pA_sim, pB_sim, length, obstacles, sag_multiplier, toCanvas, segments = 20) {
        const dx = pB_sim.x - pA_sim.x;
        const dy = pB_sim.y - pA_sim.y;
        const D = Math.hypot(dx, dy);
        if (D <= 1e-6) return;

        // parabolic sag magnitude
        const sag = Math.max(length - D, 0) * sag_multiplier;
        const sagDir = { x: 0, y: -1 }; // default sag direction, normalized

        ctx.beginPath();

        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            // 1) ideal point along straight+parabola
            const sagOff = sag * 4 * t * (1 - t);
            let pt = {
                x: pA_sim.x + dx * t + sagDir.x * sagOff,
                y: pA_sim.y + dy * t + sagDir.y * sagOff
            };

            // 2) obstacle-avoidance
            for (const obs of obstacles) {
                const obs_pos = { x: obs.x, y: obs.y };
                const v_x = pt.x - obs_pos.x;
                const v_y = pt.y - obs_pos.y;
                const d2 = v_x * v_x + v_y * v_y;
                const r2 = obs.radius * obs.radius;

                if (d2 < r2) {
                    const d = Math.sqrt(d2);
                    const push = obs.radius - d;
                    if (d > 1e-9) {
                        const pd_x = v_x / d;
                        const pd_y = v_y / d;
                        pt.x += pd_x * push;
                        pt.y += pd_y * push;
                    } else {
                        // exactly at center -> force straight-down
                        pt.x = obs_pos.x;
                        pt.y = obs_pos.y - obs.radius;
                    }
                }
            }

            // 3) draw
            const c_pt = toCanvas(pt.x, pt.y);
            if (i === 0) {
                ctx.moveTo(c_pt.x, c_pt.y);
            } else {
                ctx.lineTo(c_pt.x, c_pt.y);
            }
        }

        ctx.stroke();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const scale = cScale * viewScale;

        // Draw Balls
        if (simState.balls) {
            simState.balls.forEach(ball => {
                ctx.fillStyle = '#a0a0a0';
                const p = toCanvas(ball.x, ball.y);
                const r = ball.radius * scale;

                ctx.save();
                ctx.translate(p.x, p.y);
                if (ball.angle !== undefined) {
                    ctx.rotate(-ball.angle);
                }

                // Draw circle
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, 2 * Math.PI);
                ctx.fill();

                // Draw orientation line
                if (ball.angle !== undefined) {
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, -r);
                    ctx.stroke();
                }
                ctx.restore();
            });
        }

        // Draw Cables
        if (simState.cables) {
            const cableColorTaut = '#00FFFF'; // Cyan
            const cableColorSlack = 'orange';

            simState.cables.forEach(cable => {
                ctx.lineWidth = 2.0;

                // Draw joints (line segments)
                if (cable.joints) {
                    cable.joints.forEach(joint => {
                        const pA_sim = { x: joint.pA[0], y: joint.pA[1] };
                        const pB_sim = { x: joint.pB[0], y: joint.pB[1] };
                        const dist = Math.hypot(pB_sim.x - pA_sim.x, pB_sim.y - pA_sim.y);
                        const isSlack = joint.restLength > dist + 1e-6;

                        ctx.strokeStyle = isSlack ? cableColorSlack : cableColorTaut;

                        if (isSlack) {
                            _drawCatenary(ctx, pA_sim, pB_sim, joint.restLength, [], sag_multiplier, toCanvas);
                        } else {
                            const pA_canvas = toCanvas(pA_sim.x, pA_sim.y);
                            const pB_canvas = toCanvas(pB_sim.x, pB_sim.y);
                            ctx.beginPath();
                            ctx.moveTo(pA_canvas.x, pA_canvas.y);
                            ctx.lineTo(pB_canvas.x, pB_canvas.y);
                            ctx.stroke();
                        }
                    });
                }

                // Draw arcs (for rolling contacts)
                if (cable.arcs) {
                    cable.arcs.forEach(arc => {
                        const center = toCanvas(arc.center[0], arc.center[1]);
                        const radius = arc.radius * scale;

                        const p1_sim = {x: arc.p1[0], y: arc.p1[1]};
                        const center_sim = {x: arc.center[0], y: arc.center[1]};
                        const p2_sim = {x: arc.p2[0], y: arc.p2[1]};

                        const a1 = Math.atan2(p1_sim.y - center_sim.y, p1_sim.x - center_sim.x);
                        const a2 = Math.atan2(p2_sim.y - center_sim.y, p2_sim.x - center_sim.x);

                        ctx.strokeStyle = arc.is_taut ? cableColorTaut : cableColorSlack;

                        ctx.beginPath();
                        ctx.arc(
                            center.x,
                            center.y,
                            radius,
                            -a1, // negate for canvas' flipped y-axis
                            -a2,
                            arc.anticlockwise
                        );
                        ctx.stroke();
                    });
                }

                // Draw Hybrid Links (markers and arcs)
                if (cable.links) {
                    cable.links.forEach(link => {
                        if (link.type === 'hybrid-attachment') {
                            if (link.attachmentPoint) {
                                ctx.fillStyle = '#FF0000'; // Red
                                const markerPos = toCanvas(link.attachmentPoint[0], link.attachmentPoint[1]);
                                ctx.beginPath();
                                ctx.arc(markerPos.x, markerPos.y, 4, 0, 2 * Math.PI); // 4px radius marker
                                ctx.fill();
                            }
                        } else if (link.type === 'hybrid') {
                            if (link.center && link.radius > 1e-9) {
                                const center_sim = { x: link.center[0], y: link.center[1] };
                                const tangent_sim = { x: link.tangentPoint[0], y: link.tangentPoint[1] };

                                const toTangent = { x: tangent_sim.x - center_sim.x, y: tangent_sim.y - center_sim.y };
                                const tangentAngle = Math.atan2(toTangent.y, toTangent.x);
                                const deltaAngle = link.storedLength / link.radius;
                                const endAngle = link.cw ? tangentAngle - deltaAngle : tangentAngle + deltaAngle;

                                const center = toCanvas(center_sim.x, center_sim.y);
                                const radius = link.radius * scale;
                                const anticlockwise = !link.cw;

                                // Draw the arc for the wrapped cable
                                ctx.strokeStyle = link.is_taut ? cableColorTaut : cableColorSlack;
                                ctx.beginPath();
                                ctx.arc(
                                    center.x,
                                    center.y,
                                    radius,
                                    -tangentAngle, // start angle
                                    -endAngle,     // end angle
                                    anticlockwise
                                );
                                ctx.stroke();

                                // Draw the red dot at the end of the stored arc
                                const endOfArcPoint_sim = {
                                    x: center_sim.x + link.radius * Math.cos(endAngle),
                                    y: center_sim.y + link.radius * Math.sin(endAngle)
                                };
                                const markerPos = toCanvas(endOfArcPoint_sim.x, endOfArcPoint_sim.y);
                                ctx.fillStyle = '#FF0000'; // Red
                                ctx.beginPath();
                                ctx.arc(markerPos.x, markerPos.y, 4, 0, 2 * Math.PI); // 4px radius marker
                                ctx.fill();
                            }
                        }
                    });
                }
            });
        }
    }

    function connect() {
        ws = new WebSocket('ws://localhost:8766');

        ws.onopen = () => {
            console.log('Connected to Python WebSocket server.');
            setupCanvas();
            isPaused = true;
            pauseBtn.textContent = "Start";
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            stepBtn.disabled = false;
        };

        ws.onmessage = (event) => {
            simState = JSON.parse(event.data);
            if (simState.isPaused !== undefined) {
                isPaused = simState.isPaused;
                if (isPaused) {
                    if (pauseBtn.textContent !== "Start") {
                        pauseBtn.textContent = "Resume";
                    }
                } else {
                    pauseBtn.textContent = "Pause";
                }
            }
            render();
        };

        ws.onclose = () => {
            console.log('Disconnected from server. Reconnecting in 1s...');
            pauseBtn.textContent = "Reconnecting...";
            pauseBtn.disabled = true;
            resetBtn.disabled = true;
            stepBtn.disabled = true;
            setTimeout(connect, 1000);
        };

        ws.onerror = (error) => {
            console.error('WebSocket Error:', error);
        };
    }

    let lastTime = 0;
    function gameLoop(currentTime) {
        if (!lastTime) {
            lastTime = currentTime;
        }

        const speedScale = 1.0;
        const frameSec = speedScale * (currentTime - lastTime) / 1000.0;
        let stepsToTake = 0;

        if (frameSec >= dt) {
            lastTime = currentTime;

            if (!isPaused && ws && ws.readyState === WebSocket.OPEN) {
                accumulator = Math.min(accumulator + frameSec, maxAccumulator);
                stepsToTake = Math.floor(accumulator / dt);

                if (stepsToTake > 0) {
                    accumulator -= stepsToTake * dt;
                    ws.send(JSON.stringify({ action: 'step', steps: stepsToTake }));
                }
            }
        }

        if (frameSec > 1e-6 && stepsToTake > 0) {
            const simTimeDelta = stepsToTake * dt;
            const currentSpeed = simTimeDelta / frameSec;
            speedSamples.push(currentSpeed);
            if (speedSamples.length > numSpeedSamples) {
                speedSamples.shift();
            }
        }

        frameCounter++;
        if (frameCounter % 10 === 0 && speedEl && speedSamples.length > 0) {
            const avgSpeed = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
            speedEl.textContent = `${avgSpeed.toFixed(2)}x`;
        }

        requestAnimationFrame(gameLoop);
    }

    pauseBtn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "Resume" : "Pause";
            ws.send(JSON.stringify({ action: 'pause', paused: isPaused }));
            if (!isPaused) {
                lastTime = performance.now();
            }
        }
    });

    resetBtn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            isPaused = true;
            pauseBtn.textContent = "Start";
            ws.send(JSON.stringify({ action: 'reset' }));
            speedSamples = [];
            frameCounter = 0;
            if (speedEl) speedEl.textContent = 'N/A';
            accumulator = 0.0;
            lastTime = 0;
        }
    });

    stepBtn.addEventListener('click', () => {
        if (isPaused && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'step', steps: 1 }));
        }
    });

    dumpBtn.addEventListener('click', () => {
        console.log(simState);
    });

    window.addEventListener('resize', setupCanvas);

    async function start() {
        const usdaPath = '../../../public/examples/usd_scenes/slideprinter_copy_for_vite.usda.txt';
        try {
            const response = await fetch(usdaPath);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const text = await response.text();
            const match = text.match(/timeCodesPerSecond\s*=\s*(\d+(\.\d+)?)/);
            let timeCodesPerSecond = 200; // Default fallback
            if (match && match[1]) {
                timeCodesPerSecond = parseFloat(match[1]);
            } else {
                console.warn(`Could not find 'timeCodesPerSecond' in ${usdaPath}. Falling back to ${timeCodesPerSecond}Hz.`);
            }

            dt = 1.0 / timeCodesPerSecond;
            maxAccumulator = dt * 500;

            if (dtEl) dtEl.textContent = `${(dt * 1000).toFixed(2)}ms`;

        } catch (error) {
            console.error('Failed to load or parse USDA file for dt:', error);
            dt = 1.0 / 200.0;
            maxAccumulator = dt * 5;
            if (dtEl) dtEl.textContent = `ERR! Using ${(dt * 1000).toFixed(2)}ms`;
        }

        connect();
        requestAnimationFrame(gameLoop);
    }

    start();
</script>
</body>
</html>
