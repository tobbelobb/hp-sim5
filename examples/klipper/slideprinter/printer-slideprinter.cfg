# Minimal Slideprinter config for Klipper batch mode
# - Kinematics: winch (3-cable planar)
# - Anchors from USD scene (meters -> mm)
# - Pins are Linux process MCU examples; they are not used in batch mode
#   beyond parsing/serialization, but must be syntactically valid.

[mcu]
# Use Linux process MCU dictionary; in batch mode, -d out/klipper.dict provides
# the MCU data, so Klippy does not need to connect.
serial: /tmp/klipper_host_mcu

[printer]
kinematics: winch
max_velocity: 300
max_accel: 3000
#square_corner_velocity: 5.0

# Common stepper parameters
# Spool radius ~0.03 m => circumference ~ 188.496 mm per revolution
# rotation_distance is per full motor rotation (after gearing); direct drive assumed.

[stepper_a]
step_pin: gpiochip0/gpio20
dir_pin: gpiochip0/gpio21
enable_pin: !gpiochip0/gpio16
microsteps: 16
rotation_distance: 188.496
# Anchor A at (0.0, -2.1, 0.0) meters -> mm
anchor_x: 0
anchor_y: -2100
anchor_z: 0

[stepper_b]
step_pin: gpiochip0/gpio19
dir_pin: gpiochip0/gpio26
enable_pin: !gpiochip0/gpio13
microsteps: 16
rotation_distance: 188.496
# Anchor B at (1.776, 1.025, 0.0) meters -> mm
anchor_x: 1776
anchor_y: 1025
anchor_z: 0

[stepper_c]
step_pin: gpiochip0/gpio6
dir_pin: gpiochip0/gpio5
enable_pin: !gpiochip0/gpio12
microsteps: 16
rotation_distance: 188.496
# Anchor C at (-1.776, 1.025, 0.0) meters -> mm
anchor_x: -1776
anchor_y: 1025
anchor_z: 0

# Optional: allow moves without homing (useful for batch translation only)
[force_move]
enable_force_move: True
