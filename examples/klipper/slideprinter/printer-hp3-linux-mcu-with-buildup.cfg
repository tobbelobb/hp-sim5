# Slideprinter config for Klipper, the mcu part running as a Linux process
# - The fake pin chip must be created first by make-fake-pin-chip.sh <point_to_this_file>
#   It makes sure to not collide with any real gpio pins on your system
#   It will replace 1 with the number of the fake gpio chip

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: winch
max_velocity: 300
max_accel: 3000
#square_corner_velocity: XXX
winch_mover_weight: 0.006
winch_spring_constant: 20000.0
winch_min_force: 2.5, 2.5, 2.5, 2.5
winch_max_force: 170, 170, 170, 170
winch_guy_wire_lengths: 528.3, 528.3, 528.3, 528.3
winch_buildup_factor: 0.6366197723675814
winch_mechanical_advantage: 1, 1, 1, 1
flex_compensation_algorithm: qp
ignore_gravity: false
ignore_pretension: false

## Winch steppers (mapped to atmega644p pins)
[stepper_a]
step_pin: gpiochip1/gpio0
dir_pin: gpiochip1/gpio1
enable_pin: gpiochip1/gpio2
microsteps: 16
rotation_distance: 246.20
anchor_x: 0
anchor_y: -1900
anchor_z: -280

[stepper_b]
step_pin: gpiochip1/gpio3
dir_pin: gpiochip1/gpio4
enable_pin: gpiochip1/gpio5
microsteps: 16
rotation_distance: 246.20
anchor_x: 1645.448267190434
anchor_y: 950
anchor_z: -280

[stepper_c]
step_pin: gpiochip1/gpio6
dir_pin: gpiochip1/gpio7
enable_pin: gpiochip1/gpio8
microsteps: 16
rotation_distance: 246.20
anchor_x: -1645.448267190434
anchor_y: 950
anchor_z: -280

[stepper_d]
step_pin: gpiochip1/gpio9
dir_pin: gpiochip1/gpio10
enable_pin: gpiochip1/gpio11
microsteps: 16
rotation_distance: 246.20
anchor_x: 0
anchor_y: 0
anchor_z: 1900

[extruder]
step_pin: gpiochip1/gpio12
dir_pin: gpiochip1/gpio13
enable_pin: gpiochip1/gpio14
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
sensor_type: temperature_host
sensor_path: examples/klipper/slideprinter/extruder.temp
heater_pin: gpiochip1/gpio15
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
min_extrude_temp: 0
max_temp: 275

[heater_bed]
sensor_type: temperature_host
sensor_path: examples/klipper/slideprinter/bed.temp
heater_pin: gpiochip1/gpio17
control: watermark
min_temp: 0
max_temp: 130


[force_move]
enable_force_move: True
