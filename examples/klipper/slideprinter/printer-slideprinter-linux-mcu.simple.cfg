# Slideprinter config for Klipper, the mcu part running as a Linux process
# - The fake pin chip must be created first by make-fake-pin-chip.sh <point_to_this_file>
#   It makes sure to not collide with any real gpio pins on your system
#   It will replace 1 with the number of the fake gpio chip

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: winch
max_velocity: 300
max_accel: 3000

## Winch steppers (mapped to atmega644p pins)
[stepper_a]
step_pin: gpiochip1/gpio0
dir_pin: gpiochip1/gpio1
enable_pin: gpiochip1/gpio2
microsteps: 16
rotation_distance: 188.496
anchor_x: 0
anchor_y: -2100
anchor_z: 0

[stepper_b]
step_pin: gpiochip1/gpio3
dir_pin: gpiochip1/gpio4
enable_pin: gpiochip1/gpio5
microsteps: 16
rotation_distance: 188.496
anchor_x: 1776
anchor_y: 1025
anchor_z: 0

[stepper_c]
step_pin: gpiochip1/gpio6
dir_pin: gpiochip1/gpio7
enable_pin: gpiochip1/gpio8
microsteps: 16
rotation_distance: 188.496
anchor_x: -1776
anchor_y: 1025
anchor_z: 0

[stepper_d]
step_pin: gpiochip1/gpio9
dir_pin: gpiochip1/gpio10
enable_pin: gpiochip1/gpio11
microsteps: 16
rotation_distance: 188.496
anchor_x: 0
anchor_y: 0
anchor_z: 2000

[force_move]
enable_force_move: True
