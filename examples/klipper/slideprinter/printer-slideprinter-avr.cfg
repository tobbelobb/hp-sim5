# Slideprinter config for Klipper batch mode (AVR mcu)
# - Uses AVR-style pins so thermistor/ADC are valid
# - Suitable for translating E moves (extruder present)

[mcu]
serial: /tmp/pseudoserial

[printer]
kinematics: winch
max_velocity: 300
max_accel: 3000

# Winch steppers (pins from example-winch.cfg style)
[stepper_a]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 188.496
anchor_x: 0
anchor_y: -2100
anchor_z: 0

[stepper_b]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 188.496
anchor_x: 1776
anchor_y: 1025
anchor_z: 0

[stepper_c]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 188.496
anchor_x: -1776
anchor_y: 1025
anchor_z: 0

# Extruder (example values; adjust rotation_distance to your drive)
[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 275

# Optional bed (not required for batch mode)
[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[force_move]
enable_force_move: True

