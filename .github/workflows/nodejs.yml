name: Node.js CI

on:
  push:
    branches-ignore:
      - deploy_flipper

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
      RUN_RRF_HTTP_ENDPOINT_TESTS: "1"
    strategy:
      matrix:
        node-version: [23.x]
    steps:
      - uses: actions/checkout@v3
      - name: Fetch required submodules (https)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
          git submodule sync RRF/ReprapFirmware RRF/RRFLibraries RRF/CANlib autocal/auto-calibration-simulation-for-hangprinter
          git submodule update --init RRF/ReprapFirmware RRF/RRFLibraries RRF/CANlib autocal/auto-calibration-simulation-for-hangprinter
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Python, pytest, numpy, scipy, matplotlib, warp-lang[extras], websockets, pytest-asyncio, and usd-core
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-warp.txt
          python -m pip install -r autocal/requirements-jax-cpu.txt
      - name: Configure rrf_simulator build
        run: cmake -S RRF -B RRF/build
      - name: Build rrf_simulator
        run: cmake --build RRF/build --target rrf_simulator -j
      - name: Run test suite
        run: scripts/run_ci_tests.sh
