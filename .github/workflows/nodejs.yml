name: Node.js CI

on:
  push:
    branches-ignore:
      - deploy_flipper

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    strategy:
      matrix:
        node-version: [23.x]
    steps:
      - uses: actions/checkout@v3
      - name: Fetch submodules (https)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Cache npm dependencies
      # Puppeteer specific: Install dependencies for headless Chrome
      # This step might be necessary if the default runner doesn't have them all.
      # Often, Puppeteer's install script handles this, or the base image is sufficient.
      # If tests fail with Chrome launch errors, uncomment and adapt this.
      # - name: Install Puppeteer dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -yq libgconf-2-4 libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 \
      #     libexpat1 libfontconfig1 libgcc1 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 \
      #     libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
      #     libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 \
      #     ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils wget
      - name: Install dependencies
        run: npm ci
      - name: Install Python, pytest, numpy, warp-lang[extras], websockets, pytest-asyncio, and usd-core
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install pytest numpy warp-lang[extras] websockets pytest-asyncio usd-core
      - name: Configure rrf_simulator build
        run: cmake -S RRF -B RRF/build
      - name: Build rrf_simulator
        run: cmake --build RRF/build --target rrf_simulator -j
      - name: Run test suite
        run: scripts/run_ci_tests.sh
