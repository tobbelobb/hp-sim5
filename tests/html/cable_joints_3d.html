<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cable Joints 3D</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iIzQ0NCIvPjwvc3ZnPg==" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap');

    :root {
      color-scheme: dark;
      --bg-1: #0e1116;
      --bg-2: #0c1b1f;
      --panel: rgba(16, 22, 32, 0.9);
      --panel-border: rgba(120, 140, 160, 0.3);
      --text: #e6edf3;
      --muted: #9aa7b2;
      --accent: #5fd0f2;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(1200px 800px at 10% 10%, var(--bg-2), var(--bg-1));
      font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #hud {
      position: absolute;
      inset: 12px 12px auto 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      z-index: 5;
    }

    #hud .title {
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-right: 8px;
    }

    #hud .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    #hud button {
      background: #1a2635;
      color: var(--text);
      border: 1px solid rgba(120, 140, 160, 0.4);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: inherit;
      cursor: pointer;
    }

    #hud button:hover {
      border-color: var(--accent);
    }

    #hud .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
    }

    #hud input[type="checkbox"] {
      accent-color: var(--accent);
    }

    #stats {
      margin-left: auto;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    #errorPanel {
      position: absolute;
      inset: auto 12px 12px 12px;
      padding: 12px;
      background: rgba(80, 10, 10, 0.85);
      border: 1px solid rgba(255, 120, 120, 0.5);
      border-radius: 10px;
      color: #ffd9d9;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
      max-height: 30vh;
      overflow-y: auto;
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.177.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.177.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" crossorigin src="/hp-sim5/assets/tests/html/cable_joints_3d.html-DwylPFOQ.js"></script>
  <link rel="modulepreload" crossorigin href="/hp-sim5/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/hp-sim5/assets/cable_joints_core-y2J6H9Uu.js">
  <link rel="modulepreload" crossorigin href="/hp-sim5/assets/geometry3-DToUDQN2.js">
  <link rel="modulepreload" crossorigin href="/hp-sim5/assets/flipper_common-qtLI2ccd.js">
  <link rel="modulepreload" crossorigin href="/hp-sim5/assets/ball_obstacle_bump_system-Dln3uXOr.js">
</head>
<body>
  <div id="hud">
    <div class="title">Cable Joints 3D</div>
    <div class="controls">
      <button id="pauseBtn" tabindex="-1">Start</button>
      <button id="stepBtn">Step</button>
      <button id="resetBtn" tabindex="-1">Reset</button>
      <label class="toggle">
        <input id="wireframeToggle" type="checkbox" />
        Wireframe
      </label>
      <label class="toggle">
        <input id="attachmentsToggle" type="checkbox" checked />
        Attachments
      </label>
      <label class="toggle">
        <input id="orientationToggle" type="checkbox" checked />
        Orientation
      </label>
      <label class="toggle">
        <input id="velocityToggle" type="checkbox" />
        Velocities
      </label>
    </div>
    <div id="stats">
      <span>Steps: <span id="stepCount">0</span></span>
      <span>Length: <span id="lengthReadout">0.000</span></span>
      <span>Rest: <span id="restReadout">0.000</span></span>
    </div>
  </div>

  <canvas id="canvas"></canvas>
  <div id="errorPanel"></div>

</body>
</html>
