[extruder]
step_pin: gpiochip1/gpio24
dir_pin: gpiochip1/gpio25
enable_pin: gpiochip1/gpio26
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
max_extrude_cross_section: 2.0
filament_diameter: 1.750
sensor_type: temperature_host
sensor_path: public/klipper/cubecorners/extruder.temp
heater_pin: gpiochip1/gpio27
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
min_extrude_temp: 0
max_temp: 275

[heater_bed]
sensor_type: temperature_host
sensor_path: public/klipper/cubecorners/bed.temp
heater_pin: gpiochip1/gpio29
control: watermark
min_temp: 0
max_temp: 130

[force_move]
enable_force_move: True

[hangprinter_m569]
