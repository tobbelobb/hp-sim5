# Cubecorners config for Klipper, the mcu part running as a Linux process

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: winch
max_velocity: 300
max_accel: 3000
winch_mover_weight: 0.216
winch_spring_constant: 20000.0
winch_min_force: 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0
winch_max_force: 170.0, 170.0, 170.0, 170.0, 170.0, 170.0, 170.0, 170.0
winch_guy_wire_lengths: 117.2, 117.2, 117.2, 117.2, 117.2, 117.2, 117.2, 117.2
winch_mechanical_advantage: 1, 1, 1, 1, 1, 1, 1, 1
flex_compensation_algorithm: qp
ignore_gravity: false
ignore_pretension: false

[stepper_a]
step_pin: gpiochip1/gpio0
dir_pin: gpiochip1/gpio1
enable_pin: gpiochip1/gpio2
microsteps: 16
rotation_distance: 188.495559
m569_address: 40.0
anchor_x: 1284.9
anchor_y: -1284.9
anchor_z: 1900.0

