# COPacabana config for Klipper, the mcu part running as a Linux process

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: winch
winch_anchor_mode: cube_corner
max_velocity: 500
max_accel: 3000
winch_mover_weight: 13.9
winch_spring_constant: 118500.0
winch_min_force: 50, 50, 50, 50, 50, 50, 50, 50
winch_max_force: 700.0, 700.0, 700.0, 700.0, 700.0, 700.0, 700.0, 700.0
winch_guy_wire_lengths: 193.9, 193.9, 193.9, 193.9, 193.9, 193.9, 193.9, 193.9
winch_mechanical_advantage: 1, 1, 1, 1, 1, 1, 1, 1
flex_compensation_algorithm: qp
ignore_gravity: false
ignore_pretension: false

[stepper_a]
step_pin: gpiochip1/gpio0
dir_pin: gpiochip1/gpio1
enable_pin: gpiochip1/gpio2
microsteps: 16
rotation_distance: 307.876080
m569_address: 40.0
anchor_x: -2305.6402
anchor_y: 1685.1041
anchor_z: 2087.9022
attachment_x: -150.0000
