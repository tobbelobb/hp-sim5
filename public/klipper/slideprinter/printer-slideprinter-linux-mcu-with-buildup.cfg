# Slideprinter config for Klipper, the mcu part running as a Linux process

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: winch
max_velocity: 300
max_accel: 3000
winch_buildup_factor: 0.6366197723675814
winch_mover_weight: 0.006
winch_spring_constant: 20000.0
#square_corner_velocity: XXX
winch_min_force: 3, 3, 3
winch_max_force: 170, 170, 170
winch_guy_wire_lengths: 528.3, 528.3, 528.3
flex_compensation_algorithm: qp
ignore_gravity: true
ignore_pretension: false
winch_mechanical_advantage: 1, 1, 1

[stepper_a]
step_pin: gpiochip1/gpio0
dir_pin: gpiochip1/gpio1
enable_pin: gpiochip1/gpio2
microsteps: 16
rotation_distance: 188.496
anchor_x: 0
anchor_y: -1900
anchor_z: 0

[stepper_b]
step_pin: gpiochip1/gpio3
dir_pin: gpiochip1/gpio4
enable_pin: gpiochip1/gpio5
microsteps: 16
rotation_distance: 188.496
anchor_x: 1645.44826719
anchor_y: 950
anchor_z: 0

[stepper_c]
step_pin: gpiochip1/gpio6
dir_pin: gpiochip1/gpio7
enable_pin: gpiochip1/gpio8
microsteps: 16
rotation_distance: 188.496
anchor_x: -1645.44826719
anchor_y: 950
anchor_z: 0


[extruder]
step_pin: gpiochip1/gpio12
dir_pin: gpiochip1/gpio13
enable_pin: gpiochip1/gpio14
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
# Heater output uses a PWM-capable pin on Linux MCU. Placeholder kept
# as a regular GPIO here; see make-fake-pin-chip.sh for notes on Linux
# hardware PWM (pwmchipX/pwmY) if you need it.
heater_pin: gpiochip1/gpio15
sensor_type: temperature_host
sensor_path: public/klipper/slideprinter/extruder.temp
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
min_extrude_temp: 0
max_temp: 275

[heater_bed]
# Heater output uses a PWM-capable pin on Linux MCU. Placeholder kept
# as a regular GPIO here; see make-fake-pin-chip.sh for notes on Linux
# hardware PWM (pwmchipX/pwmY) if you need it.
heater_pin: gpiochip1/gpio17
sensor_type: temperature_host
sensor_path: public/klipper/slideprinter/bed.temp
control: watermark
min_temp: 0
max_temp: 130

[force_move]
enable_force_move: True

[hangprinter_m569]
