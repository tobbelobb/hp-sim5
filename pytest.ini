[pytest]
addopts = -m "not slow"
markers =
    slow: extended checks excluded by default; opt in with -m slow or include all with -m ""
testpaths =
    autocal/tests
    tests/python
    .agents/skills/cloud-research-client/tests
norecursedirs =
    .git
    node_modules
    dist
    dist-hangprinter-org
    RRF
    klipper
    hangprinter-org
    hp-sim
    slideprinter
    examples
    public
    run
    specs
    debug_sessions
    debug_plots
    plots
