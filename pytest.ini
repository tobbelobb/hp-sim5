[pytest]
addopts = -m "not slow and not heavy"
asyncio_default_fixture_loop_scope = function
markers =
    slow: starts simulators, recorders, hosts or MCP servers; excluded by default, opt in with -m slow
    heavy: full auto-calibration runs that take minutes; opt in with -m heavy
testpaths =
    autocal/tests
    tests/python
    research-program/tests
norecursedirs =
    .git
    node_modules
    dist
    dist-hangprinter-org
    RRF
    klipper
    hangprinter-org
    slideprinter
    examples
    public
    run
    specs
    debug_sessions
    debug_plots
    plots
