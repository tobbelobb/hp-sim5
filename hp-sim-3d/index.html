<!DOCTYPE html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hangprinter Simulator</title>
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iZ3JleSIvPjwvc3ZnPg==" />
    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js",
          "three/addons/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script>
      // Apply the remembered colour theme before first paint.
      try {
        const theme = localStorage.getItem('hp-sim-3d.colorTheme');
        if (['classic', 'graphite', 'daylight', 'contrast'].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="sim-shell">
        <div class="sim-app" aria-live="polite">
          <div id="controls" class="sim-controls">
            <div class="sim-buttons">
              <div class="sim-start-buttons">
                <button id="printLogoBtn" type="button" class="sim-play sim-start"><span class="sim-label-long">Print </span>Logo</button>
                <button id="printSquareBtn" type="button" class="sim-start"><span class="sim-label-long">Print </span>Squares</button>
                <button id="uploadBtn" type="button" class="sim-upload sim-start">Upload<span class="sim-label-long"> File</span></button>
              </div>
              <div class="sim-machines" data-open="false">
                <button
                  id="machinesToggle"
                  type="button"
                  class="sim-secondary sim-machines-toggle"
                  aria-haspopup="true"
                  aria-expanded="false"
                  aria-controls="machinesMenu"
                >
                  Machines
                </button>
                <div id="machinesMenu" class="sim-machines-menu sim-hidden" aria-labelledby="machinesToggle">
                  <div class="sim-machines-section">
                    <span class="sim-machines-section-title">Preset Scenes</span>
                    <ul id="presetMachinesList" class="sim-machines-options"></ul>
                  </div>
                  <div id="customMachinesSection" class="sim-machines-section sim-machines-section-custom sim-hidden">
                    <span class="sim-machines-section-title">Uploads</span>
                    <ul id="customMachinesList" class="sim-machines-custom"></ul>
                  </div>
                  <button id="machinesRemoveAllBtn" type="button" class="sim-tertiary sim-machines-remove-all">Remove All</button>
                </div>
              </div>
              <div class="sim-settings" data-open="false">
                <button
                  id="settingsToggle"
                  type="button"
                  class="sim-secondary sim-settings-toggle"
                  aria-haspopup="true"
                  aria-expanded="false"
                  aria-controls="settingsMenu"
                >
                  Settings
                </button>
                <div id="settingsMenu" class="sim-settings-menu sim-hidden" aria-labelledby="settingsToggle">
                  <span class="sim-menu-section-title">View</span>
                  <label class="sim-toggle sim-select" for="colorTheme">
                    <span>Color Theme</span>
                    <select id="colorTheme" aria-describedby="colorThemeHelp"></select>
                  </label>
                  <label id="referenceToggleWrapper" class="sim-toggle" for="referenceToggle">
                    <input id="referenceToggle" aria-describedby="referenceToggleHelp" type="checkbox" disabled>
                    <span>Show Reference Path</span>
                    <span id="referenceToggleHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Overlays the intended toolpath for comparison. Available after loading a file with reference data.</span>
                  </label>
                  <label id="qualityToggleWrapper" class="sim-toggle" for="qualityToggle">
                    <input id="qualityToggle" aria-describedby="qualityToggleHelp" type="checkbox">
                    <span>Live Quality Checks</span>
                    <span id="qualityToggleHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Checks the simulated print as it runs and reports deviations from the intended path.</span>
                  </label>
                  <label id="showForcesToggleWrapper" class="sim-toggle" for="showForcesToggle">
                    <input id="showForcesToggle" aria-describedby="showForcesToggleHelp" type="checkbox">
                    <span>Show Forces</span>
                    <span id="showForcesToggleHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Labels cable tensions (N).</span>
                  </label>
                  <label id="highlightSlackToggleWrapper" class="sim-toggle" for="highlightSlackToggle">
                    <input id="highlightSlackToggle" aria-describedby="highlightSlackToggleHelp" type="checkbox">
                    <span>Highlight Slack Lines</span>
                    <span id="highlightSlackToggleHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Uses a contrasting color to make it easier to spot slack cables.</span>
                  </label>
                  <span class="sim-menu-section-title">Simulation</span>
                  <label id="lineLayeringToggleWrapper" class="sim-toggle" for="lineLayeringToggle">
                    <input id="lineLayeringToggle" aria-describedby="lineLayeringToggleHelp" type="checkbox" checked>
                    <span>Line Layering</span>
                    <span id="lineLayeringToggleHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Models cable layers on spools, aka line buildup. This effect changes the winding radius and cable travel.</span>
                  </label>
                  <label id="closedLoopMotorsToggleWrapper" class="sim-toggle" for="closedLoopMotorsToggle">
                    <input id="closedLoopMotorsToggle" aria-describedby="closedLoopMotorsToggleHelp" type="checkbox">
                    <span>Closed Loop Motors</span>
                    <span id="closedLoopMotorsToggleHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Corrects motor position using feedback. Motor strength is still limited like a real closed loop motor.</span>
                  </label>
                  <label class="sim-toggle sim-select sim-range" for="motorStrength">
                    <span>Motor Strength</span>
                    <input id="motorStrength" aria-describedby="motorStrengthHelp" type="range" min="0.25" max="4" step="0.25" value="1">
                    <output id="motorStrengthValue" for="motorStrength">— Nm</output>
                    <span id="motorStrengthHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Holding torque (Nm). Available torque falls with speed.</span>
                  </label>
                  <label class="sim-toggle sim-select" for="solverIterations">
                    <span>Solver Iterations</span>
                    <select id="solverIterations" aria-describedby="solverIterationsHelp">
                      <option value="" selected>Machine default</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                      <option value="4">4</option>
                      <option value="6">6</option>
                      <option value="8">8</option>
                      <option value="10">10</option>
                      <option value="12">12</option>
                      <option value="16">16</option>
                      <option value="20">20</option>
                      <option value="32">32</option>
                      <option value="64">64</option>
                    </select>
                    <span id="solverIterationsHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Constraint corrections per physics substep. More iterations improve cable constraint convergence but use more CPU.</span>
                  </label>
                  <label class="sim-toggle sim-select" for="physicsSubsteps">
                    <span>Physics Substeps</span>
                    <select id="physicsSubsteps" aria-describedby="physicsSubstepsHelp">
                      <option value="1" selected>1</option>
                      <option value="2">2</option>
                      <option value="4">4</option>
                      <option value="8">8</option>
                      <option value="16">16</option>
                    </select>
                    <span id="physicsSubstepsHelp" class="sim-setting-help" role="tooltip" aria-hidden="true">Splits each simulation timestep into smaller physics steps. More substeps improve stability but use more CPU.</span>
                  </label>
                </div>
              </div>
              <button id="fullscreenBtn" type="button" class="sim-secondary sim-fullscreen" aria-pressed="false">Fullscreen</button>
            </div>
            <input
              type="file"
              id="gcodeFile"
              accept=".gcode,.txt,.serial,.usda,.csv,.can"
              data-reference-presets="Hangprinter_logo6=hangprinterLogo,draw_squares_bigger=straightMovesBigger,draw_squares=straightMoves"
              data-reference-extensions=".txt,.serial,.csv,.can"
              hidden
            >
          </div>

          <div class="canvas-frame">
            <canvas id="myCanvas" role="img" aria-label="Hangprinter simulation"></canvas>
            <div id="qualityHud" class="quality-hud sim-hidden" role="status" aria-live="polite"></div>
            <div id="qualityHistoryHud" class="quality-history sim-hidden" role="status" aria-live="polite">
              <button
                id="qualityHistoryToggle"
                type="button"
                class="quality-history__toggle"
                aria-expanded="false"
                aria-controls="qualityHistoryList"
              >
                Quality History ▼
              </button>
              <div id="qualityHistoryList" class="quality-history__list sim-hidden"></div>
            </div>
            <button
              id="secondaryToggleBtn"
              type="button"
              class="sim-secondary-toggle"
              aria-expanded="false"
              aria-controls="simSecondaryControls"
            >
              ▼
            </button>
            <div id="simSecondaryControls" class="sim-secondary-group sim-hidden" aria-label="Simulation controls">
              <button id="pauseBtn" type="button" class="sim-secondary">Pause</button>
              <button id="resetBtn" type="button" class="sim-secondary">Reset</button>
              <button id="finishAsapBtn" type="button" class="sim-secondary">Finish ASAP</button>
              <button id="rerunBtn" type="button" class="sim-secondary" aria-pressed="false" title="Record every simulation timestep with the local Rerun flight recorder">Rerun</button>
              <div class="sim-tool-button" role="group" aria-label="Trace controls">
                <button id="positionTraceBtn" type="button" class="sim-secondary sim-tool-main" aria-pressed="false" title="Toggle position trace mode">Trace</button>
                <button id="positionTraceClearBtn" type="button" class="sim-tool-clear sim-hidden" aria-label="Clear trace">Clear</button>
              </div>
              <div class="sim-tool-button" role="group" aria-label="Measure controls">
                <button id="measureBtn" type="button" class="sim-secondary sim-tool-main" aria-pressed="false" title="Toggle measure mode">Measure</button>
                <button id="measureClearBtn" type="button" class="sim-tool-clear sim-hidden" aria-label="Clear measurements">Clear</button>
              </div>
              <div id="viewTools" class="sim-zoom" role="group" aria-label="View controls">
                <button id="zoomInBtn" type="button" class="sim-secondary sim-zoom-btn" aria-label="Zoom in">+</button>
                <button id="zoomOutBtn" type="button" class="sim-secondary sim-zoom-btn" aria-label="Zoom out">−</button>
                <button id="panModeBtn" type="button" class="sim-secondary sim-zoom-btn" aria-pressed="false">Pan</button>
              </div>
              <div id="speedControls" class="sim-speed" role="group" aria-label="Playback speed">
                <button id="speedSlowerBtn" type="button" class="sim-secondary sim-speed-btn" aria-label="Set playback to half speed">
                  <span aria-hidden="true" class="sim-speed-icon">&gt;&gt;</span>
                  <span class="sim-speed-text">0.5x</span>
                </button>
                <button id="speedFasterBtn" type="button" class="sim-secondary sim-speed-btn" aria-label="Double the playback speed">
                  <span aria-hidden="true" class="sim-speed-icon">&gt;&gt;</span>
                  <span class="sim-speed-text">2x</span>
                </button>
              </div>
            </div>
            <div id="speedStatus" class="sim-speed-status sim-hidden" role="status" aria-live="polite"></div>
            <div id="printStatus" class="sim-print-status sim-hidden" role="status" aria-live="polite"></div>
            <div id="asapStatus" class="sim-print-status sim-hidden" role="status" aria-live="polite"></div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app/hp-sim-3d.js"></script>
  </body>
</html>
