# HP4 config for Klipper with spool buildup, the mcu part running as a Linux process

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: winch
max_velocity: 300
max_accel: 3000
winch_mover_weight: 0.081
winch_spring_constant: 20000.0
winch_min_force: 10.0, 10.0, 10.0, 10.0
winch_max_force: 170.0, 170.0, 170.0, 170.0
winch_guy_wire_lengths: 501.871497, 501.871497, 501.871497, 344.413865
winch_buildup_factor: 0.6366197723675814
winch_mechanical_advantage: 2, 2, 2, 4
flex_compensation_algorithm: qp
ignore_gravity: false
ignore_pretension: false

[stepper_a]
step_pin: gpiochip1/gpio0
dir_pin: gpiochip1/gpio1
enable_pin: gpiochip1/gpio2
microsteps: 16
rotation_distance: 146.412355
m569_address: 40.0
anchor_x: 0.000000
anchor_y: -1752.336554
anchor_z: -280.000000

[stepper_b]
step_pin: gpiochip1/gpio3
dir_pin: gpiochip1/gpio4
enable_pin: gpiochip1/gpio5
microsteps: 16
rotation_distance: 146.412355
m569_address: 41.0
anchor_x: 1517.567971
anchor_y: 876.168277
anchor_z: -280.000000

[stepper_c]
step_pin: gpiochip1/gpio6
dir_pin: gpiochip1/gpio7
enable_pin: gpiochip1/gpio8
microsteps: 16
rotation_distance: 146.412355
m569_address: 42.0
anchor_x: -1517.567971
anchor_y: 876.168277
anchor_z: -280.000000

[stepper_d]
step_pin: gpiochip1/gpio9
dir_pin: gpiochip1/gpio10
enable_pin: gpiochip1/gpio11
microsteps: 16
rotation_distance: 73.206177
m569_address: 43.0
anchor_x: 0.000000
anchor_y: 0.000000
anchor_z: 1869.135117

[extruder]
step_pin: gpiochip1/gpio24
dir_pin: gpiochip1/gpio25
enable_pin: gpiochip1/gpio26
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
max_extrude_cross_section: 2.0
filament_diameter: 1.750
sensor_type: temperature_host
sensor_path: public/klipper/hp4/extruder.temp
heater_pin: gpiochip1/gpio27
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
min_extrude_temp: 0
max_temp: 275

[heater_bed]
sensor_type: temperature_host
sensor_path: public/klipper/hp4/bed.temp
heater_pin: gpiochip1/gpio17
control: watermark
min_temp: 0
max_temp: 130

[force_move]
enable_force_move: True

[hangprinter_m569]
