# Minimal cartesian Klipper config for the motion-layer probes.
# Only the pin chip number differs from the checked-in linux-MCU convention
# (the linux mcu dictionary knows gpiochip0..8; these pins are never driven in
# batch mode). Steppers are on 80 steps/mm so distances map to whole steps.
[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: gpiochip2/gpio0
dir_pin: gpiochip2/gpio1
enable_pin: gpiochip2/gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpiochip2/gpio12
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: gpiochip2/gpio3
dir_pin: gpiochip2/gpio4
enable_pin: gpiochip2/gpio5
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpiochip2/gpio13
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: gpiochip2/gpio6
dir_pin: gpiochip2/gpio7
enable_pin: gpiochip2/gpio8
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpiochip2/gpio14
position_endstop: 0
position_max: 200

[extruder]
step_pin: gpiochip1/gpio24
dir_pin: gpiochip1/gpio25
enable_pin: gpiochip1/gpio26
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
max_extrude_cross_section: 2.0
filament_diameter: 1.750
sensor_type: temperature_host
sensor_path: /tmp/klprobe_extruder.temp
heater_pin: gpiochip1/gpio27
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
min_extrude_temp: 0
max_temp: 275

[force_move]
enable_force_move: True
