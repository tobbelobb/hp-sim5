<!DOCTYPE html>
<html>
<head>
    <title>Slideprinter</title>
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iZ3JleSIvPjwvc3ZnPg==" />

    <!-- Prevent pinch / double‑tap zoom while keeping responsiveness -->
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <!-- Nice free Google font – optional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">

    <style>
/* =========  BASIC COLOUR THEME  ========= */
:root {
  --bg-1: #2d2d2d;        /* page background */
  --accent-1: #ff452a;    /* flipper + button gradient start */
  --accent-2: #ffb347;    /* flipper + button gradient end   */
  --text-main: #fafafa;
  --text-dim:  #c0c0c0;
  --radius: 4px;
}

/* =========  PAGE LAYOUT  ========= */
html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;                 /* use dynamic vh so iOS toolbars don't break it */
  width: 100dvw;
  overflow: hidden;               /* **kills the vertical / horizontal scroll**   */
  background: var(--bg-1);
  color: var(--text-main);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent; /* removes grey flash on iOS */
  touch-action: none;     /* **stops double‑tap zoom in most browsers**   */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

/* =========  CONTAINER  ========= */
#gameContainer {
  width: 100%;            /* fill full page width */
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;                /* expand to fill remaining vertical space */
}

/* =========  CONTROL BAR  ========= */
#controls {
  position: sticky;
  top: 0;
  width: 100%;
  text-align: center;
  margin-block: 0 8px;    /* remove top margin, keep bottom spacing */
  padding-block: 12px 0;  /* add vertical padding */
  background: var(--bg-1); /* ensure background covers underlying content */
  z-index: 1;             /* stay above canvas */
  font-size: 0.9rem;
  color: var(--text-dim);
}

#controls button {
  all: unset;                      /* wipe default button styles */
  cursor: pointer;
  display: inline-block;
  margin: 6px auto;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.95rem;
  color: #fff;
  background: var(--accent-1);
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
  transition: transform .12s ease, box-shadow .12s ease;
}
#controls button:hover,
#controls button:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(0,0,0,.55);
}
#controls button:active {
  transform: scale(.97);
}

/* =========  CANVAS  ========= */
canvas {
  width: 100%;
  /* removed fixed aspect ratio to fill available screen height */
  flex: 1;                         /* grow to fill vertical space */
  display: block;
  border-radius: var(--radius);
  touch-action: manipulation;      /* turn off browser panning/zoom so pointermove/up always fire */
}

/* =========  SMALL‑SCREEN TWEAKS  ========= */
#controls button {
  padding: 10px 16px;
  font-size: 0.85rem;
}
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="controls">
            <button id="pauseBtn" tabindex="-1">Pause</button>
            <button id="resetBtn" tabindex="-1">Reset</button>
            <button id="stepBtn">Step</button>
            <button id="dumpBtn" tabindex="-1">Dump State</button><br />
        </div>
        <canvas id="myCanvas"></canvas>
    </div>
<script type="module">
    import Vector2 from '../cable_joints/vector2.js';
    import { dumpWorldState } from '../cable_joints/debugUtils.js';
    import {
      World,
      PauseStateComponent,
      SimulationErrorStateComponent,
      PositionComponent,
      VelocityComponent,
      MassComponent,
      OrientationComponent,
      AngularVelocityComponent,
      CoefficientOfFrictionComponent,
      MomentOfInertiaComponent,
      RenderableComponent,
      RadiusComponent,
      BallTagComponent,
      RestitutionComponent,
      DistanceConstraintComponent,
      PrevFinalPosComponent,
    } from '../cable_joints/ecs.js';

    import {
      CableLinkComponent,
      CableJointComponent,
      CablePathComponent,
      CableAttachmentUpdateSystemJointWise,
      PBDCableConstraintSolverJointWise
    } from '../cable_joints/cable_joints_core.js';

    import {
      tangentFromPointToCircle
    } from '../cable_joints/geometry.js';

    import {
      GravitySystem,
      MovementSystem,
      AngularMovementSystem,
      PBDBallBallCollisions,
      PrevFinalPosSystem,
      XPBDDistanceConstraintSystem,
      PBDVelocityUpdateSystem,
    } from '../cable_joints/commonSystems.js';

    import {
      RenderSystem
    } from '../cable_joints/renderSystem.js';

    // --- System: Input --- (Simplified Click Handling)
    class InputSystem {
         runInPause = true; // Input should work even when paused to unpause/interact

         constructor(canvas) {
             this.canvas = canvas;
             this.clicks = [];
             this.releases = [];
             this.eventLog = [];     // ← record inputs per frame
             this.frame = 0;         // ← frame counter
             this.grabSpring = null; // { ptrE, jointE, pathE, ballE }
             // Viewport parameters (to be set from setupScene)
             this.scaleMultiplier = 1.0;
             this.viewOffsetX = 0.0;
             this.viewOffsetY = 0.0;
             this.canvas.setAttribute('tabindex', '0');
             this.canvas.style.outline = 'none';
             this.canvas.focus();
             // listen globally so ups/downs outside the canvas still fire
             document.addEventListener('pointerdown', this.handlePointerDown.bind(this));
             document.addEventListener('pointerup', this.handlePointerUp.bind(this));
             this.canvas.addEventListener('pointermove', this.handlePointerMove.bind(this));
         }

         // on Space -> emit minimal debug dump
         dumpDebugScenario() {
             // Custom stringification to serialize Vector2 instances
             const resStr = JSON.stringify(world.resources);
             const logEntries = this.eventLog.map(frame => {
                 const clicksStr = frame.clicks.map(p => `new Vector2(${p.x}, ${p.y})`).join(', ');
                 const releasesStr = frame.releases.map(p => `new Vector2(${p.x}, ${p.y})`).join(', ');
                 return `{ "frame": ${frame.frame}, "clicks": [${clicksStr}], "releases": [${releasesStr}] }`;
             }).join(', ');
             console.log('DEBUG_SCENARIO_DUMP', `{ "resources": ${resStr}, "inputLog": [${logEntries}] }`);
         }

         handlePointerDown(event) {
             event.preventDefault();
            // Map pointer to simulation coords (account for view scale and offset)
            const rect = this.canvas.getBoundingClientRect();
            const baseScale = this.canvas.height / world.getResource('simHeight');
            const scale = baseScale * this.scaleMultiplier;
            const pixelX = event.clientX - rect.left;
            const pixelY = event.clientY - rect.top;
            const simX = (pixelX - this.canvas.width / 2) / scale + this.viewOffsetX;
            const simY = (this.canvas.height / 2 - pixelY) / scale + this.viewOffsetY;

             const clickVec = new Vector2(simX, simY);

             // Calculate extra clickable radius based on physical size (adapted from flipper.html)
             const cmOnScreen = 0.5; // Desired clickable radius increase in physical cm
             const dpi = 96; // Approximate screen DPI
             const pixelsPerCm = dpi / 2.54;
             const extraPixels = cmOnScreen * pixelsPerCm;
             // Use the effective scale from slideprinter's input system
             const effectiveScale = (this.canvas.height / world.getResource('simHeight')) * this.scaleMultiplier;
             const extraClickableRadius = extraPixels / effectiveScale;

             let closestBall = null;
             let closestDistSq = Infinity;
             for (const b of world.query([BallTagComponent, PositionComponent, RadiusComponent])) {
               const pos = world.getComponent(b, PositionComponent).pos;
               const r = world.getComponent(b, RadiusComponent).radius + extraClickableRadius;
               const distSq = clickVec.clone().subtract(pos).lengthSq();
               if (distSq <= r * r && distSq < closestDistSq) {
                 closestBall = b;
                 closestDistSq = distSq;
               }
             }

             if (closestBall !== null) {
               // 1) create a pointer‐link entity at the mouse
               const ptrE = world.createEntity();
               world.addComponent(ptrE, new PositionComponent(simX, simY));
               world.addComponent(ptrE, new CableLinkComponent(simX, simY));

               // 2) create a joint between ball and pointer
               const ballPos = world.getComponent(closestBall, PositionComponent).pos.clone();
               const ptrPos  = new Vector2(simX, simY);
               const jointE = world.createEntity();
               world.addComponent(jointE,
                 new CableJointComponent(
                   closestBall,  // entityA
                   ptrE,         // entityB
                   0.1,          // restLength (small slack)
                   ballPos,      // attachmentA_world (ball center)
                   ptrPos        // attachmentB_world (pointer pos)
                 )
               );
               world.addComponent(jointE, new RenderableComponent('line', '#888888')); // Grab spring color

               // 3) wrap it in a CablePathComponent
               const pathE = world.createEntity();
               const pathComp = new CablePathComponent(
                 world,
                 [ jointE ],               // one joint
                 ['attachment', 'attachment'], // linkTypes for ball and pointer
                 [ true, true ],           // cw flags (arbitrary for simple link)
                 10.0                     // spring_constant (soft spring)
               );
               world.addComponent(pathE, pathComp);

               // 4) store for move/release
               this.grabSpring = { ptrE, jointE, pathE, ballE: closestBall };
               world.setResource('grabbedBall', closestBall);

               const pauseState = world.getResource('pauseState');
               pauseState.paused = false;
               pauseBtn.textContent = "Pause";
               return;
             }

             this.clicks.push(new Vector2(simX, simY)); // Log if no ball was grabbed
         }

         handlePointerUp(event) {
             event.preventDefault();
             this.canvas.releasePointerCapture(event.pointerId);
            // Map pointer to simulation coords (account for view scale and offset)
            const rect = this.canvas.getBoundingClientRect();
            const baseScale = this.canvas.height / world.getResource('simHeight');
            const scale = baseScale * this.scaleMultiplier;
            const pixelX = event.clientX - rect.left;
            const pixelY = event.clientY - rect.top;
            const simX = (pixelX - this.canvas.width / 2) / scale + this.viewOffsetX;
            const simY = (this.canvas.height / 2 - pixelY) / scale + this.viewOffsetY;

             if (this.grabSpring) {
               const { ptrE, jointE, pathE, ballE } = this.grabSpring;

               const posComp = world.getComponent(ballE, PositionComponent);
               const velComp = world.getComponent(ballE, VelocityComponent);
               const prevFinalPosComp = world.getComponent(ballE, PrevFinalPosComponent);
               const dt = world.getResource('dt');

               if (velComp && posComp && prevFinalPosComp && dt > 1e-9) {
                 // Set velocity based on displacement since last simulation step's final position
                 velComp.vel.set(posComp.pos.clone().subtract(prevFinalPosComp.pos).scale(1.0/dt));
               } else if (velComp) {
                 velComp.vel.set(new Vector2(0,0)); // Fallback: reset velocity
               }

               world.destroyEntity(pathE);
               world.destroyEntity(jointE);
               world.destroyEntity(ptrE);
               this.grabSpring = null;
               world.setResource('grabbedBall', null);
               return;
             }
             this.releases.push(new Vector2(simX, simY)); // Log if not ungrabbing
         }

         update(world, dt) {
             // Snapshot and clear inputs each frame for logging
             const clicksFrame = this.clicks.slice();
             if (clicksFrame.length > 0) this.clicks = []; // Clear after copying

             const releasesFrame = this.releases.slice();
             if (releasesFrame.length > 0) this.releases = []; // Clear after copying

             if (clicksFrame.length > 0 || releasesFrame.length > 0) {
                 this.eventLog.push({ frame: this.frame, clicks: clicksFrame, releases: releasesFrame });
             }
             this.frame++;
         }

         handlePointerMove(event) {
           event.preventDefault();
           if (this.grabSpring === null) return;

           // Map pointer to simulation coords (account for view scale and offset)
           const rect = this.canvas.getBoundingClientRect();
           const baseScale = this.canvas.height / world.getResource('simHeight');
           const scale = baseScale * this.scaleMultiplier;
           const pixelX = event.clientX - rect.left;
           const pixelY = event.clientY - rect.top;
           const simX = (pixelX - this.canvas.width / 2) / scale + this.viewOffsetX;
           const simY = (this.canvas.height / 2 - pixelY) / scale + this.viewOffsetY;

           // Update the position of the pointer entity in the grab spring
           const { ptrE } = this.grabSpring;
           const pos = world.getComponent(ptrE, PositionComponent).pos;
           pos.set(new Vector2(simX, simY));
         }
    }

    // --- Global Setup ---
    const canvas = document.getElementById("myCanvas");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const stepBtn = document.getElementById("stepBtn");

    let world = new World();

function createSpoolEntity(world, posVec, velVec, angVelVal, spoolRadius, spoolMass, spoolInertia, ballRestitution, renderColor = '#a0a0a0') {
    const spool = world.createEntity();
    world.addComponent(spool, new BallTagComponent());
    world.addComponent(spool, new PositionComponent(posVec.x, posVec.y));
    world.addComponent(spool, new VelocityComponent(velVec.x, velVec.y));
    world.addComponent(spool, new RadiusComponent(spoolRadius));
    world.addComponent(spool, new MassComponent(spoolMass));
    world.addComponent(spool, new RenderableComponent('circle', renderColor));
    world.addComponent(spool, new OrientationComponent()); // Default orientation
    world.addComponent(spool, new AngularVelocityComponent(angVelVal));
    world.addComponent(spool, new MomentOfInertiaComponent(spoolInertia));
    world.addComponent(spool, new RestitutionComponent(ballRestitution));
    const frictionCoefficient = 0.2; // Dyneema over steel is in the range ca 0.05 to 0.4.
    world.addComponent(spool, new CoefficientOfFrictionComponent(frictionCoefficient));
    world.addComponent(spool, new PrevFinalPosComponent(posVec.x, posVec.y)); // For grab velocity calculation

    return spool;
}

function createAnchorEntity(world, posVec, anchorRadius = 0.01, renderColor = '#aaaaaa') {
    const anchor = world.createEntity();
    world.addComponent(anchor, new BallTagComponent());
    world.addComponent(anchor, new PositionComponent(posVec.x, posVec.y));
    world.addComponent(anchor, new VelocityComponent(0.0, 0.0)); // Anchors are static
    world.addComponent(anchor, new RadiusComponent(anchorRadius));
    world.addComponent(anchor, new MassComponent(-1.0)); // Immovable
    world.addComponent(anchor, new RenderableComponent('circle', renderColor));
    return anchor;
}

function createCableAndJointEntities(world, anchorEntity, spoolEntity, spoolRadius, initialStoredLength, jointRenderColor, cableStiffness = 20000.0) {
    const anchorPos = world.getComponent(anchorEntity, PositionComponent).pos;
    const spoolPos = world.getComponent(spoolEntity, PositionComponent).pos;

    // Add CableLinkComponents if not already present
    if (!world.hasComponent(anchorEntity, CableLinkComponent)) {
        world.addComponent(anchorEntity, new CableLinkComponent(anchorPos.x, anchorPos.y));
    }
    if (!world.hasComponent(spoolEntity, CableLinkComponent)) {
        world.addComponent(spoolEntity, new CableLinkComponent(spoolPos.x, spoolPos.y));
    }

    // Create Joint
    const joint = world.createEntity();
    // Assuming clockwisePreference = true for the spool when calculating tangent
    const tang = tangentFromPointToCircle(anchorPos, spoolPos, spoolRadius, true);
    const initialDist = tang.a_attach.clone().subtract(tang.a_circle).length();
    world.addComponent(joint, new CableJointComponent(
        anchorEntity, spoolEntity, initialDist, tang.a_attach, tang.a_circle
    ));
    world.addComponent(joint, new RenderableComponent('line', jointRenderColor));

    // Create Cable
    const cable = world.createEntity();
    const cableComp = new CablePathComponent(
        world,
        [joint],
        ['attachment', 'hybrid'], // Types for anchor (attachment) and spool (hybrid)
        [true, true],             // Clockwise preferences for joint connections
        cableStiffness,
        [0.0, initialStoredLength] // storedLengths: 0 for anchor, initialStoredLength for spool
    );
    world.addComponent(cable, cableComp);

    return { jointEntity: joint, cableEntity: cable, cableComponent: cableComp };
}

function createDistanceConstraintEntity(world, entityA, entityB, compliance = 0.0) {
    const constraintEntity = world.createEntity();
    const restLength = world.getComponent(entityA, PositionComponent).pos.distanceTo(world.getComponent(entityB, PositionComponent).pos);
    world.addComponent(constraintEntity, new DistanceConstraintComponent(entityA, entityB, restLength, compliance));
    world.addComponent(constraintEntity, new RenderableComponent('line', 'purple')); // Example color
    return constraintEntity;
}

    function setupScene() {
        world.clear(); // Clear entities and components
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        // --- Calculate Simulation Dimensions & Scale ---
        const simHeight = 1.7; // Target simulation height remains fixed
        const cScale = canvas.height / simHeight; // Calculate scale based on actual height
        const simWidth = canvas.width / cScale; // Calculate sim width based on actual width and scale

        // --- Resources ---
        world.setResource('gravity', new Vector2(0.0, 0.0));
        world.setResource('dt', 1.0 / 200.0);
        world.setResource('simWidth', simWidth);
        world.setResource('simHeight', simHeight); // Store the reference simHeight
        world.setResource('pauseState', new PauseStateComponent(true));
        world.setResource('debugRenderPoints', {}); // Initialize debug points resource
        world.setResource('errorState', new SimulationErrorStateComponent(false)); // Initialize error state
        // reset any grab
        world.setResource('grabbedBall', null);

        // --- Entities and Components ---
        // Common properties for spools
        const spoolRadius = 0.03;
        const spoolMass = 0.005;
        const spoolInertia = 30 * 0.5 * spoolMass * spoolRadius * spoolRadius;
        const ballRestitution = 0.5;

        // Common properties for anchors
        const anchorRadius = 0.01; // Standard anchor radius from original code

        // Common properties for cables
        const turns = 5.0;
        const initialStoredLength = turns * spoolRadius * Math.PI * 2.0;
        const cableStiffness = 20000.0; // Standard cable stiffness from original code
        const spool_dist_from_center = 0.1;

        // Configurations for each spool-anchor-cable setup
        const configurations = [
            {
                spoolPos: new Vector2(0.00, -spool_dist_from_center),
                spoolVel: new Vector2(1.0, 0.0),
                spoolAngVel: 5.0,
                anchorPos: new Vector2(0.00, -spool_dist_from_center - 2.0),
                jointColor: 'orange'
            },
            {
                spoolPos: new Vector2(spool_dist_from_center * Math.cos(Math.PI * (1/6)), spool_dist_from_center * Math.sin(Math.PI * (1/6))),
                spoolVel: new Vector2(-1.0/Math.sqrt(2), 1.0/Math.sqrt(2)),
                spoolAngVel: 5.0, // Corresponds to new AngularVelocityComponent()
                anchorPos: new Vector2(2.05 * Math.cos(Math.PI * (1/6)), 2.05 * Math.sin(Math.PI * (1/6))),
                jointColor: 'orange'
            },
            {
                spoolPos: new Vector2(spool_dist_from_center * Math.cos(Math.PI * (5/6)), spool_dist_from_center * Math.sin(Math.PI * (5/6))),
                spoolVel: new Vector2(0.0, 0.0),
                spoolAngVel: 5.0, // Corresponds to new AngularVelocityComponent()
                anchorPos: new Vector2(2.05 * Math.cos(Math.PI * (5/6)), 2.05 * Math.sin(Math.PI * (5/6))),
                jointColor: 'orange'
            }
        ];

        const spoolEntities = [];
        for (const config of configurations) {
            const spoolEntity = createSpoolEntity(
                world,
                config.spoolPos,
                config.spoolVel,
                config.spoolAngVel,
                spoolRadius,
                spoolMass,
                spoolInertia,
                ballRestitution
            );
            spoolEntities.push(spoolEntity);

            const anchorEntity = createAnchorEntity(
                world,
                config.anchorPos,
                anchorRadius // Using the defined anchorRadius
            );

            //createCableAndJointEntities(
            //    world,
            //    anchorEntity,
            //    spoolEntity,
            //    spoolRadius,
            //    initialStoredLength,
            //    config.jointColor,
            //    cableStiffness // Using the defined cableStiffness
            //);
        }

        createDistanceConstraintEntity(world, spoolEntities[0], spoolEntities[1]);
        createDistanceConstraintEntity(world, spoolEntities[1], spoolEntities[2]);
        createDistanceConstraintEntity(world, spoolEntities[2], spoolEntities[0]);


        // --- Systems Registration (Order Matters!) ---
        if (world.systems.length === 0) { // Only register systems once
          // Initialize input system with view parameters matching RenderSystem
          const inputSys = new InputSystem(canvas);
          inputSys.scaleMultiplier = 0.5;
          inputSys.viewOffsetX = 0.0;
          inputSys.viewOffsetY = -0.5;
          world.registerSystem(new PrevFinalPosSystem()); // Update previous positions first
          world.registerSystem(inputSys);
          world.registerSystem(new MovementSystem());
          world.registerSystem(new AngularMovementSystem());
          world.registerSystem(new PBDBallBallCollisions());
          world.registerSystem(new XPBDDistanceConstraintSystem());
          world.registerSystem(new CableAttachmentUpdateSystemJointWise());
          world.registerSystem(new PBDCableConstraintSolverJointWise());
          // Update velocities after all position-based solvers
          world.registerSystem(new PBDVelocityUpdateSystem());
          world.registerSystem(new RenderSystem(canvas, cScale, simHeight, inputSys.scaleMultiplier, inputSys.viewOffsetX, inputSys.viewOffsetY, 1.0));
        }

        // Update button text based on initial pause state
         const pauseState = world.getResource('pauseState');
         pauseBtn.textContent = pauseState.paused ? "Start" : "Pause";
    }


    // --- Main Loop ---
    let lastTime = 0;           // in ms
    let accumulator = 0.0;      // in seconds
    let doStep = true; // Whether to do a single step when paused

    function loop(currentTime) {
      const dt = world.getResource('dt');
      const pauseState = world.getResource('pauseState');

      // first frame init
      if (lastTime === 0) lastTime = currentTime;

      let frameSec = (currentTime - lastTime) / 1000;
      if (frameSec >= dt) {
        lastTime = currentTime;
        const maxAccum = dt * 5;
        accumulator = Math.min(accumulator + frameSec, maxAccum);
        while (accumulator >= dt) {
          if (!pauseState.paused || doStep) {
            if (doStep) pauseState.paused = false;
            world.update(dt);
            if (doStep) {
              pauseState.paused = true;
              doStep = false;
            }
          }
          accumulator -= dt;
        }
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    // --- Event Listeners ---
    pauseBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const pauseState = world.getResource('pauseState');
        if (pauseState) {
            pauseState.paused = !pauseState.paused;
            pauseBtn.textContent = pauseState.paused ? "Resume" : "Pause";
        }
    });

    resetBtn.addEventListener('click', (e) => {
        e.preventDefault();
        setupScene(); // Re-initialize the world state
        // Ensure pause state resource is reset if needed
        const pauseState = world.getResource('pauseState');
        if (pauseState) pauseState.paused = true; // Start paused after reset
        pauseBtn.textContent = "Resume";
        doStep = true;
    });

    stepBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const pauseState = world.getResource('pauseState');
        if (pauseState && pauseState.paused) {
            doStep = true;
        }
    });
    const dumpBtn = document.getElementById('dumpBtn');
    dumpBtn.addEventListener('click', (e) => {
        e.preventDefault();
        console.log(dumpWorldState(world));
    });

    // --- Start ---
    setupScene();
    requestAnimationFrame(loop);

</script>

</body>
</html>
