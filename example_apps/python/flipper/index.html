<!DOCTYPE html>
<html>
<head>
    <title>Mindfulness Pinball (Python Backend)</title>
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48Y2lyY2xlIGN4PSIxNiIgY3k9IjE2IiByPSIxNiIgZmlsbD0iZ3JleSIvPjwvc3ZnPg==" />
    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
    <style>
:root {
  --bg-1: #2d2d2d; --accent-1: #ff452a; --accent-2: #ffb347;
  --text-main: #fafafa; --text-dim:  #c0c0c0; --radius: 4px;
}
html, body {
  margin: 0; padding: 0; height: 100dvh; overflow: hidden;
  background: var(--bg-1); color: var(--text-main);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent; touch-action: none;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
}
#gameContainer {
  width: min(90vw, 460px); max-height: 100%;
  display: flex; flex-direction: column; align-items: center;
}
#controls {
  width: 100%; text-align: center; margin-block: 12px 8px;
  font-size: 0.9rem; color: var(--text-dim);
}
#controls button {
  all: unset; cursor: pointer; display: inline-block; margin: 6px auto;
  border-radius: var(--radius); font-weight: 600; font-size: 0.95rem;
  color: #fff; background: var(--accent-1);
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
  transition: transform .12s ease, box-shadow .12s ease;
  padding: 10px 16px; font-size: 0.85rem;
}
#controls button:hover, #controls button:focus-visible {
  transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,.55);
}
#controls button:active { transform: scale(.97); }
canvas {
  width: 100%; aspect-ratio: 1 / 1.7;
  border-radius: var(--radius); touch-action: manipulation;
}
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="controls">
            <button id="pauseBtn" tabindex="-1">Start</button>
            <button id="resetBtn" tabindex="-1">Reset</button>
            <button id="stepBtn">Step</button>
            <button id="dumpBtn" tabindex="-1">Dump State</button><br />
            Score: <span id="score">0</span>
            <div id="stats" style="margin-top: 4px; font-size: 0.8rem;">
              dt: <span id="dt">N/A</span> |
              Speed: <span id="speed">N/A</span>
            </div>
        </div>
        <canvas id="myCanvas"></canvas>
    </div>
<script type="module">
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const stepBtn = document.getElementById("stepBtn");
    const scoreEl = document.getElementById("score");
    const dtEl = document.getElementById("dt");
    const speedEl = document.getElementById("speed");

    let simState = {};
    let isPaused = true;
    let cScale, simHeight = 1.7, simWidth = 1.0;
    const sag_multiplier = 0.3; // For catenary drawing

    let ws;
    let accumulator = 0.0; // in seconds
    let dt; // Will be loaded from USDA
    let maxAccumulator; // Derived from dt
    let speedSamples = [];
    const numSpeedSamples = 60;
    let frameCounter = 0;

    function setupCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        cScale = canvas.height / simHeight;
        simWidth = canvas.width / cScale;
    }

    function toCanvasCoords(simX, simY) {
        return { x: simX * cScale, y: canvas.height - (simY * cScale) };
    }

    function toSimCoords(canvasX, canvasY) {
        const rect = canvas.getBoundingClientRect();
        const simX = (canvasX - rect.left) / cScale;
        const simY = (canvas.height - (canvasY - rect.top)) / cScale;
        return { x: simX, y: simY };
    }

    function _drawCatenary(ctx, pA_sim, pB_sim, length, obstacles, sag_multiplier, toCanvasCoords, segments = 20) {
        const dx = pB_sim.x - pA_sim.x;
        const dy = pB_sim.y - pA_sim.y;
        const D = Math.hypot(dx, dy);
        if (D <= 1e-6) return;

        // parabolic sag magnitude
        const sag = Math.max(length - D, 0) * sag_multiplier;
        const sagDir = { x: 0, y: -1 }; // default sag direction, normalized

        ctx.beginPath();

        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            // 1) ideal point along straight+parabola
            const sagOff = sag * 4 * t * (1 - t);
            let pt = {
                x: pA_sim.x + dx * t + sagDir.x * sagOff,
                y: pA_sim.y + dy * t + sagDir.y * sagOff
            };

            // 2) obstacle-avoidance
            for (const obs of obstacles) {
                const obs_pos = { x: obs.x, y: obs.y };
                const v_x = pt.x - obs_pos.x;
                const v_y = pt.y - obs_pos.y;
                const d2 = v_x * v_x + v_y * v_y;
                const r2 = obs.radius * obs.radius;

                if (d2 < r2) {
                    const d = Math.sqrt(d2);
                    const push = obs.radius - d;
                    if (d > 1e-9) {
                        const pd_x = v_x / d;
                        const pd_y = v_y / d;
                        pt.x += pd_x * push;
                        pt.y += pd_y * push;
                    } else {
                        // exactly at center -> force straight-down
                        pt.x = obs_pos.x;
                        pt.y = obs_pos.y - obs.radius;
                    }
                }
            }

            // 3) draw
            const c_pt = toCanvasCoords(pt.x, pt.y);
            if (i === 0) {
                ctx.moveTo(c_pt.x, c_pt.y);
            } else {
                ctx.lineTo(c_pt.x, c_pt.y);
            }
        }

        ctx.stroke();
    }

    function render() {
        if (!simState.border || simState.border.length === 0) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Border
        ctx.strokeStyle = '#fafafa';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const startPoint = toCanvasCoords(simState.border[0][0], simState.border[0][1]);
        ctx.moveTo(startPoint.x, startPoint.y);
        for (let i = 1; i < simState.border.length; i++) {
            const p = toCanvasCoords(simState.border[i][0], simState.border[i][1]);
            ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.stroke();

        // Draw Balls
        simState.balls.forEach(ball => {
            ctx.fillStyle = '#a0a0a0';
            const p = toCanvasCoords(ball.x, ball.y);
            const r = ball.radius * cScale;

            ctx.save();
            ctx.translate(p.x, p.y);
            if (ball.angle !== undefined) {
                ctx.rotate(-ball.angle);
            }

            // Draw circle
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, 2 * Math.PI);
            ctx.fill();

            // Draw orientation line
            if (ball.angle !== undefined) {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -r);
                ctx.stroke();
            }
            ctx.restore();
        });

        // Draw Obstacles
        simState.obstacles.forEach(obs => {
            ctx.fillStyle = obs.color;
            const p = toCanvasCoords(obs.x, obs.y);
            const r = obs.radius * cScale;

            ctx.save();
            ctx.translate(p.x, p.y);
            if (obs.angle !== undefined) {
                ctx.rotate(-obs.angle); // negate for canvas' flipped y-axis
            }

            // Draw circle
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, 2 * Math.PI);
            ctx.fill();

            // Draw orientation line if angle exists
            if (obs.angle !== undefined) {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -r); // To top edge in local rotated coords
                ctx.stroke();
            }
            ctx.restore();
        });

        // Draw Flippers
        simState.flippers.forEach(flipper => {
            ctx.fillStyle = '#FF0000';
            const pivot = toCanvasCoords(flipper.x, flipper.y);
            const tipX = flipper.x + flipper.length * Math.cos(flipper.angle);
            const tipY = flipper.y + flipper.length * Math.sin(flipper.angle);
            const tip = toCanvasCoords(tipX, tipY);
            const radius = flipper.radius * cScale;

            ctx.beginPath();
            ctx.arc(pivot.x, pivot.y, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(tip.x, tip.y, radius, 0, 2 * Math.PI);
            ctx.fill();

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pivot.x, pivot.y);
            ctx.lineTo(tip.x, tip.y);
            ctx.lineWidth = radius * 2;
            ctx.strokeStyle = '#FF0000';
            ctx.stroke();
            ctx.restore();
        });

        // Draw Cables
        if (simState.cables) {
            const cableColorTaut = '#00FFFF'; // Cyan
            const cableColorSlack = 'orange';

            // The obstacles for catenary drawing are all balls and obstacles.
            // In the JS version, it's only entities with CableLinkComponent.
            // Here we don't have that info, so we use all of them.
            const obstaclesForCatenary = [
                //...simState.balls.map(b => ({ x: b.x, y: b.y, radius: b.radius })),
                //...simState.obstacles.map(o => ({ x: o.x, y: o.y, radius: o.radius }))
            ];
            // Also add flipper pivot and tip as obstacles
            simState.flippers.forEach(flipper => {
                obstaclesForCatenary.push({ x: flipper.x, y: flipper.y, radius: flipper.radius });
                const tipX = flipper.x + flipper.length * Math.cos(flipper.angle);
                const tipY = flipper.y + flipper.length * Math.sin(flipper.angle);
                obstaclesForCatenary.push({ x: tipX, y: tipY, radius: flipper.radius });
            });

            simState.cables.forEach(cable => {
                ctx.lineWidth = 2.0;

                // Draw joints (line segments)
                cable.joints.forEach(joint => {
                    const pA_sim = { x: joint.pA[0], y: joint.pA[1] };
                    const pB_sim = { x: joint.pB[0], y: joint.pB[1] };
                    const dist = Math.hypot(pB_sim.x - pA_sim.x, pB_sim.y - pA_sim.y);
                    const isSlack = joint.restLength > dist + 1e-6;

                    ctx.strokeStyle = isSlack ? cableColorSlack : cableColorTaut;

                    if (isSlack) {
                        _drawCatenary(ctx, pA_sim, pB_sim, joint.restLength, obstaclesForCatenary, sag_multiplier, toCanvasCoords);
                    } else {
                        const pA_canvas = toCanvasCoords(pA_sim.x, pA_sim.y);
                        const pB_canvas = toCanvasCoords(pB_sim.x, pB_sim.y);
                        ctx.beginPath();
                        ctx.moveTo(pA_canvas.x, pA_canvas.y);
                        ctx.lineTo(pB_canvas.x, pB_canvas.y);
                        ctx.stroke();
                    }
                });

                // Draw arcs (for rolling contacts)
                cable.arcs.forEach(arc => {
                    const center = toCanvasCoords(arc.center[0], arc.center[1]);
                    const radius = arc.radius * cScale;

                    const p1_sim = {x: arc.p1[0], y: arc.p1[1]};
                    const center_sim = {x: arc.center[0], y: arc.center[1]};
                    const p2_sim = {x: arc.p2[0], y: arc.p2[1]};

                    const a1 = Math.atan2(p1_sim.y - center_sim.y, p1_sim.x - center_sim.x);
                    const a2 = Math.atan2(p2_sim.y - center_sim.y, p2_sim.x - center_sim.x);

                    ctx.strokeStyle = arc.is_taut ? cableColorTaut : cableColorSlack;

                    ctx.beginPath();
                    ctx.arc(
                        center.x,
                        center.y,
                        radius,
                        -a1, // negate for canvas' flipped y-axis
                        -a2,
                        arc.anticlockwise
                    );
                    ctx.stroke();
                });

                // Draw Hybrid Links (markers and arcs)
                if (cable.links) {
                    cable.links.forEach(link => {
                        if (link.type === 'hybrid-attachment') {
                            if (link.attachmentPoint) {
                                ctx.fillStyle = '#FF0000'; // Red
                                const markerPos = toCanvasCoords(link.attachmentPoint[0], link.attachmentPoint[1]);
                                ctx.beginPath();
                                ctx.arc(markerPos.x, markerPos.y, 4, 0, 2 * Math.PI); // 4px radius marker
                                ctx.fill();
                            }
                        } else if (link.type === 'hybrid') {
                            if (link.center && link.radius > 1e-9) {
                                const center_sim = { x: link.center[0], y: link.center[1] };
                                const tangent_sim = { x: link.tangentPoint[0], y: link.tangentPoint[1] };

                                const toTangent = { x: tangent_sim.x - center_sim.x, y: tangent_sim.y - center_sim.y };
                                const tangentAngle = Math.atan2(toTangent.y, toTangent.x);
                                const deltaAngle = link.storedLength / link.radius;
                                const endAngle = link.cw ? tangentAngle - deltaAngle : tangentAngle + deltaAngle;

                                const center = toCanvasCoords(center_sim.x, center_sim.y);
                                const radius = link.radius * cScale;
                                const anticlockwise = !link.cw;

                                // Draw the arc for the wrapped cable
                                ctx.strokeStyle = link.is_taut ? cableColorTaut : cableColorSlack;
                                ctx.beginPath();
                                ctx.arc(
                                    center.x,
                                    center.y,
                                    radius,
                                    -tangentAngle, // start angle
                                    -endAngle,     // end angle
                                    anticlockwise
                                );
                                ctx.stroke();

                                // Draw the red dot at the end of the stored arc
                                const endOfArcPoint_sim = {
                                    x: center_sim.x + link.radius * Math.cos(endAngle),
                                    y: center_sim.y + link.radius * Math.sin(endAngle)
                                };
                                const markerPos = toCanvasCoords(endOfArcPoint_sim.x, endOfArcPoint_sim.y);
                                ctx.fillStyle = '#FF0000'; // Red
                                ctx.beginPath();
                                ctx.arc(markerPos.x, markerPos.y, 4, 0, 2 * Math.PI); // 4px radius marker
                                ctx.fill();
                            }
                        }
                    });
                }
            });
        }

        // Update Score
        scoreEl.textContent = simState.score;
    }

    function connect() {
        ws = new WebSocket('ws://localhost:8765');

        ws.onopen = () => {
            console.log('Connected to Python WebSocket server.');
            setupCanvas();
            isPaused = true; // Server starts paused, so sync UI
            pauseBtn.textContent = "Start";
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            stepBtn.disabled = false;
        };

        ws.onmessage = (event) => {
            simState = JSON.parse(event.data);
            if (simState.isPaused !== undefined) {
                isPaused = simState.isPaused;
                if (isPaused) {
                    // When paused, button should say "Resume" or "Start".
                    // If it already says "Start" (from a reset), leave it.
                    if (pauseBtn.textContent !== "Start") {
                        pauseBtn.textContent = "Resume";
                    }
                } else {
                    // When running, button must say "Pause".
                    pauseBtn.textContent = "Pause";
                }
            }
            render();
        };

        ws.onclose = () => {
            console.log('Disconnected from server. Reconnecting in 1s...');
            pauseBtn.textContent = "Reconnecting...";
            pauseBtn.disabled = true;
            resetBtn.disabled = true;
            stepBtn.disabled = true;
            setTimeout(connect, 1000);
        };

        ws.onerror = (error) => {
            console.error('WebSocket Error:', error);
            // The browser will fire the 'close' event automatically after an error.
        };
    }

    let lastTime = 0;
    function gameLoop(currentTime) {
        if (!lastTime) {
            lastTime = currentTime;
        }

        const speedScale = 1.0; // Match flipper.html
        const frameSec = speedScale * (currentTime - lastTime) / 1000.0;
        let stepsToTake = 0;

        if (frameSec >= dt) {
            lastTime = currentTime;

            if (!isPaused && ws && ws.readyState === WebSocket.OPEN) {
                accumulator = Math.min(accumulator + frameSec, maxAccumulator);

                stepsToTake = Math.floor(accumulator / dt);

                if (stepsToTake > 0) {
                    accumulator -= stepsToTake * dt;
                    ws.send(JSON.stringify({ action: 'step', steps: stepsToTake }));
                }
            }
        }

        // Speed calculation - only record if simulation time actually advanced
        if (frameSec > 1e-6 && stepsToTake > 0) {
            const simTimeDelta = stepsToTake * dt;
            const currentSpeed = simTimeDelta / frameSec;
            speedSamples.push(currentSpeed);
            if (speedSamples.length > numSpeedSamples) {
                speedSamples.shift();
            }
        }

        frameCounter++;
        if (frameCounter % 10 === 0 && speedEl && speedSamples.length > 0) {
            const avgSpeed = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
            speedEl.textContent = `${avgSpeed.toFixed(2)}x`;
        }

        requestAnimationFrame(gameLoop);
    }

    // --- Event Listeners ---
    pauseBtn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "Resume" : "Pause";
            ws.send(JSON.stringify({ action: 'pause', paused: isPaused }));
            if (!isPaused) {
                lastTime = performance.now();
            }
        }
    });

    resetBtn.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            isPaused = true;
            pauseBtn.textContent = "Start";
            ws.send(JSON.stringify({ action: 'reset' }));
            speedSamples = [];
            frameCounter = 0;
            if (speedEl) speedEl.textContent = 'N/A';
            accumulator = 0.0;
            lastTime = 0;
        }
    });

    stepBtn.addEventListener('click', () => {
        if (isPaused && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'single_step' }));
        }
    });

    function handlePointerDown(event) {
        event.preventDefault();
        if (ws && ws.readyState === WebSocket.OPEN) {
            const { x: simX, y: simY } = toSimCoords(event.clientX, event.clientY);

            // Client-side grab detection to unpause the game immediately.
            let isGrabClick = false;
            if (simState.balls) {
                for (const ball of simState.balls) {
                    const dx = simX - ball.x;
                    const dy = simY - ball.y;
                    const distSq = dx * dx + dy * dy;
                    if (distSq <= ball.radius * ball.radius) {
                        isGrabClick = true;
                        break;
                    }
                }
            }

            if (isGrabClick) {
                isPaused = false;
                pauseBtn.textContent = "Pause";
                ws.send(JSON.stringify({ action: 'pause', paused: isPaused }));
            }

            ws.send(JSON.stringify({ action: 'input', type: 'pointerdown', x: simX, y: simY }));
        }
    }

    function handlePointerMove(event) {
        event.preventDefault();
        if (ws && ws.readyState === WebSocket.OPEN) {
            const { x, y } = toSimCoords(event.clientX, event.clientY);
            ws.send(JSON.stringify({ action: 'input', type: 'pointermove', x, y }));
        }
    }

    function handlePointerUp(event) {
        event.preventDefault();
        if (ws && ws.readyState === WebSocket.OPEN) {
            const { x, y } = toSimCoords(event.clientX, event.clientY);
            ws.send(JSON.stringify({ action: 'input', type: 'pointerup', x, y }));
        }
    }

    function handleKey(event, type) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            const flippers = simState.flippers;
            if (!flippers || flippers.length < 2) return;

            const leftFlipper = flippers[0].x < flippers[1].x ? flippers[0] : flippers[1];
            const rightFlipper = flippers[0].x > flippers[1].x ? flippers[0] : flippers[1];

            let targetPos = null;
            if (event.key === 'ArrowLeft') targetPos = {x: leftFlipper.x, y: leftFlipper.y};
            if (event.key === 'ArrowRight') targetPos = {x: rightFlipper.x, y: rightFlipper.y};

            if (targetPos) {
                ws.send(JSON.stringify({ action: 'input', type: type, x: targetPos.x, y: targetPos.y }));
            }
        }
    }

    document.addEventListener('pointerdown', handlePointerDown);
    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', handlePointerUp);
    document.addEventListener('keydown', (e) => handleKey(e, 'click'));
    document.addEventListener('keyup', (e) => handleKey(e, 'release'));
    window.addEventListener('resize', setupCanvas);

    async function start() {
        const base = import.meta.env.BASE_URL || '/';
        const usdaPath = `${base}usd_scenes/flipper_scene.usda`;
        try {
            const response = await fetch(usdaPath);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const text = await response.text();
            const match = text.match(/timeCodesPerSecond\s*=\s*(\d+(\.\d+)?)/);
            let timeCodesPerSecond = 400; // Default fallback
            if (match && match[1]) {
                timeCodesPerSecond = parseFloat(match[1]);
            } else {
                console.warn(`Could not find 'timeCodesPerSecond' in ${usdaPath}. Falling back to ${timeCodesPerSecond}Hz.`);
            }

            dt = 1.0 / timeCodesPerSecond;
            maxAccumulator = dt * 500; // To prevent spiral of death

            if (dtEl) dtEl.textContent = `${(dt * 1000).toFixed(2)}ms`;

        } catch (error) {
            console.error('Failed to load or parse USDA file for dt:', error);
            // Fallback to a default value if fetching fails
            dt = 1.0 / 400.0;
            maxAccumulator = dt * 5;
            if (dtEl) dtEl.textContent = `ERR! Using ${(dt * 1000).toFixed(2)}ms`;
        }

        // Now that dt is configured, connect and start the loop
        connect(); // Initial connection
        requestAnimationFrame(gameLoop);
    }

    start();
</script>
</body>
</html>
