    <style>
:root {
  --bg-1: #2d2d2d;
  --accent-1: #ff452a;
  --accent-2: #ffb347;
  --text-main: #fafafa;
  --text-dim:  #c0c0c0;
  --radius: 4px;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;
  width: 100dvw;
  overflow: hidden;
  background: var(--bg-1);
  color: var(--text-main);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
#gameContainer {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
#controls {
  position: sticky;
  top: 0;
  width: 100%;
  text-align: center;
  margin-block: 0 8px;
  padding-block: 12px 0;
  background: var(--bg-1);
  z-index: 1;
  font-size: 0.9rem;
  color: var(--text-dim);
}
#controls button {
  all: unset;
  cursor: pointer;
  display: inline-block;
  margin: 6px auto;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.95rem;
  color: #fff;
  background: var(--accent-1);
  box-shadow: 0 3px 8px rgba(0,0,0,.45);
  transition: transform .12s ease, box-shadow .12s ease;
  padding: 10px 16px;
  font-size: 0.85rem;
}
#controls button:hover,
#controls button:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(0,0,0,.55);
}
#controls button:active {
  transform: scale(.97);
}
canvas {
  width: 100%;
  flex: 1;
  display: block;
  border-radius: var(--radius);
  touch-action: manipulation;
}
    </style>

            <button id="stepBtn">Step</button>
            <button id="dumpBtn" tabindex="-1">Dump State</button><br />
            <div id="stats" style="margin-top: 4px; font-size: 0.8rem;">

        </div>
        <canvas id="myCanvas"></canvas>
