<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mindfulness Pinball (cable engine test)</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  :root { --bg-1: #2d2d2d; --accent-1: #ff452a; --accent-2: #ffb347; --text-main: #fafafa; --text-dim: #c0c0c0; }
  html, body { margin: 0; padding: 0; height: 100dvh; overflow: hidden; background: var(--bg-1); color: var(--text-main);
    font-family: ui-sans-serif, system-ui, sans-serif; touch-action: none; display: flex; flex-direction: column; align-items: center; }
  #controls { width: min(96vw, 560px); text-align: center; margin-block: 8px 4px; font-size: 0.85rem; color: var(--text-dim); }
  #buttonRow { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
  button { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 4px; color: #fff; font-size: 0.85rem;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }
  summary { cursor: pointer; font-size: 0.72rem; margin-top: 4px; }
  #flags { display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: center; margin-top: 6px; font-size: 0.72rem; }
  #flags label { white-space: nowrap; }
  #stats { margin-top: 4px; font-size: 0.72rem; white-space: pre; }
  canvas { flex: 1; min-height: 0; aspect-ratio: 1 / 1.7; max-width: 96vw; outline: none; }
</style>
</head>
<body>
<div id="controls">
  <div id="buttonRow">
    <button id="pauseBtn" tabindex="-1">Start</button>
    <button id="resetBtn" tabindex="-1">Reset</button>
    <button id="stepBtn" tabindex="-1">Step</button>
    <button id="dumpBtn" tabindex="-1">Dump State</button>
    <span>Score: <span id="score">0</span></span>
  </div>
  <details id="flagBox"><summary>cable / collision flags</summary><div id="flags"></div></details>
  <div id="stats"></div>
</div>
<canvas id="canvas"></canvas>

<script type="module">
// Temporary 2D flipper that exercises the 3D cable joints library.
//
// The Rust cable solver (WasmPhysicsEngine) owns gravity, free-body motion, cable
// attachments, layered wraps, joint merging/splitting (a cable wraps whatever
// it touches), cable friction and the cable constraints. Everything the old
// 2D flipper added on top lives in this file: layered collision envelopes,
// pinch-shared contacts, PBD contact manifold, static friction, bumper pushes,
// spin/friction velocity contacts, flippers, grab spring (a real cable) and rendering.
import Vector3 from '../../../src/js/cable_joints_3d/vector3.js';
import {
  World, PositionComponent, PrevFinalPosComponent, VelocityComponent, RadiusComponent, MassComponent,
  GravityAffectedComponent, OrientationComponent, PrevFinalOrientationComponent, AngularVelocityComponent,
  MomentOfInertiaComponent, RestitutionComponent, CoefficientOfFrictionComponent, layeringEnabled,
} from '../../../src/js/cable_joints_3d/ecs.js';
import { CableLinkComponent, CableJointComponent, CablePathComponent } from '../../../src/js/cable_joints_3d/cable_joints_core.js';
import { compileCableSolverWasm } from '../../../src/js/cable_joints_3d/wasm_cable_solver.js';
import { WasmPhysicsEngine } from '../../../src/js/cable_joints_3d/wasm_physics_engine.js';
import { OpenText, getAttribute, getRelationship, getChild, getChildren, materialProperties } from '../../../src/js/usd/stage.js';
import { bakeCableSceneUsdaSource } from '../../../src/js/usd/cable_scene_baker.js';

const PLANE_NORMAL = new Vector3(0, 0, 1);
const SIM_W = 1.0, SIM_H = 1.7;
const BASE = import.meta.env.BASE_URL;
const MAX_STEPS_PER_FRAME = 500;
const KNOT_SPAN = Math.PI / 30.0;
const LAYER_RADIUS_RAMP_ANGLE = (2.0 * Math.PI) / 5.0;
const GRAB_REST_LENGTH = 0.1;
const GRAB_SPRING_CONSTANT = 10.0;

const FLAG_DEFS = [
  { key: 'enableLayering', label: 'enableLayering', value: true },
  { key: 'layeringCollisionOverlayRadius', label: 'collision/overlayRadius', value: true },
  { key: 'layeringCollisionOverlayRamp', label: 'collision/overlayRamp', value: true },
  { key: 'layeringCollisionCircleSectors', label: 'collision/circleSectors', value: true },
  { key: 'layeringCollisionSectorSolvers', label: 'collision/sectorSolvers', value: true },
  { key: 'layeringCollisionPinchShare', label: 'collision/pinchShare', value: true },
  { key: 'layeringVelocityContactOffset', label: 'contact/velocityOffset', value: true },
  { key: 'layeringObstacleRawHitFilter', label: 'obstacle/rawHitFilter', value: true },
  { key: 'layeringAttachmentUpdatePoints', label: 'cable/updateAttachment', value: true },
  { key: 'layeringMergeJoints', label: 'cable/mergeJoints', value: true },
  { key: 'layeringSplitJoints', label: 'cable/splitJoints', value: true },
  { key: 'layeringHybridLinkStates', label: 'cable/hybridLinkStates', value: true },
  { key: 'layeringClampJointRestLength', label: 'cable/clampRestLength', value: true },
  { key: 'layeringRenderWraps', label: 'render/layeredWraps', value: true },
  { key: 'layeringRenderCollisionOverlays', label: 'render/collisionOverlays', value: false },
  { key: 'renderBumperHitFx', label: 'render/bumperHitFx', value: true },
  { key: 'scoreBounceSoundEnabled', label: 'audio/scoreBounce', value: true },
];
const flags = Object.fromEntries(FLAG_DEFS.map(d => [d.key, d.value]));

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const scoreEl = document.getElementById('score');
const pauseBtn = document.getElementById('pauseBtn');

let backend, sceneText, world, game, dt;
let paused = true, doStep = false, stepWhileKeyHeld = false, accumulator = 0, lastTime = 0;
let speedSamples = [], frameCounter = 0, speedText = 'N/A';

// ---------------------------------------------------------------- planar helpers
const angleOf = q => 2 * Math.atan2(q.z, q.w);
function rotateQuatZ(q, delta) {
  const h = delta / 2, c = Math.cos(h), s = Math.sin(h);
  const z = q.z * c + q.w * s, w = q.w * c - q.z * s;
  q.z = z; q.w = w;
}
const finiteOr = (v, f) => Number.isFinite(v) ? v : f;
const nonNeg = (v, f) => { const x = finiteOr(v, f); return x > 0 ? x : 0; };
const clamp01 = (v, f) => { const x = finiteOr(v, f); return x <= 0 ? 0 : x >= 1 ? 1 : x; };
function normalizeAngle(a) {
  if (!Number.isFinite(a)) return 0;
  while (a <= -Math.PI) a += 2 * Math.PI;
  while (a > Math.PI) a -= 2 * Math.PI;
  return a;
}
function ccwDiff(from, to) {
  let d = normalizeAngle(to - from);
  if (d < 0) d += 2 * Math.PI;
  return d;
}
function isAngleInSector(angle, start, end, cw) {
  const a = normalizeAngle(angle), s = normalizeAngle(start), e = normalizeAngle(end);
  if (cw) return isAngleInSector(-a, -s, -e, false);
  return ccwDiff(s, a) <= ccwDiff(s, e) + 1e-9;
}
function closestOnSegment(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y;
  const t = (p.x - a.x) * abx + (p.y - a.y) * aby;
  if (t <= 0) return { x: a.x, y: a.y };
  const denom = abx * abx + aby * aby;
  if (t >= denom) return { x: b.x, y: b.y };
  return { x: a.x + abx * (t / denom), y: a.y + aby * (t / denom) };
}
const rightOfLine = (x, p0, p1) => (p1.x - p0.x) * (x.y - p0.y) - (p1.y - p0.y) * (x.x - p0.x) < 0;
const crossZ = (r, n) => r.x * n.y - r.y * n.x;

// ---------------------------------------------------------------- scene
function buildScene() {
  const stage = OpenText(bakeCableSceneUsdaSource(sceneText, {}).source);
  const w = new World();
  const physics = stage.GetPrimAtPath('/World/PhysicsScene');
  const gd = getAttribute(physics, 'physics:gravityDirection');
  const gm = getAttribute(physics, 'physics:gravityMagnitude');
  w.setResource('gravity', new Vector3(gd[0] * gm, gd[1] * gm, gd[2] * gm));
  dt = 1.0 / stage.ast.descriptor.assignments.find(s => s.type === 'assignment' && s.identifier === 'timeCodesPerSecond').value;
  w.setResource('dt', dt);
  for (const def of FLAG_DEFS) w.setResource(def.key, flags[def.key]);

  const g = {
    score: 0, border: null, bodies: [], bodyById: new Map(), balls: [], obstacles: [], flippers: [], tips: [],
    grab: null, grabbedBall: null, activePairs: new Set(), scoredBalls: new Set(), frame: 0, inputLog: [],
    contacts: { border: [], obstacle: [], flipper: [], ballBall: [] },
    fx: { bursts: [], wobble: new Map(), pairs: new Set() },
  };
  const root = stage.GetPrimAtPath('/World/FlipperScene');
  const entityByName = {};

  const borderPrim = getChild(root, 'Border');
  const { color: borderColor, friction: borderFriction, restitution: borderRestitution } = materialProperties(stage, borderPrim);
  g.border = {
    points: getAttribute(borderPrim, 'points').slice(0, 8).map(p => ({ x: p[0], y: p[1] })),
    color: borderColor || '#000000', friction: borderFriction, restitution: borderRestitution,
  };

  function record(id, kind, color) {
    const get = C => w.getComponent(id, C);
    const inertia = get(MomentOfInertiaComponent);
    const body = {
      id, kind, color,
      pos: get(PositionComponent).pos,
      prevPos: get(PrevFinalPosComponent)?.pos ?? null,
      vel: get(VelocityComponent)?.vel ?? null,
      quat: get(OrientationComponent)?.quaternion ?? null,
      prevQuat: get(PrevFinalOrientationComponent)?.quaternion ?? null,
      omega: get(AngularVelocityComponent)?.omega ?? null,
      radiusC: get(RadiusComponent) ?? null,
      massC: get(MassComponent) ?? null,
      invInertiaTensor: inertia?.invInertiaTensor ?? null,
      restitutionC: get(RestitutionComponent) ?? null,
      frictionC: get(CoefficientOfFrictionComponent) ?? null,
      linkC: get(CableLinkComponent) ?? null,
      overlay: null, sectors: [],
    };
    g.bodies.push(body);
    g.bodyById.set(id, body);
    return body;
  }

  for (const prim of getChildren(root)) {
    const tags = getAttribute(prim, 'ecs:tags') || [];
    const t = getAttribute(prim, 'xformOp:translate');
    if (!tags.length || !t) continue;
    const { color, friction, restitution } = materialProperties(stage, prim);
    const linkable = getAttribute(prim, 'cable:linkable');

    if (tags.includes('Ball')) {
      const id = w.createEntity();
      w.addComponent(id, new PositionComponent(t[0], t[1], t[2]));
      w.addComponent(id, new VelocityComponent(0, 0, 0));
      w.addComponent(id, new RadiusComponent(getAttribute(prim, 'radius')));
      w.addComponent(id, new MassComponent(getAttribute(prim, 'physics:mass')));
      w.addComponent(id, new GravityAffectedComponent());
      w.addComponent(id, new OrientationComponent(0, 0, 0, 1));
      w.addComponent(id, new AngularVelocityComponent(0, 0, 0));
      w.addComponent(id, new MomentOfInertiaComponent(getAttribute(prim, 'physics:inertiaTensor')[2][2]));
      w.addComponent(id, new PrevFinalOrientationComponent(0, 0, 0, 1));
      w.addComponent(id, new PrevFinalPosComponent(t[0], t[1], t[2]));
      if (restitution !== null) w.addComponent(id, new RestitutionComponent(restitution));
      if (friction !== null) w.addComponent(id, new CoefficientOfFrictionComponent(friction));
      if (linkable) w.addComponent(id, new CableLinkComponent(t[0], t[1], t[2], null, PLANE_NORMAL));
      entityByName[prim.name] = id;
      g.balls.push(record(id, 'ball', color || '#a0a0a0'));
    } else if (tags.includes('Obstacle')) {
      const id = w.createEntity();
      const angVel = getAttribute(prim, 'physics:angularVelocity');
      const spin = angVel ? angVel[2] * Math.PI / 180.0 : 0.0;
      w.addComponent(id, new PositionComponent(t[0], t[1], t[2]));
      w.addComponent(id, new MassComponent(-1.0));
      w.addComponent(id, new RadiusComponent(getAttribute(prim, 'radius')));
      if (friction !== null) w.addComponent(id, new CoefficientOfFrictionComponent(friction));
      if (spin !== 0.0) {
        w.addComponent(id, new OrientationComponent(0, 0, 0, 1));
        w.addComponent(id, new AngularVelocityComponent(0, 0, spin));
        w.addComponent(id, new MomentOfInertiaComponent(getAttribute(prim, 'physics:inertiaTensor')[2][2]));
        w.addComponent(id, new PrevFinalOrientationComponent(0, 0, 0, 1));
      }
      if (linkable) w.addComponent(id, new CableLinkComponent(t[0], t[1], t[2], null, PLANE_NORMAL));
      entityByName[prim.name] = id;
      const body = record(id, 'obstacle', color || '#ffffff');
      body.pushVel = getAttribute(prim, 'obstacle:pushVel') || 0.0;
      g.obstacles.push(body);
    } else if (tags.includes('Flipper')) {
      const geom = getChild(prim, 'Geom');
      const radius = geom ? getAttribute(geom, 'radius') : 0.0;
      const maxRotation = getAttribute(prim, 'flipper:maxRotation');
      const id = w.createEntity();
      w.addComponent(id, new PositionComponent(t[0], t[1], t[2]));
      w.addComponent(id, new RadiusComponent(radius));
      if (restitution !== null) w.addComponent(id, new RestitutionComponent(restitution));
      if (linkable) w.addComponent(id, new CableLinkComponent(t[0], t[1], t[2], null, PLANE_NORMAL));
      entityByName[prim.name] = id;
      const flipper = record(id, 'flipper', color || '#ff0000');
      Object.assign(flipper, {
        length: getAttribute(prim, 'flipper:length'), restAngle: getAttribute(prim, 'flipper:restAngle'),
        maxRotation: Math.abs(maxRotation), sign: Math.sign(maxRotation), angularVelocity: getAttribute(prim, 'flipper:angularVelocity'),
        rotation: 0.0, currentAngularVelocity: 0.0, pressed: false, tip: null,
      });
      g.flippers.push(flipper);
      const tipPrim = getChild(prim, 'Tip');
      if (tipPrim) {
        const tipId = w.createEntity();
        w.addComponent(tipId, new PositionComponent(t[0], t[1], t[2]));
        w.addComponent(tipId, new RadiusComponent(radius));
        if (friction !== null) w.addComponent(tipId, new CoefficientOfFrictionComponent(friction));
        if (getAttribute(tipPrim, 'cable:linkable')) w.addComponent(tipId, new CableLinkComponent(t[0], t[1], t[2], null, PLANE_NORMAL));
        const tip = record(tipId, 'tip', color || '#ff0000');
        tip.flipper = flipper;
        flipper.tip = tip;
        g.tips.push(tip);
      }
    }
  }

  const pathPrim = getChild(root, 'CablePath');
  const jointEntities = [];
  for (const jointPath of getRelationship(pathPrim, 'cablePath:joints')) {
    const jp = stage.GetPrimAtPath(jointPath);
    const a = entityByName[getRelationship(jp, 'physics:body0')[0].split('/').pop()];
    const b = entityByName[getRelationship(jp, 'physics:body1')[0].split('/').pop()];
    const la = getAttribute(jp, 'localPos0'), lb = getAttribute(jp, 'localPos1');
    const id = w.createEntity();
    w.addComponent(id, CableJointComponent.fromLocal(w, a, b, getAttribute(jp, 'restLength'),
      new Vector3(la[0], la[1], la[2]), new Vector3(lb[0], lb[1], lb[2])));
    jointEntities.push(id);
  }
  g.pathId = w.createEntity();
  w.addComponent(g.pathId, new CablePathComponent(w, jointEntities, [...getAttribute(pathPrim, 'cablePath:linkTypes')],
    [...getAttribute(pathPrim, 'cablePath:clockwise')], getAttribute(pathPrim, 'cablePath:stiffnessPerUnitLength'),
    [...getAttribute(pathPrim, 'cablePath:stored')], getAttribute(pathPrim, 'cablePath:halfWidth'),
    getAttribute(pathPrim, 'cablePath:dampingPerUnitLength')));
  return { world: w, game: g };
}

// ---------------------------------------------------------------- body accessors
const rawRadius = b => nonNeg(b.radiusC?.radius, 0);
const invMass = b => (b.massC && Number.isFinite(b.massC.mass) && b.massC.mass > 0) ? 1 / b.massC.mass : 0;
const invInertia = b => b.invInertiaTensor ? nonNeg(b.invInertiaTensor[2][2], 0) : 0;
const frictionMu = b => nonNeg(b.frictionC?.mu, 0);
const bodyOf = id => game.bodyById.get(id) ?? null;
const omegaZ = b => b.omega ? finiteOr(b.omega.z, 0) : 0;

// Applies a position/orientation correction. The solver already derived velocities from
// the step, so corrections made afterwards also add their implied velocity (delta / dt),
// exactly as the old pipeline did by correcting positions before its velocity update.
function applyCorrection(b, dx, dy, dTheta) {
  if (dx !== 0 || dy !== 0) {
    b.pos.x += dx; b.pos.y += dy;
    if (b.vel) { b.vel.x += dx / dt; b.vel.y += dy / dt; }
  }
  if (dTheta !== 0 && b.quat) {
    rotateQuatZ(b.quat, dTheta);
    if (b.omega) b.omega.z += dTheta / dt;
  }
}

// ---------------------------------------------------------------- layered collision envelopes
function pathLinkEntity(path, i) {
  if (!path.jointEntities.length) return null;
  if (i === 0) return world.getComponent(path.jointEntities[0], CableJointComponent)?.entityA ?? null;
  if (i === path.linkTypes.length - 1) return world.getComponent(path.jointEntities.at(-1), CableJointComponent)?.entityB ?? null;
  return world.getComponent(path.jointEntities[i - 1], CableJointComponent)?.entityB ?? null;
}
function pathLinkStartAttachment(path, i) {
  if (!path.jointEntities.length) return null;
  if (i === 0) return world.getComponent(path.jointEntities[0], CableJointComponent)?.attachmentPointA_world ?? null;
  if (i === path.linkTypes.length - 1) return world.getComponent(path.jointEntities.at(-1), CableJointComponent)?.attachmentPointB_world ?? null;
  return world.getComponent(path.jointEntities[i - 1], CableJointComponent)?.attachmentPointB_world ?? null;
}
function decomposeStoredWrap(storedLength, firstLayerRadius, layerStep) {
  const stored = Math.max(0, storedLength ?? 0);
  if (!(firstLayerRadius > 1e-9) || !(layerStep > 1e-9)) return null;
  if (!(stored > 1e-9)) return { fullLayers: 0, partialLength: 0, partialRadius: firstLayerRadius };
  let remaining = stored, fullLayers = 0;
  while (fullLayers < 2048) {
    const layerRadius = firstLayerRadius + fullLayers * layerStep;
    const circumference = 2 * Math.PI * layerRadius;
    if (remaining + 1e-9 >= circumference) { remaining = Math.max(0, remaining - circumference); fullLayers++; continue; }
    return { fullLayers, partialLength: remaining, partialRadius: layerRadius };
  }
  return { fullLayers, partialLength: 0, partialRadius: firstLayerRadius + fullLayers * layerStep };
}
function closingOverlayBlend(span) {
  const remaining = Math.max(0, 2 * Math.PI - (Number.isFinite(span) ? Math.max(0, span) : 0));
  return remaining >= LAYER_RADIUS_RAMP_ANGLE ? 0 : 1 - remaining / LAYER_RADIUS_RAMP_ANGLE;
}
function smoothedSectorRadius(raw, decomposition, halfWidth, span) {
  if (!(halfWidth > 1e-9)) return 0;
  const fullLayers = Math.max(0, decomposition?.fullLayers ?? 0), width = 2 * halfWidth;
  const start = raw + width * fullLayers, target = raw + width * (fullLayers + 1);
  const alpha = Math.max(0, Math.min(1, (Number.isFinite(span) ? Math.max(0, span) : 0) / LAYER_RADIUS_RAMP_ANGLE));
  return start + (target - start) * alpha;
}

function updateOverlaysAndSectors() {
  for (const b of game.bodies) { b.overlay = null; b.sectors = []; }
  if (!layeringEnabled(world)) return;
  const overlayEnabled = flags.layeringCollisionOverlayRadius !== false;
  const rampEnabled = flags.layeringCollisionOverlayRamp !== false;
  const sectorEnabled = flags.layeringCollisionCircleSectors !== false;
  const overlayByBody = new Map(), sectorsByBody = new Map();

  for (const pathId of world.query([CablePathComponent])) {
    const path = world.getComponent(pathId, CablePathComponent);
    const halfWidth = Number.isFinite(path.cableHalfWidth) ? Math.max(0, path.cableHalfWidth) : 0;
    if (!(halfWidth > 1e-9)) continue;
    const layerStep = 2 * halfWidth;
    for (let li = 0; li < path.linkTypes.length; li++) {
      const type = path.linkTypes[li];
      if (!(type === 'rolling' || type === 'hybrid' || type === 'hybrid-attachment')) continue;
      const stored = Math.max(0, path.stored[li] ?? 0);
      const body = bodyOf(pathLinkEntity(path, li));
      if ((stored <= 1e-9 && type !== 'hybrid-attachment') || !body) continue;
      const center = body.pos, raw = rawRadius(body);
      if (!(raw > 1e-9)) continue;
      const dec = decomposeStoredWrap(stored, raw + halfWidth, layerStep);
      if (!dec || (dec.fullLayers === 0 && dec.partialLength < 1e-9 && type !== 'hybrid-attachment')) continue;

      const baseOverlay = raw + layerStep * dec.fullLayers;
      let envelope = baseOverlay;
      if (rampEnabled && dec.partialLength > 1e-9 && dec.partialRadius > 1e-9) {
        const blend = closingOverlayBlend(dec.partialLength / dec.partialRadius);
        if (blend > 1e-9) envelope = baseOverlay + layerStep * blend;
      }
      if (overlayEnabled && envelope > raw + 1e-9) {
        const prev = overlayByBody.get(body);
        if (!prev || envelope > prev.radius + 1e-9) overlayByBody.set(body, { radius: envelope, mu: frictionMu(body) });
      }
      if (sectorEnabled) {
        const start = pathLinkStartAttachment(path, li);
        if (!start) continue;
        const rx = start.x - center.x, ry = start.y - center.y;
        if (rx * rx + ry * ry <= 1e-12) continue;
        const cw = Boolean(path.cw[li]);
        const startAngle = type === 'hybrid'
          ? Math.atan2(ry, rx) + (cw ? 1 : -1) * KNOT_SPAN * (raw / dec.partialRadius) : Math.atan2(ry, rx);
        const rawSpan = dec.partialLength / dec.partialRadius;
        const firstLayerAttachment = dec.fullLayers === 0 && type === 'hybrid-attachment';
        const span = firstLayerAttachment ? Math.max(rawSpan, KNOT_SPAN) : rawSpan;
        const radius = firstLayerAttachment ? raw + 2 * halfWidth : smoothedSectorRadius(raw, dec, halfWidth, span);
        if (!(radius > raw + 1e-9)) continue;
        const list = sectorsByBody.get(body) ?? [];
        list.push({ radius, startAngle, endAngle: cw ? startAngle - span : startAngle + span, cw, mu: frictionMu(body) });
        sectorsByBody.set(body, list);
      }
    }
  }
  for (const [body, overlay] of overlayByBody) body.overlay = overlay;
  for (const [body, list] of sectorsByBody) body.sectors = list.filter(s => Number.isFinite(s.radius) && s.radius > 1e-9);
}

function baseCollisionRadius(b) {
  const r = rawRadius(b);
  return b.overlay && Number.isFinite(b.overlay.radius) ? Math.max(r, b.overlay.radius) : r;
}
function baseCollisionSupport(b) {
  const raw = rawRadius(b), baseMu = frictionMu(b);
  if (b.overlay && Number.isFinite(b.overlay.radius) && b.overlay.radius > raw + 1e-9) {
    return { radius: b.overlay.radius, mu: Number.isFinite(b.overlay.mu) ? Math.max(0, b.overlay.mu) : baseMu };
  }
  return { radius: raw, mu: baseMu };
}
function maxCollisionRadius(b) {
  let r = baseCollisionRadius(b);
  for (const s of b.sectors) if (Number.isFinite(s.radius)) r = Math.max(r, s.radius);
  return r;
}
function normalizedDirection(v) {
  const l = Math.hypot(v.x, v.y);
  return l <= 1e-6 ? { x: 1, y: 0 } : { x: v.x / l, y: v.y / l };
}
function compositeSupportToward(b, toward) {
  const dir = normalizedDirection(toward), base = baseCollisionSupport(b), baseRadius = base.radius;
  let projection = baseRadius, offset = { x: dir.x * baseRadius, y: dir.y * baseRadius }, friction = base.mu;
  const angle = Math.atan2(dir.y, dir.x);
  for (const s of b.sectors) {

function drawBumperFx() {

    }
  }

  const drawEndpointStoredWrap = (path, li, center, bodyRadius, attachment, color) => {
    if (!(bodyRadius > 1e-9)) return;
    const halfWidth = layering ? (path.cableHalfWidth ?? 0) : 0;
    ctx.lineWidth = physicalCableWidthPx(path.cableHalfWidth);
    ctx.strokeStyle = color;
    const startAngle = Math.atan2(attachment.y - center.y, attachment.x - center.x), cw = Boolean(path.cw[li]);
    let remaining = Math.max(0, path.stored[li] ?? 0);
    if (!(remaining > 1e-9)) return;
    const full = 2 * halfWidth, base = bodyRadius + halfWidth;
    for (let layer = 0; layer < 128 && remaining > 1e-9; layer++) {
      const lr = layering ? base + full * layer : bodyRadius;
      const circ = 2 * Math.PI * lr, arc = Math.min(remaining, circ);
      ctx.beginPath();
      if (arc >= circ - 1e-6) ctx.arc(cX(center.x), cY(center.y), lr * S, 0, 2 * Math.PI);
      else {
        const delta = Math.min(arc / lr, 2 * Math.PI - 0.0001);
        ctx.arc(cX(center.x), cY(center.y), lr * S, -startAngle, -(cw ? startAngle - delta : startAngle + delta), !cw);
      }
      ctx.stroke();
      remaining -= arc;
      if (!layering || !(full > 1e-12)) break;
    }
  };

  for (const pathId of pathIds) {
    const path = world.getComponent(pathId, CablePathComponent);
    if (path.jointEntities.length < 1) continue;
    const joints = path.jointEntities, halfWidth = layering ? (path.cableHalfWidth ?? 0) : 0;
    const grabPath = game.grab && game.grab.path === pathId, baseColor = grabPath ? '#888888' : '#ffff00';
    for (let i = 1; i < path.linkTypes.length - 1; i++) {
      if (path.linkTypes[i] !== 'rolling' && path.linkTypes[i] !== 'hybrid') continue;
      const jPrev = world.getComponent(joints[i - 1], CableJointComponent), jNext = world.getComponent(joints[i], CableJointComponent);
      const roller = world.getComponent(jPrev.entityB, PositionComponent)?.pos, radius = world.getComponent(jPrev.entityB, RadiusComponent)?.radius;
      if (!roller || radius === undefined) continue;
      const P1 = jPrev.attachmentPointB_world, P2 = jNext.attachmentPointA_world, R = radius + halfWidth;
      const taut = (j) => j.attachmentPointA_world.distanceTo(j.attachmentPointB_world) > j.restLength + 1e-6;
      ctx.lineWidth = physicalCableWidthPx(path.cableHalfWidth);
      ctx.strokeStyle = taut(jPrev) && taut(jNext) ? baseColor : 'orange';
      ctx.beginPath();
      ctx.arc(cX(roller.x), cY(roller.y), R * S, -Math.atan2(P1.y - roller.y, P1.x - roller.x), -Math.atan2(P2.y - roller.y, P2.x - roller.x), !path.cw[i]);
      ctx.stroke();
    }
    const nLinks = path.linkTypes.length;
    if (path.linkTypes[0] === 'hybrid') {
      const j0 = world.getComponent(joints[0], CableJointComponent), c = world.getComponent(j0.entityA, PositionComponent)?.pos, r = world.getComponent(j0.entityA, RadiusComponent)?.radius;
      if (c && r) drawEndpointStoredWrap(path, 0, c, r, j0.attachmentPointA_world, baseColor);
    }
    if (path.linkTypes[nLinks - 1] === 'hybrid') {
      const jn = world.getComponent(joints[nLinks - 2], CableJointComponent), c = world.getComponent(jn.entityB, PositionComponent)?.pos, r = world.getComponent(jn.entityB, RadiusComponent)?.radius;
      if (c && r > 1e-6) drawEndpointStoredWrap(path, nLinks - 1, c, r, jn.attachmentPointB_world, baseColor);
    }
  }

  const circles = [...game.obstacles, ...game.balls];
  for (const b of circles) {
    const wobble = b.kind === 'obstacle' ? wobbleOffset(b.id) : null;
    const r = rawRadius(b);
    ctx.save();
    ctx.translate(cX(b.pos.x + (wobble?.x ?? 0)), cY(b.pos.y + (wobble?.y ?? 0)));
    ctx.rotate(-(b.quat ? angleOf(b.quat) : 0));
    if (wobble && Math.abs(wobble.stretch) > 1e-6) ctx.scale(Math.max(0.72, 1 + wobble.stretch), Math.max(0.72, 1 - wobble.stretch));
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(0, 0, r * S, 0, 2 * Math.PI); ctx.fill();
    if (b.quat) { ctx.strokeStyle = '#000'; ctx.lineWidth = unit; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -r * S); ctx.stroke(); }
    ctx.restore();
  }

  // hybrid-link markers
  for (const pathId of pathIds) {
    const path = world.getComponent(pathId, CablePathComponent);
    for (let i = 0; i < path.linkTypes.length; i++) {
      if (path.linkTypes[i] !== 'hybrid' && path.linkTypes[i] !== 'hybrid-attachment') continue;
      const point = pathLinkStartAttachment(path, i), entityId = pathLinkEntity(path, i), body = bodyOf(entityId);
      if (!point || !body) continue;
      ctx.beginPath();
      if (path.linkTypes[i] === 'hybrid-attachment') { ctx.fillStyle = '#ff0000'; ctx.arc(cX(point.x), cY(point.y), 1.5 * unit, 0, 1.5 * Math.PI); ctx.fill(); continue; }
      const halfWidth = layering ? (path.cableHalfWidth ?? 0) : 0, base = rawRadius(body) + halfWidth;
      const stored = Math.max(0, path.stored[i] ?? 0), cw = path.cw[i];
      const ta = Math.atan2(point.y - body.pos.y, point.x - body.pos.x);
      let lr = base, partial = stored, layer = 0;
      while (layering && 2 * halfWidth > 1e-12 && layer < 128 && partial > 2 * Math.PI * lr + 1e-9) { partial -= 2 * Math.PI * lr; layer++; lr = base + 2 * halfWidth * layer; }
      const a = layering ? (partial > 1e-9 && lr > 1e-9 ? partial / lr : 0) : stored / base;
      const end = cw ? ta - a : ta + a;
      ctx.fillStyle = '#ff0000'; ctx.arc(cX(body.pos.x + base * Math.cos(end)), cY(body.pos.y + base * Math.sin(end)), 1.5 * unit, 0, 2 * Math.PI); ctx.fill();
    }
  }

  if (flags.layeringRenderCollisionOverlays !== false) drawCollisionOverlays(unit);
  drawBumperFx();
}

function drawCollisionOverlays(unit) {
  ctx.save();
  ctx.setLineDash([4, 3]); ctx.lineWidth = Math.max(1, 1.25 * unit); ctx.strokeStyle = 'rgba(0, 220, 255, 0.98)';
  for (const b of game.bodies) {
    if (!b.overlay || !(b.overlay.radius > 1e-9)) continue;
    ctx.beginPath(); ctx.arc(cX(b.pos.x), cY(b.pos.y), b.overlay.radius * S, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const b of game.bodies) {
    for (const s of b.sectors) {
      ctx.fillStyle = 'rgba(255, 136, 0, 0.18)'; ctx.strokeStyle = 'rgba(255, 136, 0, 0.95)';
      ctx.beginPath(); ctx.moveTo(cX(b.pos.x), cY(b.pos.y)); ctx.arc(cX(b.pos.x), cY(b.pos.y), s.radius * S, -s.startAngle, -s.endAngle, s.cw !== true); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(cX(b.pos.x), cY(b.pos.y), s.radius * S, -s.startAngle, -s.endAngle, s.cw !== true); ctx.stroke();
    }
  }
  ctx.setLineDash([3, 2]); ctx.lineWidth = Math.max(1, 1.75 * unit); ctx.strokeStyle = 'rgba(255, 40, 180, 0.95)';
  for (const c of game.contacts.ballBall) {
    if (!c.pinchShared) continue;
    for (const [b, r] of [[c.a, c.radiusA], [c.b, c.radiusB]]) { ctx.beginPath(); ctx.arc(cX(b.pos.x), cY(b.pos.y), r * S, 0, 2 * Math.PI); ctx.stroke(); }
  }
  for (const c of game.contacts.obstacle) {
    if (!c.pinchShared) continue;
    for (const [b, r] of [[c.ball, c.ballRadius], [c.obs, c.obstacleRadius]]) { ctx.beginPath(); ctx.arc(cX(b.pos.x), cY(b.pos.y), r * S, 0, 2 * Math.PI); ctx.stroke(); }
  }
  ctx.restore();
}

// ---------------------------------------------------------------- UI & loop
function updateStats() {
  const path = world.getComponent(game.pathId, CablePathComponent);
  const forces = path ? path.jointEntities.map(id => finiteOr(world.getComponent(id, CableJointComponent)?.constraintForceMagnitude, NaN).toFixed(3)) : [];
  statsEl.textContent = `dt: ${(dt * 1000).toFixed(2)}ms | Speed: ${speedText} | links: ${path ? path.linkTypes.join(',') : '-'}\njoint forces [${forces.join(', ')}] N`;
  scoreEl.textContent = game.score;
}

function gameLoop(now) {
  if (lastTime === 0) lastTime = now;
  const frameSec = (window._flipperSpeedScale ?? 1.0) * (now - lastTime) / 1000;
  let simTime = 0;
  if (frameSec >= dt) {
    lastTime = now;
    accumulator = Math.min(accumulator + frameSec, dt * (window._flipperMaxSubSteps ?? MAX_STEPS_PER_FRAME));
    while (accumulator >= dt) {
      const stepping = doStep || stepWhileKeyHeld;
      if (!paused || stepping) {
        stepSim();
        simTime += dt;
        doStep = false;
      }
      if (paused && !stepWhileKeyHeld) { accumulator = 0; break; }
      accumulator -= dt;
    }
  }
  if (frameSec > 1e-6 && simTime > 0) {
    speedSamples.push(simTime / frameSec);
    if (speedSamples.length > 60) speedSamples.shift();
  }
  if (++frameCounter % 10 === 0 && speedSamples.length) speedText = `${(speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length).toFixed(2)}x`;
  draw(); updateStats();
  requestAnimationFrame(gameLoop);
}

function dumpState() {
  const path = world.getComponent(game.pathId, CablePathComponent);
  console.log(JSON.stringify({
    score: game.score,
    bodies: game.bodies.map(b => ({ id: b.id, kind: b.kind, x: b.pos.x, y: b.pos.y, vx: b.vel?.x, vy: b.vel?.y, omega: b.omega?.z })),
    path: path && { linkTypes: path.linkTypes, cw: path.cw, stored: path.stored, joints: path.jointEntities.length, totalRestLength: path.totalRestLength },
  }, null, 1));
}

function buildFlagUi() {
  const container = document.getElementById('flags');
  for (const def of FLAG_DEFS) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox'; input.checked = flags[def.key]; input.id = `flag_${def.key}`;
    input.addEventListener('change', () => {
      flags[def.key] = input.checked; world.setResource(def.key, input.checked);
      if (def.key === 'scoreBounceSoundEnabled' && input.checked) { ensureAudio(); playScoreSound(); }
      input.blur();
    });
    label.append(input, ` ${def.label}`);
    container.append(label);
  }
}

function resetScene() {
  if (game?.grab) endGrab();
  ({ world, game } = buildScene());
  accumulator = 0; lastTime = 0; speedSamples = []; setPaused(true); pauseBtn.textContent = 'Start';
}

function logInput(clicks, releases) {
  game.inputLog.push({ frame: game.frame, clicks, releases });
}

// Same trace the original Space key printed: world resources plus the recorded click/release log.
function dumpScenario() {
  const entries = game.inputLog.map(e => `{ "frame": ${e.frame}, "clicks": ${JSON.stringify(e.clicks)}, "releases": ${JSON.stringify(e.releases)} }`);
  console.log('DEBUG_SCENARIO_DUMP', `{ "resources": ${JSON.stringify(world.resources)}, "inputLog": [${entries.join(', ')}] }`);
}

function bindInput() {
  // Like the original, presses and releases are listened to on the whole document so a flipper is
  // released even when the pointer leaves the canvas; the control bar keeps its own clicks.
  document.addEventListener('pointerdown', ev => {
    if (ev.target.closest('#controls')) return;
    ev.preventDefault(); ensureAudio();
    const p = simPoint(ev);
    const extra = (0.5 * 96 / 2.54) / (canvas.getBoundingClientRect().height / SIM_H);
    let closest = null, best = Infinity;
    for (const b of game.balls) {
      const r = maxCollisionRadius(b) + extra, d2 = (p.x - b.pos.x) ** 2 + (p.y - b.pos.y) ** 2;
      if (d2 <= r * r && d2 < best) { closest = b; best = d2; }
    }
    if (closest) { canvas.setPointerCapture(ev.pointerId); startGrab(closest, p); return; }
    pressAt(p);
    logInput([p], []);
  });
  canvas.addEventListener('pointermove', ev => {
    if (!game.grab) return;
    const p = simPoint(ev);
    game.grab.pos.x = p.x; game.grab.pos.y = p.y;
  });
  const up = ev => {
    if (ev.target.closest('#controls')) return;
    if (game.grab) { endGrab(); return; }
    const p = simPoint(ev);
    releaseAt(p);
    logInput([], [p]);
  };
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
  window.addEventListener('keydown', ev => {
    ensureAudio();
    if (ev.target.tagName === 'INPUT' || ev.repeat) return;
    if (ev.code === 'Space') dumpScenario();
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
      ev.preventDefault();
      const f = flipperForKey(ev.key);
      if (f) { f.pressed = true; logInput([{ x: f.pos.x, y: f.pos.y }], []); }
    }
    const key = ev.key.toLowerCase();
    if (key === 's' || key === 't') { ev.preventDefault(); stepWhileKeyHeld = true; if (paused) doStep = true; }
  });
  window.addEventListener('keyup', ev => {
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
      const f = flipperForKey(ev.key);
      if (f) { f.pressed = false; logInput([], [{ x: f.pos.x, y: f.pos.y }]); }
    }
    const key = ev.key.toLowerCase();
    if (key === 's' || key === 't') stepWhileKeyHeld = false;
  });
  pauseBtn.addEventListener('click', () => setPaused(!paused));
  document.getElementById('resetBtn').addEventListener('click', resetScene);
  document.getElementById('stepBtn').addEventListener('click', () => { if (paused) doStep = true; });
  document.getElementById('dumpBtn').addEventListener('click', dumpState);
}

(async () => {
  try {
    const wasm = await fetch(`${BASE}wasm/cable_solver.wasm`);
    if (!wasm.ok) throw new Error(`cable_solver.wasm: ${wasm.status}`);
    backend = new WasmPhysicsEngine(await compileCableSolverWasm(await wasm.arrayBuffer()));
    const scene = await fetch(`${BASE}usd_scenes/flipper_scene.usda`);
    if (!scene.ok) throw new Error(`flipper_scene.usda: ${scene.status}`);
    sceneText = await scene.text();
    ({ world, game } = buildScene());
    buildFlagUi(); bindInput();
    window.flipperDebug = { get world() { return world; }, get game() { return game; }, get dt() { return dt; }, get flags() { return flags; },
      step(n) { for (let i = 0; i < n; i++) stepSim(); }, reset: resetScene };
    requestAnimationFrame(gameLoop);
  } catch (error) {
    statsEl.textContent = `Failed to start: ${error.message}`;
    throw error;
  }
})();
</script>
</body>
</html>
